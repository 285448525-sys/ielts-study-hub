<!-- frame-ancestors 只由 HTTP 响应头下发（CF Pages 根目录 _headers）：按 CSP 规范它写在 meta 里会被浏览器忽略，本页 meta CSP 不再包含该指令 -->

<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<style id="homePageStyle">
/* hero 会员小标（10/1：AI 转化卡删掉后的低调会员态展示，她拍板「不明显但不能不显示」。
   样式放页内不动 common.css 免全站 bump） */
/* 10/1 晚改版：会员小标从气泡改纯文字——会员=黄色 VIP，非会员=灰色 免费版（她拍板：气泡太显眼） */
.vip-chip{display:inline-flex;align-items:center;font-size:12.5px;font-weight:800;line-height:1;letter-spacing:.5px;white-space:nowrap;text-decoration:none}
.vip-chip.vip{color:#d9a400}
.vip-chip.free{color:var(--muted)}
[data-theme="dark"] .vip-chip.vip{color:#fcd34d}
[data-theme="dark"] .vip-chip.free{color:#94a3b8}
/* 双卡布局 override（common.css .meta 仍写死三列等死样式清理；1100px 断点同为两列无需写，760px 恢复单列） */
.home .meta{grid-template-columns:repeat(2,1fr)}
@media(max-width:760px){ .home .meta{grid-template-columns:1fr} }

/* ===== 10/5 路线图①-2「继续上次」卡 =====
   设计判据：它是「回访用户的加速器」，不是新用户的入口堆 →
     · 放在 hero 倒计时**之前**（回访的人第一眼就要看到，不必先看倒计时）
     · 只给 1 个动作 + 1 个收起，不塞第二行
     · 收起后留一条极窄的按钮（不是完全消失，否则等于没有）
   质感靠层级（字重/颜色）不靠字号 —— 与她 10/3 的纠正一致。 */
#resumeCard{margin-bottom:12px}
.resume-card{
  display:flex;align-items:center;gap:12px;
  background:var(--n-0);border:1px solid var(--primary-200);border-radius:var(--radius,16px);
  padding:13px 14px;box-shadow:var(--shadow,0 1px 2px rgba(16,24,40,.04));
}
.resume-l{flex:1;min-width:0}
.resume-t{font-size:15px;font-weight:700;line-height:1.4;color:var(--ink);
  overflow-wrap:anywhere}   /* 长任务名换行，绝不 ellipsis 切内容 */
.resume-s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.resume-r{display:flex;align-items:center;gap:8px;flex:none}
.resume-go{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:36px;padding:0 16px;border-radius:999px;
  background:var(--primary-600,var(--primary));color:#fff;
  font-size:14px;font-weight:700;text-decoration:none;white-space:nowrap;
  transition:background .15s;
}
.resume-go:hover{background:var(--primary-700,var(--primary))}
.resume-foldbtn{
  min-height:36px;padding:0 10px;border-radius:999px;cursor:pointer;
  background:transparent;border:1px solid var(--n-200,var(--n-100));color:var(--muted);
  font:inherit;font-size:12.5px;transition:background .15s,color .15s;
}
.resume-foldbtn:hover{background:var(--n-50,var(--n-100));color:var(--ink)}
/* 收起态：一条窄按钮，高度克制（别又占一整卡） */
.resume-fold{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:var(--n-0);border:1px dashed var(--n-200,var(--n-100));border-radius:var(--radius,16px);
  padding:9px 13px;font:inherit;color:var(--muted);
}
.resume-fold:hover{background:var(--n-50,var(--n-100))}
.rf-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none}
.rf-tx{font-size:13px;font-weight:700;color:var(--ink);flex:none}
.rf-sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media(max-width:560px){
  .resume-card{flex-wrap:wrap}
  .resume-r{width:100%;justify-content:flex-end}
  .rf-sub{display:none}   /* 极窄屏收起态只留「继续上次」四字，横向空间优先给动作 */
}

/* ===== 10/5 路线图②-2a「今天先做这三件事」卡 =====
   它是回答「我现在该点什么」的地方，所以每行必须有**一个明确动作**（不写"去学习"这类虚的）。
   质感：白卡 + 细分隔线，标题靠字重不用大字号（她 10/3 的纠正）。 */
#threeThings{margin-bottom:12px}
.three-card{
  background:var(--n-0);border:1px solid var(--n-200,var(--n-100));border-radius:var(--radius,16px);
  padding:4px 14px 6px;box-shadow:var(--shadow,0 1px 2px rgba(16,24,40,.04));
}
.three-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0 8px}
.three-h h3{margin:0;font-size:14px;font-weight:700;color:var(--ink);line-height:1.4}
.three-foldbtn{
  border:0;background:transparent;color:var(--muted);cursor:pointer;
  font:inherit;font-size:12.5px;padding:6px 8px;border-radius:8px;flex:none;
}
.three-foldbtn:hover{background:var(--n-50,var(--n-100));color:var(--ink)}
.three-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--n-100,var(--n-50))}
.three-l{flex:1;min-width:0}
.three-t{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.4;overflow-wrap:anywhere}
.three-s{font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.three-go{
  display:inline-flex;align-items:center;justify-content:center;flex:none;
  min-height:34px;padding:0 15px;border-radius:999px;
  background:var(--primary-50);color:var(--primary-700);
  border:1px solid var(--primary-200);
  font-size:13.5px;font-weight:700;text-decoration:none;white-space:nowrap;
  transition:background .15s;
}
.three-go:hover{background:var(--primary-100)}
/* 收起态：与「继续上次」同样的窄按钮形态 */
.three-fold{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  background:var(--n-0);border:1px dashed var(--n-200,var(--n-100));border-radius:var(--radius,16px);
  padding:9px 13px;font:inherit;color:var(--muted);
}
.three-fold:hover{background:var(--n-50,var(--n-100))}
.tf-dot{width:7px;height:7px;border-radius:50%;background:var(--primary);flex:none}
.tf-tx{font-size:13px;font-weight:700;color:var(--ink)}
@media(max-width:560px){
  .three-row{flex-wrap:wrap}
  .three-go{width:100%;min-height:40px}   /* 移动端：动作按钮整行，命中区达标 */
}
</style>

<main class="container home">
  <!-- v6 首页：hero 倒计时 + 紧凑双卡 + 快速入口 + 今日记录（design/31 A 版） -->

  <!-- 10/5 路线图①-2：顶部「继续上次」卡。有未完成事项才渲染（无事项整卡 hidden，不占新用户首屏）。

       与上面的「继续上次」分工：那张回到上次那件事，这张给今天还没做的第一件事。
       折叠态存 localStorage（hub_three_folded），不进 DATA。内容由 index.js renderThreeThings 写。 -->
  <section id="threeThings" hidden></section>

  <!-- L1 · hero 倒计时主卡（问候/目标/连续天数已收进卡内，避免顶部独立横条造成左侧空白） -->
  <section class="hero">

  <!-- L1.5 考前冲刺卡已迁回顾页·模考 Tab（10/1 她拍板：首页放琥珀大卡不美观） -->

  <section class="meta">

      </div>
    </a>
    <a class="meta-card" href="practice.html">
      <div class="meta-left">
        <div class="label">今日待学</div>
        <div class="val" id="dashDueWords"></div>
        <div class="hint" id="dashDueHint"></div>
      </div>
      <div class="meta-ico blue">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5zM4 5a3 3 0 0 1 3-3h9"/><path d="M9 9h7M9 13h5"/></svg>
      </div>
    </a>
  </section>

  <!-- L2.5 · 今日任务卡（9/20 新增：打开首页就知道今天该做什么——到期词建议 + 今日计划清单；内容由 index.js renderDashTasks 渲染） -->
  <section class="dash-tasks" id="dashTodayTasks"></section>

  <!-- L3 · 4 模块快速入口已删（9/25 她拍板：侧栏已可导航，模块卡多余） -->

  <!-- 今日学习记录 -->
  <section class="rec">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="dashRecTotal">0h0m</b></span>
