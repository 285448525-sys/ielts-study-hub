<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<main class="container home">
  <!-- ═══ HOME-RELAYOUT-1（11-11 · 她点头「密度适中」修订版）═══
       按 design/HOME-RELAYOUT-1-首页整体重新布局_样子稿_2026-11-11.html 1:1 重排：
         通栏欢迎条（日期+问候两行+真实徽标+一句真数据+距考大数字）→ 设置条
         → 主区两张卡（今天先做这些 / 今日完成度）→ 本周状态四小卡 → 继续学习四入口
       🔴 27 个业务 id 一个没改名（js/index.js 与 home-quick.js 全按它们写），只重排容器与皮肤；
         任务/周历/状态/快速入口内容全是 JS 现算现填，这里不写任何示意假数字。
       🔴 她明确「不要用 emoji」：去掉旧版挥手，图标一律线性 SVG。
       🔴 问候仍用 span 不用 h1（绕开 css/common.css 末尾 .hero h1 隐藏规则）。 -->
  <div class="hlayout">

      <!-- ① 欢迎条（通栏浅底分区，非重卡） -->
      <section class="hero">
        <div class="hg2-left">
          <span class="eyebrow" id="dashDate"></span>
          <div class="hg2-hi"><span id="dashHello">你好</span>，<span id="userName">Camille</span></div>
          <div class="hg2-pills">
            <span class="streak-chip" id="dashStreakChip" hidden></span>
            <a class="vip-chip" id="heroVipChip" href="vip.html" hidden></a>
          </div>
          <!-- 一句今天真实要做的事（js/index.js renderHg2Sub 读今日 DATA.plans，不编） -->
          <div class="hg2-sub" id="hg2Sub" hidden></div>
        </div>
        <!-- 距考大数字：JS 渲染两态；CD-1b 口径：父不能是 flex，b 必须行内混排 -->
        <div class="countdown" id="dashHeroNum"></div>
      </section>

      <!-- ② 设置补齐条（W-UI-1 逻辑不动：四项配齐 → 整条不渲染） -->
      <div class="setup" id="homeSetup" hidden></div>

      <!-- ③ 主区左卡：今天先做这些（三件事 / 今日任务卡由 JS 二选一渲染） -->
      <div class="hmain">
        <section id="threeThings" hidden></section>
        <section class="dash-tasks" id="dashTodayTasks"></section>
      </div>

      <!-- ③ 主区右卡：今日完成度（环 + 周历 + 快速入口，手机端也常显） -->
      <aside class="hrail" id="homeRail">
        <button class="hrail-toggle" id="railToggle" type="button" aria-expanded="false" aria-controls="railBody">
          <span class="ht-ring" aria-hidden="true"><svg viewBox="0 0 26 26" width="26" height="26" aria-hidden="true"><circle cx="13" cy="13" r="10" fill="none" stroke="var(--primary-50)" stroke-width="3.5"/><circle id="railToggleRing" cx="13" cy="13" r="10" fill="none" stroke="var(--primary-500)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="62.8" stroke-dashoffset="62.8" transform="rotate(-90 13 13)"/></svg></span>
          <span class="ht-tx">今日完成 <b id="railTogglePct">0%</b> · 连续 <b id="railToggleStreak">0</b> 天</span>
          <svg class="ht-cv" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9.5l6 6 6-6"/></svg>
        </button>
        <div class="hrail-body" id="railBody">
          <div class="rail-card">
            <div class="rc-cap">今日完成度</div>
            <div class="ringwrap">
              <svg viewBox="0 0 96 96" width="96" height="96" aria-hidden="true"><circle class="rbg2" cx="48" cy="48" r="38"/><circle class="rfg2" id="railRingFg" cx="48" cy="48" r="38"/></svg>
              <div class="ringtxt"><b id="railPct">0%</b></div>
            </div>
            <div class="rc-sub" id="railSub"></div>
            <div class="week7" id="homeWeek7"></div>
          </div>
          <div class="rail-quick">
            <div class="rc-cap">快速入口<button class="rq-edit" id="rqEdit" type="button" aria-expanded="false" aria-haspopup="dialog">编辑</button></div>
            <div class="rq-list" id="rqList"></div>
          </div>
        </div>
      </aside>

      <!-- ④ 本周状态：四张紧凑小指标卡（数字仍由 JS 填） -->
      <div class="sec-cap">本周状态</div>
      <section class="metrics">
        <a class="metric" href="timer.html">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>今日专注</div>
          <div class="value" id="statFocusVal"></div>
          <div class="sub" id="statFocusSub"></div>
          <div class="track"><i id="statFocusTrack" style="width:0%"></i></div>
        </a>
        <a class="metric" href="practice.html">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>今日单词</div>
          <div class="value" id="statWordsVal"></div>
          <div class="sub" id="statWordsSub"></div>
          <div class="track"><i id="statWordsTrack" style="width:0%"></i><i class="g" id="statWordsTrackHard" style="width:0%"></i></div>
        </a>
        <a class="metric" href="speaking.html">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>口语已练</div>
          <div class="value" id="statSpkVal"></div>
          <div class="sub" id="statSpkSub"></div>
        </a>
        <a class="metric" href="bank.html">
          <div class="label"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7V3z"/><path d="M14 3v5h5"/><path d="M10 12h6M10 16h6"/></svg>本周模考</div>
          <div class="value" id="statMockVal"></div>
          <div class="sub" id="statMockSub"></div>
        </a>
      </section>

      <!-- ⑤ 继续学习：四入口紧凑格 -->
      <div class="sec-cap">继续学习</div>
      <section class="hmods">
        <a class="hmod" href="bank.html"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h7l5 5v13H7V3z"/><path d="M14 3v5h5"/><path d="M10 12h6M10 16h6"/></svg></span><span class="tx"><b>模考</b><span>阅读 · 听力 · 写作 · 口语</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></a>
        <a class="hmod" href="practice.html"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg></span><span class="tx"><b>单词</b><span>学习与管理你的单词</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></a>
        <a class="hmod" href="corpus.html"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5h16M4 11.5h16M4 16.5h9"/></svg></span><span class="tx"><b>句子</b><span>长难句 · 错题 · 听写</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></a>
        <a class="hmod" href="speaking.html"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></span><span class="tx"><b>口语</b><span>题库 + AI 串题 + 陪练</span></span><svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></a>
      </section>
  </div>
</main>

  <!-- 10-23 5-2：快速入口编辑面板。挂在 body 直下 + position:fixed，由 js/home-quick.js 定位
