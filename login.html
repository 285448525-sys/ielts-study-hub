<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>登录 · 雅思备考站</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<style>
:root{
  --p-50:#eef7f6; --p-100:#d3ebe8; --p-200:#a8d7d2; --p-500:#3a9a93; --p-600:#2f867f; --p-700:#2c7873; --p-900:#1a4542;
  --n-0:#fff; --n-300:#e6e8eb; --n-500:#a8adb5; --n-600:#71767e; --n-700:#4a4f57; --n-900:#14161a;
  --line:#e6e8eb; --danger:#c0392b;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--n-700);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--p-50) 0%,#f6fbfa 45%,#eef4f9 100%);
  display:flex;flex-direction:column;
}
.top{max-width:1040px;width:100%;margin:0 auto;padding:20px 24px;display:flex;justify-content:space-between;align-items:center}
.top a{color:var(--p-700);text-decoration:none;font-size:14px;font-weight:500}
.top a:hover{color:var(--p-900)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 24px 48px}
.duo{display:grid;grid-template-columns:1.15fr .85fr;gap:22px;max-width:1000px;width:100%}
.card{background:var(--n-0);border-radius:18px;box-shadow:0 18px 50px rgba(26,69,66,.10),0 2px 8px rgba(26,69,66,.05);padding:44px}
/* 左：品牌 */
.brand .mark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.brand .mark i{width:38px;height:38px;border-radius:11px;background:var(--p-500);color:#fff;display:grid;place-items:center;font-style:normal;font-size:17px;font-weight:700}
.brand .mark b{font-size:17px;color:var(--n-900);font-weight:600}
.brand .mark span{font-size:12px;color:var(--n-500);margin-left:2px}
.brand h1{font-size:38px;line-height:1.22;color:var(--n-900);margin:0 0 16px;font-weight:700;letter-spacing:-.5px}
.brand h1 em{font-style:normal;color:var(--p-600)}
.brand .sub{font-size:14.5px;line-height:1.8;color:var(--n-600);margin:0 0 26px;max-width:400px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.facts div{background:#f6f8f9;border-radius:12px;padding:14px 12px}
.facts b{display:block;font-size:19px;color:var(--n-900);font-weight:700;margin-bottom:3px}
.facts span{font-size:12px;color:var(--n-600)}
/* 右：表单 */
.form h2{font-size:24px;color:var(--n-900);margin:0 0 8px;font-weight:700}
.form .desc{font-size:13.5px;color:var(--n-600);margin:0 0 24px}
label{display:block;font-size:13px;color:var(--n-700);font-weight:500;margin:14px 0 6px}
input{
  width:100%;height:46px;border:1.5px solid var(--line);border-radius:11px;padding:0 14px;
  font-size:15px;color:var(--n-900);background:#fff;outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--p-500)}
input::placeholder{color:var(--n-500)}
.btn{
  width:100%;height:48px;border:0;border-radius:11px;background:var(--p-500);color:#fff;
  font-size:16px;font-weight:600;cursor:pointer;margin-top:22px;transition:background .15s;
}
.btn:hover{background:var(--p-600)}
.btn:disabled{opacity:.6;cursor:default}
.links{margin-top:14px;text-align:center;font-size:13.5px}
.links a{color:var(--p-700);text-decoration:none;font-weight:500;cursor:pointer}
.links a:hover{color:var(--p-900)}
.links .dim{color:var(--n-600)}
.note{font-size:13.5px;margin:12px 0 0;color:var(--n-600);min-height:18px}
.note.bad{color:var(--danger)}
.hidden{display:none!important}
.foot-note{max-width:1000px;margin:0 auto;padding:0 24px 26px;font-size:12.5px;color:var(--n-500);text-align:center}
@media (max-width:880px){
  .duo{grid-template-columns:1fr}
  .card{padding:32px 26px}
  .brand h1{font-size:30px}
}
</style>
</head>
<body>
<div class="top"><a href="index.html">← 返回产品介绍</a></div>

<div class="stage">
  <div class="duo">
    <!-- 左：品牌 -->
    <div class="card brand">
      <div class="mark"><i>雅</i><b>雅思备考站</b><span>间隔重复驱动的备考系统</span></div>
      <h1>把备考节奏交给<br /><em>可坚持</em> 的系统</h1>
      <p class="sub">背词、口语串题、写作、错题、模考记在同一份进度里：今天该复习什么、离目标还差多少，打开就知道。</p>
      <div class="facts">
        <div><b>100 题</b><span>本季口语题库</span></div>
        <div><b>570 词</b><span>官方 AWL 词表</span></div>
        <div><b>25–40 分</b><span>专注任务块节奏</span></div>
      </div>
    </div>

    <!-- 右：表单 -->
    <div class="card form">
      <!-- 登录模式 -->
      <div id="modeLogin">
        <h2>登录学习台</h2>
        <p class="desc">进入你的备考空间，继续背词、串题和刷题。</p>
        <label>手机号 / 用户名</label>
        <input id="acct" placeholder="手机号或用户名（6-20 位）" autocomplete="username" />
        <label>密码</label>
        <input id="pass" type="password" placeholder="至少 6 位" autocomplete="current-password" />
        <button class="btn" id="goLogin" type="button">登 录</button>
        <p class="note" id="noteLogin"></p>
        <div class="links"><span class="dim">没有账号？</span><a id="toRegister">设置密码注册 · 1 分钟</a></div>
        <div class="links" style="margin-top:8px"><a id="forgotPass">忘记密码？</a></div>
        <p class="note" id="noteForgot" style="font-size:12.5px;margin-top:6px;color:#71767e"></p>
      </div>

      <!-- 注册模式 -->
      <div id="modeRegister" class="hidden">
        <h2>设置密码</h2>
        <p class="desc">账号 + 密码完成绑定，多设备数据互通。老用户（之前只填过手机号）也在这里设密码，数据会自动接上。</p>
        <label>手机号 / 用户名</label>
        <input id="rAcct" placeholder="手机号或自取用户名（6-20 位）" autocomplete="username" />
        <label>密码</label>
        <input id="rPass" type="password" placeholder="至少 6 位" autocomplete="new-password" />
        <label>邀请码（选填）</label>
        <input id="rInvite" placeholder="站长的内测码，填了注册即送会员" autocomplete="off" style="text-transform:uppercase" />
        <button class="btn" id="goRegister" type="button">设置密码并进入</button>
        <p class="note" id="noteRegister"></p>
        <div class="links"><a id="backLogin1">返回登录</a></div>
      </div>
    </div>
  </div>
</div>
<p class="foot-note">登录即表示数据将同步到你的账号云端；不登录也能离线使用，数据只存本机。</p>

<script>
(function(){
  var HUB_KEY = 'ielts_study_hub_v1', TOKEN_KEY = 'hub_auth_token';
  var $ = function(id){ return document.getElementById(id); };
  var ACCT_RE = /^[a-z0-9_]{6,20}$/;

  /* 已登录（token + 本机账号）直接进站，不再看登录页 */
  try{
    if(localStorage.getItem(TOKEN_KEY) && localStorage.getItem(HUB_KEY)) location.replace('home.html');
  }catch(e){}

  var MODES = ['Login','Register'];   // 恢复码展示/找回密码两模式已随恢复码机制下线（她 10/1 拍板）
  function show(m){
    MODES.forEach(function(x){ $('mode' + x).classList.toggle('hidden', x !== m); });
  }
  function note(id, t, bad){
    var el = $(id);
    el.textContent = t || '';
    el.className = 'note' + (bad ? ' bad' : '');
  }
  function busy(btn, b, txt){
    btn.disabled = b;
    if(txt) btn.textContent = txt;
  }

  /* 登录成功 / 重置成功：写 token + 账号 → 进站。
     ⚠️ 本机已有学习数据时绝不覆盖 HUB_KEY：只补 token 和 syncCode（老设备从设置页或这里重登都安全）。 */
  function enterStation(acct, token){
    try{ localStorage.setItem(TOKEN_KEY, token); }catch(e){}
    try{
      var raw = localStorage.getItem(HUB_KEY), obj = raw ? JSON.parse(raw) : null;
      if(obj && typeof obj === 'object' && !Array.isArray(obj)){
        obj.settings = obj.settings || {};
        obj.settings.syncCode = acct;
        obj.settings.autoSync = true;
        localStorage.setItem(HUB_KEY, JSON.stringify(obj));
      } else {
        localStorage.setItem(HUB_KEY, JSON.stringify({ v:1, settings:{ syncCode: acct, autoSync: true, aiChannel:'auto' } }));
      }
    }catch(e){}
    location.href = 'home.html';
  }
  function post(payload){
    return fetch('api/auth', { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { status:r.status, j:j }; }); });
  }

  /* 模式切换 */
  $('toRegister').addEventListener('click', function(){ note('noteRegister',''); show('Register'); $('rAcct').value = $('acct').value; $('rAcct').focus(); });
  $('backLogin1').addEventListener('click', function(){ show('Login'); });
  $('forgotPass').addEventListener('click', function(){
    var n = $('noteForgot');
    if(n.style.display === 'none'){ n.style.display = 'block'; }
    n.innerHTML = '目前没有自助找回——联系站长微信 <b>g285448525</b> 帮你重开账号，老数据不会丢（数据跟账号走，只在你重新登录后恢复）。';
  });

  /* 登录 */
  $('goLogin').addEventListener('click', function(){
    var acct = ($('acct').value || '').trim().toLowerCase();
    var pass = $('pass').value || '';
    if(!ACCT_RE.test(acct)){ note('noteLogin','账号格式：6-20 位数字/字母/下划线', true); return; }
    if(!pass){ note('noteLogin','请输入密码', true); return; }
    note('noteLogin','正在登录…', false);
    busy($('goLogin'), true, '登录中…');
    post({ action:'login', acct:acct, password:pass }).then(function(r){
      if(r.j.ok && r.j.token){ enterStation(r.j.acct || acct, r.j.token); return; }
      note('noteLogin', r.j.msg || ('登录失败（HTTP ' + r.status + '）'), true);
      busy($('goLogin'), false, '登 录');
    }).catch(function(){
      note('noteLogin','网络异常，稍后再试', true);
      busy($('goLogin'), false, '登 录');
    });
  });
  $('pass').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('goLogin').click(); });

  /* 注册（设置密码）→ 成功后自动登录进站。
     服务端 register 只建账号不发 token，这里紧接一次 login 换 token（恢复码已下线，10/1）。 */
  $('goRegister').addEventListener('click', function(){
    var acct = ($('rAcct').value || '').trim().toLowerCase();
    var pass = $('rPass').value || '';
    var inv  = ($('rInvite').value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');   // 与服务端同口径归一化
    if(!ACCT_RE.test(acct)){ note('noteRegister','账号格式：6-20 位数字/字母/下划线', true); return; }
    if(pass.length < 6){ note('noteRegister','密码至少 6 位', true); return; }
    /* 邀请码选填（她 10/1 二次拍板）：不填=普通注册吃免费额度；填内测码=注册即送会员（服务端开） */
    note('noteRegister','正在设置密码…', false);
    busy($('goRegister'), true, '设置中…');
    post({ action:'register', acct:acct, password:pass, inviteCode:inv }).then(function(r){
      if(r.j.ok){
        /* 内测码送会员：让提示停留片刻再进站，否则用户根本不知道自己成了会员 */
        if(r.j.vipGranted > 0) note('noteRegister','🎉 内测码生效：会员 ' + r.j.vipGranted + ' 天已开通，正在进入…', false);
        return post({ action:'login', acct:acct, password:pass }).then(function(r2){
          busy($('goRegister'), false, '设置密码并进入');
          if(r2.j.ok && r2.j.token){ enterStation(r2.j.acct || acct, r2.j.token); return; }
          /* 极少见：自动登录失败（如网络抖动）。回登录页让用户手动登一次 */
          note('noteLogin','设置成功，请用刚设置的密码登录一次', false);
          $('acct').value = acct;
          show('Login');
        });
      }
      busy($('goRegister'), false, '设置密码并进入');
      note('noteRegister', r.j.msg || ('注册失败（HTTP ' + r.status + '）'), true);
    }).catch(function(){
      note('noteRegister','网络异常，稍后再试', true);
      busy($('goRegister'), false, '设置密码并进入');
    });
  });
  $('rPass').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('goRegister').click(); });
  $('rInvite').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('goRegister').click(); });
})();
</script>
</body>
</html>
