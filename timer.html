<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>计时学习 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/timer.js"></script>
<style>
  /* 计时主页：5 个模块 3+2 居中排列 */
  .timer-mods{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:6px}
  .timer-mods .mod-card{flex:1 1 calc(33.333% - 10px);min-width:180px;max-width:320px;display:flex;flex-direction:column}
  .timer-start{width:100%;margin-top:auto}
  .mod-card.running{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  @media(max-width:760px){
    .timer-mods .mod-card{flex:1 1 calc(50% - 8px);max-width:none}
  }
  @media(max-width:420px){
    .timer-mods .mod-card{flex:1 1 100%}
  }
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .seg-btn{font:inherit;font-size:13px;padding:7px 14px;border:none;background:var(--surface-2);color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
  .seg-btn.active{background:var(--primary);color:#fff}
</style>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">计时学习</h1>
  <p class="page-sub">选模块，点开始。一次只跑一个计时器；要离开就点「暂停」，回来点「继续」，系统自动算出真实专注时间。</p>

  <section class="card timer-stage">
    <div class="live-timer" id="liveTimer">00:00:00</div>
    <div id="timerGoal" class="timer-goal">
      <label class="muted">本次目标
        <input id="goalMin" type="number" min="1" inputmode="numeric" placeholder="分钟" class="goal-input">
      </label>
      <div class="seg" id="modeSeg">
        <button type="button" class="seg-btn active" data-mode="up">正计时</button>
        <button type="button" class="seg-btn" data-mode="down">倒计时</button>
      </div>
    </div>
    <div id="timerProgress" class="timer-progress"></div>
    <div class="timer-active">
      <div id="activeInfo" class="muted">当前没有进行中的学习</div>
      <div id="focusInfo" class="muted" style="margin-top:4px;min-height:18px"></div>
      <div class="timer-btns">
        <button class="btn btn-danger" id="stopBtn" disabled>结束并保存</button>
        <button class="btn" id="pauseBtn" disabled>暂停</button>
      </div>
    </div>
  </section>

  <h2 class="section-title" style="margin-top:8px">今天想练哪块？</h2>
  <div class="timer-mods" id="timerMods"></div>
</main>

</body>
</html>
