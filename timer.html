<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<style>
/* ===== 10/1 晚 · 计时页 v3 彻底重做（她拍板「参考成功计时器，能多好看做多好看」）=====
   10/2（她拍板）：深墨绿沉浸卡太深且太大 → 改浅色 token 卡（teal 淡渐变+品牌深 teal 数字）并整体收一档；原 Forest 双栏布局保留。
   右 = 紧凑任务列表 + 今日记录；整页一屏放下。timer.js 全部 DOM 钩子原样保留。 */
.tm-grid{display:grid;grid-template-columns:460px 1fr;gap:24px;align-items:start}
@media(max-width:920px){.tm-grid{grid-template-columns:1fr}}

/* ── 左：深色沉浸计时卡 ── */
.timer-stage{
  position:relative;max-width:none;margin:0;padding:24px 22px 20px;border-radius:var(--radius);overflow:hidden;text-align:center;
  background:linear-gradient(168deg,var(--primary-soft),var(--surface) 72%);
  border:1px solid var(--primary-200);box-shadow:var(--shadow);
}
.timer-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(360px 170px at 50% -60px,rgba(58,154,147,.10),transparent 70%);pointer-events:none}
.ts-status-wrap{text-align:center;margin-bottom:14px;position:relative}
.ts-status{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--surface);color:var(--primary-text);font-size:12.5px;font-weight:600;border:1px solid var(--primary-200)}
.live-timer{position:relative;font-size:clamp(40px,6vw,56px);font-weight:800;color:var(--primary-700)!important;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.05}
.ts-focus{position:relative;min-height:18px;font-size:13px;color:var(--muted)!important;margin:0 0 12px}
.timer-goal{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.timer-goal label{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
/*10/3 她报「统一 UI 后计时页变丑」：common.css:452 的裸input 规则
  input:not([type=checkbox]):not([type=radio]):not([type=range]) 权重是 (0,1,3)，
  **高于**本页这行 (0,2,1) —— 于是把「本次目标」分钟输入框从 34px 撑成 44px、
  圆角 10→12、字号 14→14.5，跟旁边 34px 高的分段按钮不齐，看着突兀。
  修法：这里补同权重的 :not() 链把裸规则压回，恢复本页原设计。
  ⚠️ 只在本页加，common.css 不动 —— 其他 13 页零影响。 */
input#goalMin:not([type=checkbox]):not([type=radio]):not([type=range]){width:64px;height:34px;padding:0 8px;font-size:14px;border-radius:10px;background:var(--surface);color:var(--ink);text-align:center}
input#goalMin:not([type=checkbox]):not([type=radio]):not([type=range]):focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3.5px var(--primary-soft)}
input#goalMin:not([type=checkbox]):not([type=radio]):not([type=range])::placeholder{color:var(--n-500)}
.timer-goal input.goal-input{width:64px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;text-align:center;outline:none;transition:border-color .15s,background .15s}
.timer-goal input.goal-input:focus{border-color:var(--primary);background:var(--surface)}
.timer-goal input.goal-input::placeholder{color:var(--n-500)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:34px;background:var(--surface)}
/* 10/3 同步修：.seg 容器 34px 但 .seg-btn 被统一 UI 的 height:32px 压住 → 按钮比容器矮 2px、
   底部露 2px 空隙。与上面 #goalMin 同属「本次目标」这一行的对齐问题，一并回 34px。 */
.seg-btn{font:inherit;font-size:13px;font-weight:700;padding:0 14px;height:34px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg-btn + .seg-btn{border-left:1px solid var(--line)}
.seg-btn.active{background:var(--primary);color:var(--on-primary)}
.timer-progress{position:relative;margin:0 0 14px;text-align:left}
.timer-progress:empty{margin-bottom:0}
.timer-btns{position:relative;display:flex;gap:12px;justify-content:center}
.timer-btns .btn,.timer-btns .ui-dark-btn{
  min-width:120px;min-height:42px;padding:0 20px;border-radius:999px;
  font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
}
.timer-btns .ui-dark-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.timer-btns .ui-dark-btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary-200);transform:none;box-shadow:none}
.timer-btns .btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.timer-btns .btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-text)}
.timer-btns .btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.timer-btns .btn-primary:hover:not(:disabled){background:var(--primary-600);border-color:var(--primary-600)}
.timer-btns button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
/* 10/13 空闲指引：没开表时告诉新用户「先选任务」（观感批，见 #timerIdleHint） */
.timer-idle-hint{margin:10px 0 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.timer-idle-hint::before{content:"👆 ";font-size:12px}
body.timer-running .timer-idle-hint{display:none}

/* ── T-1a（10-24）：计时栏置顶，五个科目卡下移 ──
   改前：`本次目标` + 正/倒分段 + 两个按钮散在计时卡里各占一行，五个科目卡紧跟在下面 ——
   眼睛要往下扫三屏才知道「开始」在哪。改后：把「目标 / 分段 / 开始」压成一条栏（.tm-bar），
   按「先填在干什么 → 定多久 → 正还是倒 → 开始」的阅读顺序排一行；科目卡整块降到这条栏下面。
   ⚠️ 只搬位置，不动任何 id：`#goalMin` / `#modeSeg` / `#stopBtn` / `#pauseBtn` 全部原样保留，
      js/timer.js 里 startSession 读它们的选择器一个都没变。
   ⚠️ 任务名输入框（.tm-task-in）：**这一批只画壳、不接线** ——
      startSession(moduleId, subNameOpt) 的第二个参数才是「自定义任务名」的入口，
      而 js/timer.js 归 A2（它要做 T-1e/T-1f），A3 不许碰。已写进回报请 A2 补一行取值。 */
.tm-bar{
  position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  justify-content:center;margin:0 0 12px;
}
.tm-bar .tm-task-in{
  display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;max-width:320px;
  height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--muted);
  transition:border-color .15s,box-shadow .15s;
}
.tm-bar .tm-task-in:focus-within{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.tm-bar .tm-task-in svg{width:15px;height:15px;flex:none;color:var(--muted)}
.tm-bar .tm-task-in input{
  flex:1;min-width:0;height:100%;padding:0;border:0;background:none;outline:none;
  font:inherit;font-size:13.5px;color:var(--ink);
}
.tm-bar .tm-task-in input::placeholder{color:var(--n-500)}
/* ⚠️ 同本页 #goalMin 那个老坑：css/common.css 的裸 input 规则
   `input:not([type=checkbox]):not([type=radio]):not([type=range])` 权重 (0,1,3)，
   会把我这里 (0,2,1) 的零边框撑回 1px 边 + 44px 高 + 圆角 12 —— 实测就是一个框里套一个框。
   补同权重的 :not() 链压回，只在本页生效，common.css 不动。 */
.tm-bar .tm-task-in input:not([type=checkbox]):not([type=radio]):not([type=range]){
  height:100%;padding:0;border:0;border-radius:0;background:none;box-shadow:none;
}
.tm-bar .tm-task-in input:not([type=checkbox]):not([type=radio]):not([type=range]):focus{
  border:0;background:none;box-shadow:none;
}
/* 时长框 + 「分钟」缩进量与分段控件同高，保持一行齐平 */
.tm-bar .timer-goal{margin:0;gap:8px;flex:none}
.tm-bar .timer-goal label{margin-right:-2px}

/* 科目卡整块下移后的提示行：明确「以上是自定义栏 / 以下是科目快捷」 */
.tm-mods-title{display:flex;align-items:baseline;gap:10px;margin:20px 0 2px;flex-wrap:wrap}
.tm-mods-title .section-title{margin:0;flex:none;white-space:nowrap}
.tm-mods-title .hint{font-size:12.5px;color:var(--muted);flex:1 1 auto;min-width:0}
@media(max-width:560px){
  .tm-mods-title .hint{flex:1 1 100%;margin-top:2px}
}

@media(max-width:920px){
  .tm-bar{justify-content:stretch}
  .tm-bar .tm-task-in{flex:1 1 100%;max-width:none}
  .tm-bar .timer-goal{flex:1 1 100%;justify-content:flex-start}
}

/* ── T-1d（10-24）：时长快选档位 ──
   病根：想计时只能往「本次目标」那个小框里敲数字，手机上要弹键盘、还要数一下 40 还是 45。
   改法：框下面摆 15 / 25 / 40 / 60 / 不限时 五枚，点一下就把数字填进 #goalMin
   （「不限时」= 清空 → startSession 里 `parseInt('')` 得 NaN → targetSec=null → 正计时无终点）。
   ⚠️ **手动输入框 #goalMin 原样保留、不降级**（她手机上要设 33 分钟这种数，派活单原话）。
   ⚠️ 一枚 chip 都不含业务判断，纯把值写进已有输入框；谁读那个框仍是 js/timer.js 的事。 */
.tm-quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 12px}
.tm-quick .lbl{font-size:12.5px;color:var(--muted);white-space:nowrap}
.tm-quick .chip{
  font:inherit;font-size:12.5px;font-weight:600;line-height:1;
  padding:7px 13px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  transition:border-color .15s,background .15s,color .15s;
}
.tm-quick .chip:hover{border-color:var(--primary-200);background:var(--primary-soft);color:var(--primary-text)}
.tm-quick .chip[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.tm-quick .chip[aria-pressed="true"]:hover{background:var(--primary-600);border-color:var(--primary-600);color:var(--on-primary)}
@media(max-width:560px){
  .tm-quick{justify-content:flex-start;gap:7px}
  .tm-quick .chip{padding:7px 11px;font-size:12px}
}

/* ── T-1b / T-1c（10-24）：「我的常用」+「最近用过」两块并排 ──
   两块同一张卡的两个面板，桌面上左右并排（各占一半），手机上上下叠。
   样式全走 token（--surface / --line / --primary* / --muted），深色自动跟着走。 */
.tm-panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;align-items:start}
@media(max-width:860px){.tm-panels{grid-template-columns:1fr;gap:12px}}
.tm-panels .panel{
  background:var(--surface);border:1px solid var(--line);border-radius:16px;
  padding:16px 18px;box-shadow:var(--shadow);
}
.tm-panels .pn-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.tm-panels .pn-h h4{font-size:14.5px;font-weight:800}
.tm-panels .pn-h .act{
  font:inherit;font-size:12px;color:var(--primary-text);font-weight:700;cursor:pointer;
  background:none;border:0;padding:4px 8px;border-radius:8px;transition:background .15s;
}
.tm-panels .pn-h .act:hover{background:var(--primary-soft)}
.tm-panels .pn-sub{font-size:12px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.tm-panels .pn-empty{
  font-size:12.5px;color:var(--muted);text-align:center;padding:16px 10px;
  border:1px dashed var(--line);border-radius:11px;line-height:1.7;
}
/* 预设行 */
.tm-panels .pre{
  display:flex;align-items:center;gap:11px;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--surface);
  transition:border-color .15s,background .15s;
}
.tm-panels .pre:hover{border-color:var(--primary-200);background:var(--primary-soft)}
.tm-panels .pre .ic{
  width:32px;height:32px;border-radius:9px;flex:none;display:grid;place-items:center;
  background:var(--primary-soft);color:var(--primary-text);font-size:14px;font-weight:800;
}
.tm-panels .pre .nm{flex:1;min-width:0}
.tm-panels .pre .nm b{
  display:block;font-size:13.5px;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tm-panels .pre .nm i{font-style:normal;font-size:11.5px;color:var(--muted)}
.tm-panels .pre .dur2{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tm-panels .pre .go,.tm-panels .recent .go{
  font:inherit;font-size:12px;font-weight:700;border-radius:999px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:5px 14px;
  transition:background .15s,color .15s,border-color .15s;
}
.tm-panels .pre .go:hover{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.tm-panels .pre .x{
  flex:none;padding:2px 5px;border:0;background:none;cursor:pointer;
  font:inherit;font-size:14px;line-height:1;color:var(--n-500);border-radius:6px;
}
.tm-panels .pre .x:hover{color:#b3261e;background:rgba(179,38,30,.08)}
/* 最近用过行 */
.tm-panels .recent{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;transition:background .15s}
.tm-panels .recent:hover{background:var(--primary-soft)}
.tm-panels .recent .dot2{width:6px;height:6px;border-radius:50%;background:var(--primary);flex:none}
.tm-panels .recent .nm{
  flex:1;min-width:0;font-size:13px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tm-panels .recent .when{font-size:11.5px;color:var(--muted);white-space:nowrap}
.tm-panels .recent .go{border:0;background:none;color:var(--primary-text);padding:4px 10px}
.tm-panels .recent .go:hover{background:var(--primary);color:var(--on-primary)}
@media(max-width:560px){
  .tm-panels .panel{padding:14px 15px}
  .tm-panels .pre,.tm-panels .recent{gap:9px}
  .tm-panels .pre .dur2{display:none}
}

/* ── 右：任务列表（大卡 → 紧凑行）── */
.tm-side .section-title{margin-top:2px}
.timer-mods{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.timer-mods .mod-card{
  display:flex;flex-direction:row;align-items:center;gap:13px;
  padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.timer-mods .mod-card:hover{transform:translateX(3px);box-shadow:var(--shadow-card-hover);border-color:var(--primary)}
.timer-mods .mod-card.running{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.timer-mods .mod-ic{width:40px;height:40px;border-radius:12px;font-size:18px;flex:none}
.timer-mods .mod-ic svg{width:20px;height:20px}
.timer-mods .mod-name{flex:1;text-align:left;font-size:14.5px;font-weight:700}
.timer-mods .timer-start{width:auto;margin:0;padding:8px 18px;font-size:13px;border-radius:999px;flex:none}

/* 今日记录压进右栏 */
.tm-side .rec-mini{padding:18px 20px;margin-top:22px;border-radius:18px}
.rec-mini-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.rec-mini-item{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
/* 10/3 同一项目连续计时合并成一条后，在项目名右侧标「N 段」——
   她拍板「只标 N 段」（最简），不写「中断」这种负面词；原始每段放在 title 里悬停可查。 */

<body data-shell="top">
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>

<main class="container">
  <!-- 10/2（她拍板）：顶部「今日 XhXm / 连续 N 天」两枚芯片整删（手机端顶着很丑）——
       .page-head 行整行移除，计时卡直接顶上去；数据仍可在下方「今日学习记录/总计」看 -->

  <section class="card timer-stage">
    <div class="ts-status-wrap"><span class="ts-status" id="activeInfo">当前没有进行中的学习</span></div>
    <div class="live-timer" id="liveTimer">00:00:00</div>
    <div id="focusInfo" class="ts-focus"></div>
    <div id="timerProgress" class="timer-progress"></div>

    <!-- T-1a（10-24）：计时栏置顶 —— 「在干什么 / 多久 / 正还是倒 / 开始」压成一条。
         ⚠️ 下面这些 id 一个都没改：#goalMin（时长）、#modeSeg（正/倒）、#stopBtn、#pauseBtn，
            js/timer.js 的 startSession 仍按原选择器取它们。
         ⚠️ .tm-task-in 里的输入框这一批**只有壳**：自定义任务名要走 startSession(moduleId, subNameOpt)
            的第二个参数，那在 js/timer.js（A2 领地），A3 不碰。等 A2 补取值后它就活了。 -->
    <div class="tm-bar">
      <label class="tm-task-in" for="tmTaskName">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <input id="tmTaskName" type="text" placeholder="在学什么？如：口语 Part2 跟读" aria-label="本次学习内容" autocomplete="off" />
      </label>
      <div id="timerGoal" class="timer-goal">
        <label class="muted" for="goalMin">本次目标</label>
        <input id="goalMin" type="number" min="1" inputmode="numeric" placeholder="分钟" class="goal-input">
        <div class="seg" id="modeSeg">
          <button type="button" class="seg-btn active" data-mode="up">正计时</button>
          <button type="button" class="seg-btn" data-mode="down">倒计时</button>
        </div>
      </div>
    </div>
    <!-- T-1d（10-24）：时长快选。点一下就写进上面的 #goalMin；「不限时」= 清空（正计时无终点）。
         ⚠️ #goalMin 手动输入框照旧保留 —— 手机上要设 33 分钟这种数，档位只是省事、不是替代。 -->
    <div class="tm-quick" id="tmQuick" role="group" aria-label="时长快选">
      <span class="lbl">时长</span>
      <button type="button" class="chip" data-min="15" aria-pressed="false">15 分</button>
      <button type="button" class="chip" data-min="25" aria-pressed="false">25 分</button>
      <button type="button" class="chip" data-min="40" aria-pressed="false">40 分</button>
      <button type="button" class="chip" data-min="60" aria-pressed="false">60 分</button>
      <button type="button" class="chip" data-min="" aria-pressed="true">不限时</button>
    </div>
    <div class="timer-btns">
      <button class="ui-dark-btn ui-dark-btn--sm" id="stopBtn" disabled>结束并保存</button>
      <button class="ui-dark-btn ui-dark-btn--sm" id="pauseBtn" disabled>暂停</button>
    </div>
    <!-- 10/13 新用户走查：没开表时上面两个按钮是禁用的，新用户第一反应「这页坏了/我该点哪」。
         加一句显式指引，把主流程说明白（观感批）。
         T-1a：文案跟着改了 —— 科目卡现在在下面，指引得说清「先从下面选任务」。 -->
    <p class="timer-idle-hint" id="timerIdleHint">先从下面选一个任务，点「开始」就会计时</p>
  </section>

  <div class="tm-mods-title">
    <p class="section-title">选择本次任务</p>
    <span class="hint">每个科目点「开始」直接记时；想自己命名，用上面那条栏</span>
  </div>
  <div class="timer-mods" id="timerMods"></div>

  <!-- T-1b / T-1c：我的常用（localStorage hub_timer_presets）+ 最近用过（只读 DATA.sessions）。
       内容全部由页尾内联脚本渲染，这里只留空壳。 -->
  <div class="tm-panels" id="tmPanels"></div>

  <section class="card rec-mini">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="recTotalMini">0h0m</b></span>
    </div>
    <div class="rec-mini-grid" id="recMiniGrid"></div>
    <p class="rec-empty" id="recEmpty">还没有计时记录。开始一次专注学习吧。</p>
  </section>
</main>

<!-- ═══ A3 · 计时页页面层交互（T-1b / T-1c / T-1d）════════════════════════════════════
     🔴 为什么这段写在 timer.html 里、而不是 js/timer.js：
        启动口令「T-1a~T-1d 只许改 timer.html 的 DOM/CSS，不许碰 js/timer.js」（那归 A2）。
        这里只做**页面层**的事：把点选结果写进已有输入框 / 渲染列表 / 存 localStorage。
        开表仍调 js/timer.js 里现成的 startSession() —— 实测它在 window 上
        （timer.js 是普通脚本，function 声明自动挂 window；DATA/MODULES 是词法绑定，
        内联脚本裸写也能用），所以**没有复制任何计时逻辑**。
     🔴 软导航（common-shell.js:825）只换 <main> 并 eval body 内联脚本 —— 本段会被重跑，
        所以：① 事件一律委托到 document、绑前先摘同名 handler ② 每次进入都从存储重读、重渲染，
        不依赖上一次的内存状态（幂等）。
     ══════════════════════════════════════════════════════════════════════════════════ -->
<script>
(function(){
  'use strict';

  /* ─────────── 通用小工具 ─────────── */
  var $id = function(id){ return document.getElementById(id); };
  var toast2 = function(msg){ try{ if(typeof toast === 'function') toast(msg); }catch(e){} };

  /* T-1c 的存储 key。🔴 派活单原话：「只新增 key，不许塞进 DATA」—— 塞进 DATA 会被
     common-sync.js 的合并逻辑卷到云端/其它端，预设是本机偏好，不该跟学习数据一起同步。 */
  var PRESET_KEY = 'hub_timer_presets';
  function loadPresets(){
    try{
      var raw = localStorage.getItem(PRESET_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(arr)) return [];
      // 容错：只留结构合法的（name 字符串 + min 数字或 null + mode 'up'|'down'）
      return arr.filter(function(p){
        return p && typeof p.name === 'string' && p.name.trim();
      }).map(function(p){
        return {
          name: String(p.name).slice(0, 60),
          min: (typeof p.min === 'number' && p.min > 0) ? Math.round(p.min) : null,
          mode: (p.mode === 'down' ? 'down' : 'up')
        };
      }).slice(0, 20);
    }catch(e){ return []; }
  }
  function savePresets(list){
    try{ localStorage.setItem(PRESET_KEY, JSON.stringify(list.slice(0, 20))); }catch(e){}
  }

  /* ─────────── T-1d · 时长快选档位 ───────────
     点 chip → 把数字写进 #goalMin（已有输入框，一行没改），并顺手把正/倒切到合理档：
       · 选了具体分钟 → 倒计时（有终点才有意义）
       · 「不限时」    → 正计时
     切模式是**点已有的 .seg-btn**（timer.js 自己的监听接管），不是自己设状态。
     反向同步：手动在 #goalMin 里敲数字 / 清空时，chip 的高亮跟着走。 */
  function syncQuickChips(){
    var box = $id('tmQuick'), goal = $id('goalMin');
    if(!box || !goal) return;
    var v = String(goal.value || '').trim();
    var n = v === '' ? null : Number(v);
    var chips = box.querySelectorAll('.chip');
    var hit = false;
    for(var i=0;i<chips.length;i++){
      var c = chips[i];
      var cm = c.getAttribute('data-min');
      var on;
      if(cm === ''){ on = (n === null || isNaN(n)); }
      else { on = (n !== null && !isNaN(n) && Number(cm) === n); }
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      if(on) hit = true;
    }
    // 没有一枚命中（比如手动敲了 33）→ 全部不高亮，输入框自己说了算
    return hit;
  }
  function pickChip(chip){
    var goal = $id('goalMin');
    if(!goal || !chip) return;
    var cm = chip.getAttribute('data-min');
    if(cm === ''){
      goal.value = '';
      var up = document.querySelector('#modeSeg .seg-btn[data-mode="up"]');
      if(up && !up.classList.contains('active')) up.click();
    }else{
      goal.value = cm;
      var down = document.querySelector('#modeSeg .seg-btn[data-mode="down"]');
      if(down && !down.classList.contains('active')) down.click();
    }
    syncQuickChips();
    // 敲完数字直接把焦点送回「开始」逻辑的入口附近：数量少，不抢焦，只给个轻提示
    try{ goal.dispatchEvent(new Event('input', { bubbles: true })); }catch(e){}
  }

  /* ─────────── T-1b · 「最近用过」───────────
     数据源 = 现成的 DATA.sessions（🔴 只读：一行都不写、不改结构）。
     规则沿用 10/3 已拍板的去重口径（js/timer.js 的 sameRecProj）：**moduleId + subName 都相同算同一项**。
     窗口 = 最近 7 天；最多 5 条；按最近一次排前面。
     ⚠️ 时长**不从 session 反推**：`stopSession` 入库的字段只有 durationSec（真学了多久），
        **没有 targetSec / mode**（那是 active 态才有的）。所以「再来一次」只能还原名字，
        时长一律回到「不限时 · 正计时」—— 诚实地不给一个假数字。
        界面上写的「学了 X 分」用的是 durationSec，即上次真实计时长度。 */
  var RECENT_DAYS = 7, RECENT_MAX = 5;
  function collectRecent(){
    var list = [];
    try{ list = (typeof DATA !== 'undefined' && Array.isArray(DATA.sessions)) ? DATA.sessions : []; }catch(e){ list = []; }
    var cutoff = Date.now() - RECENT_DAYS * 86400e3;
    var arr = list.filter(function(s){ return s && (Number(s.startTs) || 0) >= cutoff; })
                  .sort(function(a,b){ return (Number(b.startTs)||0) - (Number(a.startTs)||0); });
    var seen = {}, out = [];
    for(var i=0;i<arr.length && out.length<RECENT_MAX;i++){
      var s = arr[i];
      var key = String(s.moduleId || '') + '\u0001' + String(s.subName || '');   // 与 sameRecProj 同口径
      if(seen[key]) continue;
      seen[key] = 1;
      var nm = String(s.subName || '').trim() || String(s.moduleName || '').trim();
      if(!nm) continue;
      out.push({
        name: nm,
        moduleId: String(s.moduleId || ''),
        durSec: Math.max(0, Math.round(Number(s.durationSec) || 0)),   // 上次真实学了多久
        at: Number(s.startTs) || 0
      });
    }
    return out;
  }
  function whenLabel(ts){
    try{
      var d = new Date(ts), now = new Date();
      var sameDay = d.toDateString() === now.toDateString();
      var hh = ('0'+d.getHours()).slice(-2), mm = ('0'+d.getMinutes()).slice(-2);
      if(sameDay) return '今天 ' + hh + ':' + mm;
      var y = new Date(now.getTime() - 86400e3);
      if(d.toDateString() === y.toDateString()) return '昨天 ' + hh + ':' + mm;
      return (d.getMonth()+1) + '/' + d.getDate() + ' ' + hh + ':' + mm;
    }catch(e){ return ''; }
  }
  function esc(s){
    return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  /* 「开始」的公共落点：把名字+时长+模式回填到计时栏，再叫 timer.js 的开表入口。
     ⚠️ 若 A2 还没把 #tmTaskName 接进 startSession（见 交接\A3回B窗口-T1接线缺口-2026-10-24.md），
        名字会安全地停在输入框里、不报错 —— 用户多点一次「开始」即可，页面不会坏。
     ⚠️ startSession 需要合法 moduleId（它内部 `MODULES.find(x=>x.id===id)`，找不到就 return）。
        自定义任务名不属于 MODULES 里任何一项 → 记账归属取**第一个科目**，名字走第二个参数
        subNameOpt。「最近用过」回放时也带上原 moduleId，让归属尽量还原。 */
  function beginWith(name, min, mode, moduleIdOpt){
    var ti = $id('tmTaskName'), goal = $id('goalMin');
    if(ti) ti.value = name || '';
    if(goal) goal.value = (min ? String(min) : '');
    var wantMode = (mode === 'down' && min) ? 'down' : 'up';
    var btn = document.querySelector('#modeSeg .seg-btn[data-mode="' + wantMode + '"]');
    if(btn && !btn.classList.contains('active')) btn.click();
    syncQuickChips();

    try{
      var mid = null;
      if(moduleIdOpt && typeof MODULES !== 'undefined'){
        var hit = null;
        for(var i=0;i<MODULES.length;i++){ if(MODULES[i].id === moduleIdOpt){ hit = MODULES[i]; break; } }
        if(hit) mid = hit.id;
      }
      if(!mid && typeof MODULES !== 'undefined' && Array.isArray(MODULES) && MODULES.length) mid = MODULES[0].id;
      if(mid && typeof window.startSession === 'function'){
        window.startSession(mid, name);
        return true;
      }
    }catch(e){}
    toast2('已填入任务名与时长，点「开始」即可');
    return false;
  }

  /* ─────────── 渲染：「我的常用」+「最近用过」───────────
     两块合并进一张卡（左侧预设 / 右侧最近），手机上下叠。整块由本函数重建 —— 幂等。 */
  function renderPanels(){
    var box = $id('tmPanels');
    if(!box) return;
    var presets = loadPresets();
    var recent = collectRecent();

    var preHtml = '';
    if(!presets.length){
      preHtml = '<p class="pn-empty">还没有常用。填好上面那条栏，点「＋ 存当前的」。</p>';
    }else{
      preHtml = presets.map(function(p, i){
        var dur = p.min ? (p.min + ' 分') : '不限时';
        var sub = p.min ? ((p.mode === 'down' ? '倒计时 ' : '正计时 ') + p.min + ' 分钟') : '正计时 · 不设终点';
        return '<div class="pre" data-i="' + i + '">' +
          '<span class="ic">' + esc(p.name.trim().slice(0,1)) + '</span>' +
          '<span class="nm"><b>' + esc(p.name) + '</b><i>' + esc(sub) + '</i></span>' +
          '<span class="dur2">' + esc(dur) + '</span>' +
          '<button type="button" class="go" data-act="pre-go" data-i="' + i + '">开始</button>' +
          '<button type="button" class="x" data-act="pre-del" data-i="' + i + '" title="删除" aria-label="删除 ' + esc(p.name) + '">✕</button>' +
        '</div>';
      }).join('');
    }

    var recHtml = '';
    if(!recent.length){
      recHtml = '<p class="pn-empty">最近 7 天还没有计时记录。开一次计时，这里就会出现。</p>';
    }else{
      recHtml = recent.map(function(r, i){
        var durTxt = r.durSec >= 60 ? (Math.round(r.durSec/60) + ' 分') : (r.durSec + ' 秒');
        return '<div class="recent" data-i="' + i + '">' +
          '<span class="dot2"></span>' +
          '<span class="nm">' + esc(r.name) + '</span>' +
          '<span class="when">' + esc(whenLabel(r.at)) + ' · 学了 ' + esc(durTxt) + '</span>' +
          '<button type="button" class="go" data-act="rec-go" data-i="' + i + '">再来一次</button>' +
        '</div>';
      }).join('');
    }

    box.innerHTML =
      '<div class="panel">' +
        '<div class="pn-h"><h4>我的常用</h4>' +
          '<button type="button" class="act" data-act="pre-save">＋ 存当前的</button>' +
        '</div>' +
        '<p class="pn-sub">常用的活存下来，以后点一下就开始，不用每次打字</p>' +
        preHtml +
      '</div>' +
      '<div class="panel">' +
        '<div class="pn-h"><h4>最近用过</h4></div>' +
        '<p class="pn-sub">最近 7 天记过的，按「在学什么」去重</p>' +
        recHtml +
      '</div>';

    // 把这一轮的数据挂到 DOM 上，供点击时取值（避免再读一次存储、也避免闭包跨次残留）
    box.__presets = presets;
    box.__recent = recent;
  }

  /* ─────────── 事件委托（绑前先摘，保证软导航重跑不叠加）─────────── */
  if(window.__tmPageClick){ document.removeEventListener('click', window.__tmPageClick); window.__tmPageClick = null; }
  if(window.__tmPageInput){ document.removeEventListener('input', window.__tmPageInput); window.__tmPageInput = null; }

  window.__tmPageClick = function(ev){
    var t = ev.target;
    if(!t || !t.closest) return;

    /* T-1d：时长 chip */
    var chip = t.closest('#tmQuick .chip');
    if(chip){ ev.preventDefault(); pickChip(chip); return; }

    /* T-1c：「＋ 存当前的」 */
    if(t.closest('[data-act="pre-save"]')){
      ev.preventDefault();
      var ti = $id('tmTaskName'), goal = $id('goalMin');
      var name = ti ? String(ti.value || '').trim() : '';
      if(!name){ toast2('先在上面填「在学什么」，再存'); if(ti) ti.focus(); return; }
      var list = loadPresets();
      if(list.some(function(p){ return p.name.trim() === name; })){ toast2('「' + name + '」已经在常用里了'); return; }
      if(list.length >= 20){ toast2('常用最多存 20 条，先删一条'); return; }
      var gv = goal ? String(goal.value || '').trim() : '';
      var n = gv === '' ? null : (Number(gv) > 0 ? Math.round(Number(gv)) : null);
      var modeEl = document.querySelector('#modeSeg .seg-btn.active');
      list.push({ name: name, min: n, mode: (modeEl && modeEl.dataset.mode === 'down' && n) ? 'down' : 'up' });
      savePresets(list);
      renderPanels();
      toast2('已存进「我的常用」');
      return;
    }

    /* T-1c：单条删除 */
    var del = t.closest('[data-act="pre-del"]');
    if(del){
      ev.preventDefault();
      var box = $id('tmPanels');
      var i = Number(del.getAttribute('data-i'));
      var cur = (box && box.__presets) || loadPresets();
      if(!isNaN(i) && cur[i]){
        var nm = cur[i].name;
        var next = cur.slice(); next.splice(i, 1);
        savePresets(next); renderPanels();
        toast2('已删除「' + nm + '」');
      }
      return;
    }

    /* T-1c：预设一键开始 */
    var pgo = t.closest('[data-act="pre-go"]');
    if(pgo){
      ev.preventDefault();
      var box2 = $id('tmPanels');
      var j = Number(pgo.getAttribute('data-i'));
      var p = ((box2 && box2.__presets) || [])[j];
      if(p) beginWith(p.name, p.min, p.mode);
      return;
    }

    /* T-1b：最近用过「再来一次」—— 只还原名字与归属科目，时长回「不限时 · 正计时」
       （session 里没有 targetSec/mode，不给假数字，见 collectRecent 顶部注释）。 */
    var rgo = t.closest('[data-act="rec-go"]');
    if(rgo){
      ev.preventDefault();
      var box3 = $id('tmPanels');
      var k = Number(rgo.getAttribute('data-i'));
      var r = ((box3 && box3.__recent) || [])[k];
      if(r) beginWith(r.name, null, 'up', r.moduleId);
      return;
    }
  };
  document.addEventListener('click', window.__tmPageClick, true);

  /* 手动改时长框 / 清空时，chip 高亮跟着同步（捕获 phase：input 事件不冒泡到 document 的委托要靠 capture） */
  window.__tmPageInput = function(ev){
    var t = ev.target;
    if(t && t.id === 'goalMin') syncQuickChips();
  };
  document.addEventListener('input', window.__tmPageInput, true);

  /* ─────────── 首次渲染 + 暴露给探针 ─────────── */
  function boot(){
    syncQuickChips();
    renderPanels();
  }
  boot();
  window.__tmRenderPanels = renderPanels;   // 探针/调试用（DATA 变更后可手动重渲染）
  window.__tmCollectRecent = collectRecent;
  // 计时结束入库后 DATA.sessions 变了 → 让「最近用过」跟上（只在页面里监听，不改 timer.js）
  if(!window.__tmDataMerged){
    window.__tmDataMerged = function(){ try{ renderPanels(); }catch(e){} };
    document.addEventListener('hub:data-merged', window.__tmDataMerged);
  }
})();
</script>

</body>
</html>
