<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<style>
/* ===== 10/1 晚 · 计时页 v3 彻底重做（她拍板「参考成功计时器，能多好看做多好看」）=====
   参考 Forest / 番茄 ToDo：左 = 深色沉浸计时大卡（墨绿渐变+白字大数字），
   右 = 紧凑任务列表 + 今日记录；整页一屏放下。timer.js 全部 DOM 钩子原样保留。 */
.tm-grid{display:grid;grid-template-columns:460px 1fr;gap:24px;align-items:start}
@media(max-width:920px){.tm-grid{grid-template-columns:1fr}}

/* ── 左：深色沉浸计时卡 ── */
.timer-stage{
  position:relative;max-width:none;margin:0;padding:38px 34px 32px;border-radius:24px;overflow:hidden;text-align:center;
  background:linear-gradient(168deg,#1f5350,#12332f 72%);
  border:none;box-shadow:0 28px 56px -26px rgba(18,51,47,.65);
}
.timer-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(480px 240px at 50% -70px,rgba(122,220,210,.18),transparent 70%);pointer-events:none}
.ts-status-wrap{text-align:center;margin-bottom:14px;position:relative}
.ts-status{display:inline-block;padding:5px 16px;border-radius:999px;background:rgba(255,255,255,.12);color:rgba(255,255,255,.88);font-size:12.5px;font-weight:600;backdrop-filter:blur(4px)}
.live-timer{position:relative;font-size:clamp(58px,8.5vw,84px);font-weight:800;color:#fff!important;margin:6px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.05;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.ts-focus{position:relative;min-height:20px;font-size:13px;color:rgba(255,255,255,.62)!important;margin:0 0 16px}
.timer-goal{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 20px;flex-wrap:wrap}
.timer-goal label{font-size:13px;color:rgba(255,255,255,.62);font-weight:600;white-space:nowrap}
.timer-goal input.goal-input{width:64px;height:36px;padding:0 8px;border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(255,255,255,.10);color:#fff;font:inherit;font-size:14px;text-align:center;outline:none;transition:border-color .15s,background .15s}
.timer-goal input.goal-input:focus{border-color:rgba(122,220,210,.7);background:rgba(255,255,255,.16)}
.timer-goal input.goal-input::placeholder{color:rgba(255,255,255,.4)}
.seg{display:inline-flex;border:1px solid rgba(255,255,255,.22);border-radius:10px;overflow:hidden;height:38px;background:rgba(255,255,255,.06)}
.seg-btn{font:inherit;font-size:13px;font-weight:700;padding:0 16px;border:none;background:transparent;color:rgba(255,255,255,.62);cursor:pointer;transition:background .15s,color .15s}
.seg-btn + .seg-btn{border-left:1px solid rgba(255,255,255,.14)}
.seg-btn.active{background:#fff;color:var(--primary-900)}
.timer-progress{position:relative;margin:0 0 18px;text-align:left}
.timer-progress:empty{margin-bottom:0}
.timer-btns{position:relative;display:flex;gap:12px;justify-content:center}
.timer-btns .btn,.timer-btns .ui-dark-btn{
  min-width:150px;min-height:48px;padding:0 26px;border-radius:999px;
  font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
}
.timer-btns .ui-dark-btn{background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.30);box-shadow:none}
.timer-btns .ui-dark-btn:hover:not(:disabled){background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.4);transform:none;box-shadow:none}
.timer-btns .btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);box-shadow:none}
.timer-btns .btn:hover:not(:disabled){background:rgba(255,255,255,.10)}
.timer-btns .btn-primary{background:#fff;color:var(--primary-900);border-color:#fff}
.timer-btns .btn-primary:hover:not(:disabled){background:rgba(255,255,255,.92)}
.timer-btns button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

/* ── 右：任务列表（大卡 → 紧凑行）── */
.tm-side .section-title{margin-top:2px}
.timer-mods{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.timer-mods .mod-card{
  display:flex;flex-direction:row;align-items:center;gap:13px;
  padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.timer-mods .mod-card:hover{transform:translateX(3px);box-shadow:var(--shadow-card-hover);border-color:var(--primary)}
.timer-mods .mod-card.running{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.timer-mods .mod-ic{width:40px;height:40px;border-radius:12px;font-size:18px;flex:none}
.timer-mods .mod-ic svg{width:20px;height:20px}
.timer-mods .mod-name{flex:1;text-align:left;font-size:14.5px;font-weight:700}
.timer-mods .timer-start{width:auto;margin:0;padding:8px 18px;font-size:13px;border-radius:999px;flex:none}

/* 今日记录压进右栏 */
.tm-side .rec-mini{padding:18px 20px;margin-top:22px;border-radius:18px}
.rec-mini-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.rec-mini-item{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
@media(max-width:920px){
  .timer-stage{padding:32px 22px 28px}
  .timer-btns .btn,.timer-btns .ui-dark-btn{min-width:0;flex:1;padding:0 18px}
}
</style>

<main class="container">
  <!-- 10/2（她拍板）：顶部「今日 XhXm / 连续 N 天」两枚芯片整删（手机端顶着很丑）——
       .page-head 行整行移除，计时卡直接顶上去；数据仍可在下方「今日学习记录/总计」看 -->

  <section class="card timer-stage">
    <div class="ts-status-wrap"><span class="ts-status" id="activeInfo">当前没有进行中的学习</span></div>
    <div class="live-timer" id="liveTimer">00:00:00</div>
    <div id="focusInfo" class="ts-focus"></div>
    <div id="timerProgress" class="timer-progress"></div>
    <div id="timerGoal" class="timer-goal">
      <label class="muted" for="goalMin">本次目标</label>
      <input id="goalMin" type="number" min="1" inputmode="numeric" placeholder="分钟" class="goal-input">
      <div class="seg" id="modeSeg">
        <button type="button" class="seg-btn active" data-mode="up">正计时</button>
        <button type="button" class="seg-btn" data-mode="down">倒计时</button>
      </div>
    </div>
    <div class="timer-btns">
      <button class="ui-dark-btn ui-dark-btn--sm" id="stopBtn" disabled>结束并保存</button>
      <button class="ui-dark-btn ui-dark-btn--sm" id="pauseBtn" disabled>暂停</button>
    </div>
  </section>

  <p class="section-title">选择本次任务</p>
  <div class="timer-mods" id="timerMods"></div>

  <section class="card rec-mini">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="recTotalMini">0h0m</b></span>
    </div>
    <div class="rec-mini-grid" id="recMiniGrid"></div>
    <p class="rec-empty" id="recEmpty">还没有计时记录。开始一次专注学习吧。</p>
  </section>
