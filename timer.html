<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    var speaking = Array.isArray(parsed.speaking) ? parsed.speaking : [];
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var hasDirty = speaking.some(function(s){ return s && dirtyIds.indexOf(s.id) >= 0; });
    var hasOldMorning = speaking.some(function(s){ return s && s.titleEn && s.titleEn.toLowerCase().indexOf('early morning') >= 0; });
    if(hasDirty || hasOldMorning){
      localStorage.removeItem(key);
      location.reload(true);
    }
  }catch(e){}
})();
</script>
<title>计时 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css?v=20260823j" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js?v=20260823k"></script>
  <script defer src="js/common.js?v=20260823j"></script>
  <script defer src="js/timer.js?v=20260823j"></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <div class="page-head">
    <div class="page-head-l">
      <h1 class="page-title">计时</h1>
      <p class="page-sub">番茄钟 · 让每次学习都有目标</p>
    </div>
    <div class="page-head-r">
      <span class="phr-chip" id="phrToday">今日 0h0m</span>
      <span class="phr-chip" id="phrStreak">连续 0 天</span>
    </div>
  </div>

  <section class="card timer-stage">
    <div class="live-timer" id="liveTimer">00:00:00</div>
    <div id="timerGoal" class="timer-goal">
      <label class="muted" for="goalMin">本次目标</label>
      <input id="goalMin" type="number" min="1" inputmode="numeric" placeholder="分钟" class="goal-input">
      <div class="seg" id="modeSeg">
        <button type="button" class="seg-btn active" data-mode="up">正计时</button>
        <button type="button" class="seg-btn" data-mode="down">倒计时</button>
      </div>
    </div>
    <div id="timerProgress" class="timer-progress"></div>
    <div class="timer-active">
      <div id="activeInfo" class="muted">当前没有进行中的学习</div>
      <div id="focusInfo" class="muted"></div>
    </div>
    <div class="timer-btns">
      <button class="btn btn-danger" id="stopBtn" disabled>结束并保存</button>
      <button class="btn" id="pauseBtn" disabled>暂停</button>
    </div>
  </section>

  <p class="section-title">选择本次任务</p>
  <div class="timer-mods" id="timerMods"></div>

  <section class="card rec-mini">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="recTotalMini">0h0m</b></span>
    </div>
    <div class="rec-mini-grid" id="recMiniGrid"></div>
    <p class="rec-empty" id="recEmpty">还没有计时记录。开始一次专注学习吧。</p>
  </section>
</main>

</body>
</html>
