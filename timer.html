<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>计时学习 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<script defer src="js/data.js"></script>
<script defer src="js/common.js"></script>
<script defer src="js/timer.js"></script>
<style>
  /* 计时主页：左单词 / 右 4 科目，点「开始」直接学 */
  .timer-cols{display:grid;grid-template-columns:240px 1fr;gap:18px;align-items:start;margin-top:6px}
  .timer-col{display:flex;flex-direction:column;gap:14px;min-width:0}
  .timer-col-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.3px;padding:0 2px}
  .timer-subjects{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .timer-start{width:100%;margin-top:10px}
  .mod-card.running{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  @media(max-width:760px){
    .timer-cols{grid-template-columns:1fr;gap:12px}
    .timer-subjects{grid-template-columns:1fr 1fr}
  }
  @media(max-width:420px){
    .timer-subjects{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">计时学习</h1>
  <p class="page-sub">选模块，点开始。一次只跑一个计时器；要离开就点「暂停」，回来点「继续」，系统自动算出真实专注时间。</p>

  <div class="live-timer" id="liveTimer">00:00:00</div>
  <div class="card" style="text-align:center;margin-top:-10px">
    <div id="activeInfo" class="muted">当前没有进行中的学习</div>
    <div id="focusInfo" class="muted" style="margin-top:4px;min-height:18px"></div>
    <div style="margin-top:12px">
      <button class="btn btn-danger" id="stopBtn" disabled>结束并保存</button>
      <button class="btn" id="pauseBtn" disabled style="margin-left:8px">暂停</button>
    </div>
  </div>

  <div class="timer-cols">
    <div class="timer-col" id="vocabCol"></div>
    <div class="timer-col" id="subjectsCol"></div>
  </div>
</main>

</body>
</html>
