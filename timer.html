<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<style>
/* ===== 10/1 晚 · 计时页 v3 彻底重做（她拍板「参考成功计时器，能多好看做多好看」）=====
   10/2（她拍板）：深墨绿沉浸卡太深且太大 → 改浅色 token 卡（teal 淡渐变+品牌深 teal 数字）并整体收一档；原 Forest 双栏布局保留。
   右 = 紧凑任务列表 + 今日记录；整页一屏放下。timer.js 全部 DOM 钩子原样保留。 */
.tm-grid{display:grid;grid-template-columns:460px 1fr;gap:24px;align-items:start}
@media(max-width:920px){.tm-grid{grid-template-columns:1fr}}

/* ── 左：深色沉浸计时卡 ── */
.timer-stage{
  position:relative;max-width:none;margin:0;padding:24px 22px 20px;border-radius:var(--radius);overflow:hidden;text-align:center;
  background:linear-gradient(168deg,var(--primary-soft),var(--surface) 72%);
  border:1px solid var(--primary-200);box-shadow:var(--shadow);
}
.timer-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(360px 170px at 50% -60px,rgba(58,154,147,.10),transparent 70%);pointer-events:none}
.ts-status-wrap{text-align:center;margin-bottom:14px;position:relative}
.ts-status{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--surface);color:var(--primary-text);font-size:12.5px;font-weight:600;border:1px solid var(--primary-200)}
.live-timer{position:relative;font-size:clamp(40px,6vw,56px);font-weight:800;color:var(--primary-700)!important;margin:4px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1.05}
.ts-focus{position:relative;min-height:18px;font-size:13px;color:var(--muted)!important;margin:0 0 12px}
.timer-goal{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.timer-goal label{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
/*10/3 她报「统一 UI 后计时页变丑」：common.css:452 的裸input 规则
  input:not([type=checkbox]):not([type=radio]):not([type=range]) 权重是 (0,1,3)，
  **高于**本页这行 (0,2,1) —— 于是把「本次目标」分钟输入框从 34px 撑成 44px、
  圆角 10→12、字号 14→14.5，跟旁边 34px 高的分段按钮不齐，看着突兀。
  修法：这里补同权重的 :not() 链把裸规则压回，恢复本页原设计。
  ⚠️ 只在本页加，common.css 不动 —— 其他 13 页零影响。 */
input#goalMin:not([type=checkbox]):not([type=radio]):not([type=range]){width:64px;height:34px;padding:0 8px;font-size:14px;border-radius:10px;background:var(--surface);color:var(--ink);text-align:center}
input#goalMin:not([type=checkbox]):not([type=radio]):not([type=range]):focus{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 3.5px var(--primary-soft)}
input#goalMin:not([type=checkbox]):not([type=radio]):not([type=range])::placeholder{color:var(--n-500)}
.timer-goal input.goal-input{width:64px;height:34px;padding:0 8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:14px;text-align:center;outline:none;transition:border-color .15s,background .15s}
.timer-goal input.goal-input:focus{border-color:var(--primary);background:var(--surface)}
.timer-goal input.goal-input::placeholder{color:var(--n-500)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:34px;background:var(--surface)}
/* 10/3 同步修：.seg 容器 34px 但 .seg-btn 被统一 UI 的 height:32px 压住 → 按钮比容器矮 2px、
   底部露 2px 空隙。与上面 #goalMin 同属「本次目标」这一行的对齐问题，一并回 34px。 */
.seg-btn{font:inherit;font-size:13px;font-weight:700;padding:0 14px;height:34px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg-btn + .seg-btn{border-left:1px solid var(--line)}
.seg-btn.active{background:var(--primary);color:var(--on-primary)}
.timer-progress{position:relative;margin:0 0 14px;text-align:left}
.timer-progress:empty{margin-bottom:0}
.timer-btns{position:relative;display:flex;gap:12px;justify-content:center}
.timer-btns .btn,.timer-btns .ui-dark-btn{
  min-width:120px;min-height:42px;padding:0 20px;border-radius:999px;
  font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
}
.timer-btns .ui-dark-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.timer-btns .ui-dark-btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-text);border-color:var(--primary-200);transform:none;box-shadow:none}
.timer-btns .btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.timer-btns .btn:hover:not(:disabled){background:var(--primary-soft);color:var(--primary-text)}
.timer-btns .btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.timer-btns .btn-primary:hover:not(:disabled){background:var(--primary-600);border-color:var(--primary-600)}
.timer-btns button:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
/* 10/13 空闲指引：没开表时告诉新用户「先选任务」（观感批，见 #timerIdleHint） */
.timer-idle-hint{margin:10px 0 0;text-align:center;font-size:13px;color:var(--muted);line-height:1.6}
.timer-idle-hint::before{content:"👆 ";font-size:12px}
body.timer-running .timer-idle-hint{display:none}

/* ── T-1a（10-24）：计时栏置顶，五个科目卡下移 ──
   改前：`本次目标` + 正/倒分段 + 两个按钮散在计时卡里各占一行，五个科目卡紧跟在下面 ——
   眼睛要往下扫三屏才知道「开始」在哪。改后：把「目标 / 分段 / 开始」压成一条栏（.tm-bar），
   按「先填在干什么 → 定多久 → 正还是倒 → 开始」的阅读顺序排一行；科目卡整块降到这条栏下面。
   ⚠️ 只搬位置，不动任何 id：`#goalMin` / `#modeSeg` / `#stopBtn` / `#pauseBtn` 全部原样保留，
      js/timer.js 里 startSession 读它们的选择器一个都没变。
   ⚠️ 任务名输入框（.tm-task-in）：**这一批只画壳、不接线** ——
      startSession(moduleId, subNameOpt) 的第二个参数才是「自定义任务名」的入口，
      而 js/timer.js 归 A2（它要做 T-1e/T-1f），A3 不许碰。已写进回报请 A2 补一行取值。 */
.tm-bar{
  position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  justify-content:center;margin:0 0 12px;
}
.tm-bar .tm-task-in{
  display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;max-width:320px;
  height:34px;padding:0 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--surface);color:var(--muted);
  transition:border-color .15s,box-shadow .15s;
}
.tm-bar .tm-task-in:focus-within{border-color:var(--primary);box-shadow:0 0 0 3.5px var(--primary-soft)}
.tm-bar .tm-task-in svg{width:15px;height:15px;flex:none;color:var(--muted)}
.tm-bar .tm-task-in input{
  flex:1;min-width:0;height:100%;padding:0;border:0;background:none;outline:none;
  font:inherit;font-size:13.5px;color:var(--ink);
}
.tm-bar .tm-task-in input::placeholder{color:var(--n-500)}
/* ⚠️ 同本页 #goalMin 那个老坑：css/common.css 的裸 input 规则
   `input:not([type=checkbox]):not([type=radio]):not([type=range])` 权重 (0,1,3)，
   会把我这里 (0,2,1) 的零边框撑回 1px 边 + 44px 高 + 圆角 12 —— 实测就是一个框里套一个框。
   补同权重的 :not() 链压回，只在本页生效，common.css 不动。 */
.tm-bar .tm-task-in input:not([type=checkbox]):not([type=radio]):not([type=range]){
  height:100%;padding:0;border:0;border-radius:0;background:none;box-shadow:none;
}
.tm-bar .tm-task-in input:not([type=checkbox]):not([type=radio]):not([type=range]):focus{
  border:0;background:none;box-shadow:none;
}
/* 时长框 + 「分钟」缩进量与分段控件同高，保持一行齐平 */
.tm-bar .timer-goal{margin:0;gap:8px;flex:none}
.tm-bar .timer-goal label{margin-right:-2px}

/* 科目卡整块下移后的提示行：明确「以上是自定义栏 / 以下是科目快捷」 */
.tm-mods-title{display:flex;align-items:baseline;gap:10px;margin:20px 0 2px;flex-wrap:wrap}
.tm-mods-title .section-title{margin:0;flex:none;white-space:nowrap}
.tm-mods-title .hint{font-size:12.5px;color:var(--muted);flex:1 1 auto;min-width:0}
@media(max-width:560px){
  .tm-mods-title .hint{flex:1 1 100%;margin-top:2px}
}

@media(max-width:920px){
  .tm-bar{justify-content:stretch}
  .tm-bar .tm-task-in{flex:1 1 100%;max-width:none}
  .tm-bar .timer-goal{flex:1 1 100%;justify-content:flex-start}
}

/* ── 右：任务列表（大卡 → 紧凑行）── */
.tm-side .section-title{margin-top:2px}
.timer-mods{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.timer-mods .mod-card{
  display:flex;flex-direction:row;align-items:center;gap:13px;
  padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.timer-mods .mod-card:hover{transform:translateX(3px);box-shadow:var(--shadow-card-hover);border-color:var(--primary)}
.timer-mods .mod-card.running{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.timer-mods .mod-ic{width:40px;height:40px;border-radius:12px;font-size:18px;flex:none}
.timer-mods .mod-ic svg{width:20px;height:20px}
.timer-mods .mod-name{flex:1;text-align:left;font-size:14.5px;font-weight:700}
.timer-mods .timer-start{width:auto;margin:0;padding:8px 18px;font-size:13px;border-radius:999px;flex:none}

/* 今日记录压进右栏 */
.tm-side .rec-mini{padding:18px 20px;margin-top:22px;border-radius:18px}
.rec-mini-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.rec-mini-item{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
/* 10/3 同一项目连续计时合并成一条后，在项目名右侧标「N 段」——
   她拍板「只标 N 段」（最简），不写「中断」这种负面词；原始每段放在 title 里悬停可查。 */
.rec-mini-segs{
  display:inline-flex;align-items:center;margin-left:7px;padding:1px 7px;
  font-size:10.5px;font-weight:600;line-height:1.6;color:var(--primary-700);
  background:var(--primary-50);border:1px solid var(--primary-200);border-radius:999px;
  vertical-align:1px;
}
@media(max-width:920px){
  .timer-stage{padding:20px 16px 18px}
  .timer-btns .btn,.timer-btns .ui-dark-btn{min-width:0;flex:1;padding:0 16px}
}
</style>

<body data-shell="top">
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <!-- 10/2（她拍板）：顶部「今日 XhXm / 连续 N 天」两枚芯片整删（手机端顶着很丑）——
       .page-head 行整行移除，计时卡直接顶上去；数据仍可在下方「今日学习记录/总计」看 -->

  <section class="card timer-stage">
    <div class="ts-status-wrap"><span class="ts-status" id="activeInfo">当前没有进行中的学习</span></div>
    <div class="live-timer" id="liveTimer">00:00:00</div>
    <div id="focusInfo" class="ts-focus"></div>
    <div id="timerProgress" class="timer-progress"></div>

    <!-- T-1a（10-24）：计时栏置顶 —— 「在干什么 / 多久 / 正还是倒 / 开始」压成一条。
         ⚠️ 下面这些 id 一个都没改：#goalMin（时长）、#modeSeg（正/倒）、#stopBtn、#pauseBtn，
            js/timer.js 的 startSession 仍按原选择器取它们。
         ⚠️ .tm-task-in 里的输入框这一批**只有壳**：自定义任务名要走 startSession(moduleId, subNameOpt)
            的第二个参数，那在 js/timer.js（A2 领地），A3 不碰。等 A2 补取值后它就活了。 -->
    <div class="tm-bar">
      <label class="tm-task-in" for="tmTaskName">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <input id="tmTaskName" type="text" placeholder="在学什么？如：口语 Part2 跟读" aria-label="本次学习内容" autocomplete="off" />
      </label>
      <div id="timerGoal" class="timer-goal">
        <label class="muted" for="goalMin">本次目标</label>
        <input id="goalMin" type="number" min="1" inputmode="numeric" placeholder="分钟" class="goal-input">
        <div class="seg" id="modeSeg">
          <button type="button" class="seg-btn active" data-mode="up">正计时</button>
          <button type="button" class="seg-btn" data-mode="down">倒计时</button>
        </div>
      </div>
    </div>
    <div class="timer-btns">
      <button class="ui-dark-btn ui-dark-btn--sm" id="stopBtn" disabled>结束并保存</button>
      <button class="ui-dark-btn ui-dark-btn--sm" id="pauseBtn" disabled>暂停</button>
    </div>
    <!-- 10/13 新用户走查：没开表时上面两个按钮是禁用的，新用户第一反应「这页坏了/我该点哪」。
         加一句显式指引，把主流程说明白（观感批）。
         T-1a：文案跟着改了 —— 科目卡现在在下面，指引得说清「先从下面选任务」。 -->
    <p class="timer-idle-hint" id="timerIdleHint">先从下面选一个任务，点「开始」就会计时</p>
  </section>

  <div class="tm-mods-title">
    <p class="section-title">选择本次任务</p>
    <span class="hint">每个科目点「开始」直接记时；想自己命名，用上面那条栏</span>
  </div>
  <div class="timer-mods" id="timerMods"></div>

  <section class="card rec-mini">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="recTotalMini">0h0m</b></span>
    </div>
    <div class="rec-mini-grid" id="recMiniGrid"></div>
    <p class="rec-empty" id="recEmpty">还没有计时记录。开始一次专注学习吧。</p>
  </section>
</main>
