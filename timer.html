<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>计时学习 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<script defer src="js/data.js"></script>
<script defer src="js/common.js"></script>
<script defer src="js/timer.js"></script>
<style>
  .mode-tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:2px solid var(--line)}
  .mode-tabs button{flex:1;padding:10px 0;font-size:15px;font-weight:600;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
  .mode-tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}
</style>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">计时学习</h1>
  <p class="page-sub">选择模块，点开始。一次只跑一个计时器；要离开就点「暂停」，回来点「继续」，系统自动算出真实专注时间。</p>

  <div class="mode-tabs" id="modeTabs">
    <button data-mode="vocab" class="active">单词</button>
    <button data-mode="subject">雅思科目</button>
  </div>

  <div class="live-timer" id="liveTimer">00:00:00</div>
  <div class="card" style="text-align:center;margin-top:-10px">
    <div id="activeInfo" class="muted">当前没有进行中的学习</div>
    <div id="focusInfo" class="muted" style="margin-top:4px;min-height:18px"></div>
    <div style="margin-top:12px">
      <button class="btn btn-danger" id="stopBtn" disabled>结束并保存</button>
      <button class="btn" id="pauseBtn" disabled style="margin-left:8px">暂停</button>
    </div>
  </div>

  <div id="moduleGrid" class="grid"></div>
</main>

</body>
</html>
