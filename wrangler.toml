name = "ielts-study-hub"
compatibility_date = "2024-09-23"

# ===== 云端同步 KV 绑定 =====
# 1) 创建命名空间：wrangler kv namespace create SYNC_KV --pages
# 2) 把命令返回的 namespace id 填到下面 id 处
# 3) 部署：wrangler pages deploy .  （在本项目根目录执行）
[[kv_namespaces]]
binding = "SYNC_KV"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

# ===== 云端语音识别（腾讯云 ASR，functions/api/asr.js 用）=====
# 密钥【不要】写进本文件 / git。两种绑定方式任选其一：
#   方式A（推荐）：Cloudflare 控制台 → 站点设置 → Functions → Environment variables，
#     新增 TC_SECRET_ID（明文或 secret 类型）、TC_SECRET_KEY（secret 类型）。
#   方式B：wrangler pages secret put TC_SECRET_ID / wrangler pages secret put TC_SECRET_KEY
# 绑定后前端「口语录音转文字」才会生效；未绑定时 /api/asr 返回 503，前端自动降级为手打。

