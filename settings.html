<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.deepseek.com; object-src 'none'; base-uri 'none'" />
<!-- frame-ancestors 只由 HTTP 响应头下发（CF Pages 根目录 _headers）：按 CSP 规范它写在 meta 里会被浏览器忽略，本页 meta CSP 不再包含该指令 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>设置 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css?v=20261001l" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=6" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=6">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=6">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=6">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js?v=20260930g"></script>
  <script defer src="js/common.js?v=20261001n"></script>
  <script src="js/settings.js?v=20261001h" defer></script>
<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .ui-loader{margin-bottom:8px}
@media (prefers-reduced-motion: reduce){#bootLoader .ui-loader-dot,#bootLoader .ui-loader-shadow{animation:none}#bootLoader .ui-loader-dot{top:20px;height:20px;border-radius:50%;transform:none}#bootLoader .ui-loader-shadow{opacity:.5;transform:scaleX(1)}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">

  <section class="card">
    <h2>基本信息</h2>
    <div class="form-row">
      <div><label>昵称</label><input id="sName" /></div>
      <div><label>下次考试日期</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input id="sExam" type="date" />
          <span id="settingsCountdown" class="badge" style="font-size:12.5px;white-space:nowrap"></span>
        </div>
      </div>
      <div><label>每日目标（小时）</label><input id="sGoal" type="number" min="1" max="16" /></div>
    </div>
    <div class="form-row settings-options" style="gap:16px;align-items:center;margin-top:12px;flex-wrap:wrap">
      <div class="settings-option">
        <span class="settings-option-label">主题（日 / 夜）</span>
        <div class="theme-switch theme-switch--sm">
          <input type="checkbox" id="sThemeToggle" class="theme-switch__checkbox" />
          <label class="theme-switch__container" for="sThemeToggle">
            <div class="theme-switch__circle-container">
              <div class="theme-switch__sun-moon-container">
                <div class="theme-switch__moon">
                  <div class="theme-switch__spot"></div>
                  <div class="theme-switch__spot"></div>
                  <div class="theme-switch__spot"></div>
                </div>
                <div class="theme-switch__clouds"></div>
              </div>
              <div class="theme-switch__stars-container">
                <svg viewBox="0 0 24 24" width="100%" height="100%" fill="currentColor" aria-hidden="true">
                  <circle cx="4" cy="6" r="1"/><circle cx="10" cy="3" r="1.3"/><circle cx="16" cy="7" r=".9"/><circle cx="20" cy="4" r="1.1"/><circle cx="7" cy="11" r=".8"/><circle cx="13" cy="13" r="1"/><circle cx="19" cy="11" r=".9"/>
                </svg>
              </div>
            </div>
          </label>
        </div>
      </div>
      <label class="settings-option settings-option-check">
        <input type="checkbox" id="sChime" checked />
        <span>专注结束播放轻柔提示音</span>
      </label>
      <label class="settings-option settings-option-check">
        <input type="checkbox" id="sAdhd" />
        <span>启用「服药」模块（ADHD 专注达药效窗口记录）</span>
      </label>
      <!-- 服药说明行已删（她 10/1 晚拍板：冗余） -->
    </div>
  </section>

  <section class="card">
    <h2>目标分数</h2>
    <div class="form-row">
      <div><label>总分</label><input id="tOverall" type="number" step="0.5" min="0" max="9" /></div>
      <div><label>听力</label><input id="tListening" type="number" step="0.5" min="0" max="9" /></div>
      <div><label>阅读</label><input id="tReading" type="number" step="0.5" min="0" max="9" /></div>
      <div><label>写作</label><input id="tWriting" type="number" step="0.5" min="0" max="9" /></div>
      <div><label>口语</label><input id="tSpeaking" type="number" step="0.5" min="0" max="9" /></div>
    </div>
  </section>

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>口语模考</h2>
    <!-- 口语说明两段并一段（她 10/1 晚拍板：瘦身） -->
    <p class="muted">口语按官方 band 评「语法」和「词汇」；<b>流利度与发音 AI 评不了</b>，由你在下面自填固定分（0–9，不填不计入总分）。注意：这是你自己的估分，不会随练习变化，不是机器测出来的。</p>
    <div class="form-row">
      <div><label>固定流利度分（可选，0–9）</label><input id="sFlu" type="number" min="0" max="9" step="0.5" placeholder="如 6（不填则流利度不计入总分）" /></div>
      <div><label>固定发音分（可选，0–9）</label><input id="sPron" type="number" min="0" max="9" step="0.5" placeholder="如 6（不填则发音不计入总分）" /></div>
    </div>
  </section>

  <!-- AI 接口设置模块已下线（她 10/1 拍板）：商业化后 AI 一律走站内通道（站长服务端 Key），用户不接触 Key。
       id="ai" 锚点保留空壳防外链 settings.html#ai 死跳。 -->

  <section class="card">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M17.5 19a4.5 4.5 0 0 0 .4-9A6.5 6.5 0 0 0 5.3 12.6 4 4 0 0 0 6.5 19h11z"/></svg>云端同步</h2>
    <p class="muted">手机号 / 用户名 + 密码登录，多设备数据互通。</p>
    <!-- 未登录：登录 / 设密码 -->
    <div id="syncLoginForm">
      <div class="form-row">
        <div style="flex:1;min-width:170px"><label>手机号 / 用户名</label><div class="ui-form-control" style="width:100%;max-width:280px"><input class="ui-input" id="sAcct" placeholder="手机号或用户名（6-20 位）" autocomplete="username" maxlength="20" /><span class="ui-input-border"></span></div></div>
        <div style="flex:1;min-width:150px"><label>密码</label><div class="ui-form-control" style="width:100%;max-width:280px"><input class="ui-input" id="sPass" type="password" placeholder="至少 6 位" autocomplete="current-password" /><span class="ui-input-border"></span></div></div>
        <div style="flex:1;min-width:150px"><label>邀请码（选填 · 内测码注册即送会员）</label><div class="ui-form-control" style="width:100%;max-width:280px"><input class="ui-input" id="sInvite" placeholder="不填也能注册" autocomplete="off" maxlength="16" style="text-transform:uppercase" /><span class="ui-input-border"></span></div></div>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn" id="syncLoginBtn" type="button">登录</button>
        <button class="btn" id="syncRegisterBtn" type="button">设置密码（首次）</button>
      </div>
    </div>
    <!-- 已登录：改密码 + 退出（「已登录」一行已删：与下方 syncState 状态行重复；检查/立即同步按钮已删——她拍板自动同步足够 10/1 晚） -->
    <div id="syncUserBox" style="display:none">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="syncChangeBtn" type="button">修改密码</button>
        <button class="btn" id="syncLogoutBtn" type="button">退出登录</button>
      </div>
      <div id="syncChangeForm" style="display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:12px">
        <div class="form-row">
          <div style="flex:1;min-width:150px"><label>当前密码</label><div class="ui-form-control" style="width:100%;max-width:280px"><input class="ui-input" id="sOldPass" type="password" autocomplete="current-password" /><span class="ui-input-border"></span></div></div>
          <div style="flex:1;min-width:150px"><label>新密码</label><div class="ui-form-control" style="width:100%;max-width:280px"><input class="ui-input" id="sNewPass" type="password" placeholder="至少 6 位" autocomplete="new-password" /><span class="ui-input-border"></span></div></div>
        </div>
        <div style="margin-top:8px"><button class="btn" id="syncChangeSave" type="button">保存新密码</button></div>
      </div>
    </div>
    <p id="syncStatus" class="muted" style="margin:6px 0 0"></p>
    <p id="syncState" class="muted" style="margin:2px 0 0"></p>
    <p id="lastSyncTs" class="muted" style="margin:2px 0 0"></p>
    <!-- 检查同步状态 / 立即同步到云端 两按钮已删（她 10/1 晚拍板：自动同步足够） -->
  </section>

  <!-- 「保存全部设置」条已删（她 10/1 晚拍板）：改为编辑即自动保存（settings.js change 事件 → 防抖 saveSettings） -->

  <section class="card">
    <h2>数据管理</h2>
    <p class="muted">所有数据存在本机浏览器。导出备份后再做危险操作。</p>
    <div class="form-row" style="gap:10px;align-items:center;margin-top:8px">
      <button class="btn btn-sm" id="exportBtn">导出 JSON</button>
      <button class="btn btn-sm" id="importBtn">导入 JSON</button>
      <input type="file" id="importFile" accept="application/json" hidden />
      <button class="btn btn-sm" id="resetBtn" style="margin-left:auto;color:var(--danger);background:var(--danger-soft);border-color:transparent">清空所有数据</button>
    </div>
    <div id="importErr" class="ui-err-box" style="margin-top:10px"></div>
  </section>

  <!-- design/80 PWA 安装卡已删（她 10/1 晚拍板）：安装入口保留在首页底部轻量条「📦 安装到桌面」 -->

  <!-- 站长联系方式（她 10/1：设置页放微信，用户有问题可私信反馈） -->
  <section class="card">
    <h2>联系站长</h2>
    <p class="muted" style="margin:0 0 8px;font-size:13.5px">使用中有任何问题或建议，欢迎加微信反馈：</p>
    <p style="margin:0;font-size:15px"><b>微信：g285448525</b></p>
    <p class="muted" style="margin:6px 0 0;font-size:12.5px">加的时候标一下来意（如「雅思站用户」），都会通过。</p>
  </section>
</main>

</body>
</html>
