<main class="container">
  <h1 class="page-title">机考真题</h1>
  <p class="page-sub">一键跳转常用机考/练习平台。</p>

  <section class="card">
    <h2>🌐 常用平台</h2>
    <div class="list-item"><span>九分学长·考雅机考平台<span class="muted">（本地软件，每天打开刷题）</span></span><span class="badge">本地</span></div>
    <div class="list-item"><span>雅思官网（报名 / 模考）</span><a class="btn btn-sm" href="https://www.ielts.org/" target="_blank" rel="noreferrer">打开</a></div>

    <div class="list-item"><span>ChatGPT（口语对话练习）</span><a class="btn btn-sm" href="https://chat.openai.com/" target="_blank" rel="noreferrer">打开</a></div>
    <p class="muted" style="margin-top:10px">注：学为贵机考、小站雅思目前不常用，已从列表移除。</p>
  </section>

  <section class="card">
    <h2>📝 本周机考计划建议</h2>
    <ul style="color:var(--muted);font-size:14px;line-height:1.8;margin:0;padding-left:18px">
      <li>阅读：每天 1 篇 P1，重点练判断题（FALSE vs NOT GIVEN）。</li>
      <li>听力：S1/S4 填空为王，语料库每天坚持听写。</li>
      <li>写作：考前一周开始背模板，现在先熟悉题型。</li>
      <li>口语：用 GPT 做 P1 快速问答 + P2 厦门故事串题。</li>
    </ul>
  </section>
