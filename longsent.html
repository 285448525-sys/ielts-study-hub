<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>长难句拆解 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/prompts.js"></script>
  <script src="js/longsent.js" defer></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">长难句拆解</h1>
  <p class="page-sub">把阅读里读不懂的长难句粘进来，自动拆解语法结构、提取考点词、给出同义替换——帮你读得懂、记得住、写得出。</p>

  <section class="card">
    <h2>粘贴长难句</h2>
    <textarea id="sentInput" placeholder="在此粘贴你遇到的长难句，例如：&#10;The theory, which was proposed by a group of researchers who had spent decades observing the species, suggests that the decline is not merely a temporary fluctuation but a sign of a deeper ecological imbalance."></textarea>
    <div class="form-row" style="align-items:flex-end;margin-top:10px">
      <button class="btn btn-primary" id="analyzeBtn">拆解分析</button>
      <span id="sentStatus" class="word-status" aria-live="polite"></span>
    </div>
  </section>

  <section class="card" id="resultCard" style="display:none">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2>拆解结果</h2>
      <button class="btn btn-sm btn-ghost" id="copyBtn">复制全文</button>
    </div>
    <blockquote id="origSent" class="quote"></blockquote>
    <div id="resultBody"></div>
  </section>

  <section class="card" id="histCard" style="display:none">
    <h2>我的拆解记录 · <span id="histCount">0</span></h2>
    <div id="histList" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:10px"></div>
  </section>
</main>

</body>
</html>
