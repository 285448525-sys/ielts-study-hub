<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>每周建议 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/weekly.js" defer></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">每周计划自动建议</h1>
  <p class="page-sub">根据你的考试日期、模考成绩和目标，自动排一周重点。可一键把某天建议填进「学习计划」。</p>

  <section class="card">
    <h2>当前状态</h2>
    <div id="statusBox"></div>
  </section>

  <section class="card">
    <h2>🎯 考试目标</h2>
    <p class="muted">写下在下次考试之前想完成的任务（一行一个）。系统会根据距考试的天数，自动把它们按周分配，形成大致目标。</p>
    <textarea id="examTasks" placeholder="例如：&#10;听力语料库刷完 3 章&#10;阅读真题做完 10 套&#10;写作 Task2 练 6 篇并找 GPT 批改&#10;口语 P2 串题素材全部过一遍"></textarea>
    <div class="form-row" style="align-items:center;margin-top:10px">
      <p class="muted" style="flex:1;margin:0" id="examGoalHint"></p>
      <button class="btn btn-primary" id="genExamGoal" style="flex:none">生成目标建议</button>
    </div>
    <div id="examGoalBox" style="margin-top:14px"></div>
  </section>

  <section class="card">
    <h2>📝 本周我想完成的任务</h2>
    <p class="muted">自己写这一周准备完成的任务（一行一个），点「自动分配」后系统会把它们均匀分到 7 天里，再结合你的弱项自动补充每日建议。</p>
    <textarea id="weekTasks" placeholder="例如：&#10;背完 Word List 5-7&#10;写 1 篇大作文&#10;精听 3 段 S3"></textarea>
    <div class="form-row" style="align-items:center;margin-top:10px">
      <p class="muted" style="flex:1;margin:0">写好后点「自动分配」，系统会按天排好并叠加弱项建议。</p>
      <button class="btn" id="importExamGoal" style="flex:none">从考试目标带入本周</button>
      <button class="btn btn-primary" id="autoAssign" style="flex:none">自动分配</button>
    </div>
  </section>

  <section class="card">
    <div class="form-row" style="align-items:center">
      <p class="muted" style="flex:1;margin:0">也可以直接按弱项自动排一周（不含上面自定义任务）。</p>
      <button class="btn btn-primary" id="genWeek" style="flex:none">按弱项生成</button>
      <button class="btn" id="fillAll" style="flex:none">一键生成整周</button>
    </div>
  </section>

  <section id="weekBox"></section>
</main>

</body>
</html>
