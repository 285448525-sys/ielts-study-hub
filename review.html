<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>
<title>回顾 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css?v=20260904k" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js?v=20260830u"></script>
<script defer src="js/common.js?v=20260904e"></script>
<script defer src="js/scores.js?v=20260830u"></script>
<script defer src="js/history.js?v=20260830u"></script>
<script defer src="js/mock-report.js?v=20260830u"></script>
<script defer src="js/mock-history.js?v=20260830u"></script>
<script defer src="js/mock-summary.js?v=20260830u"></script>
<script defer src="js/speaking-practice.js?v=20260830u"></script>
<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .ui-loader{margin-bottom:8px}
@media (prefers-reduced-motion: reduce){#bootLoader .ui-loader-dot,#bootLoader .ui-loader-shadow{animation:none}#bootLoader .ui-loader-dot{top:20px;height:20px;border-radius:50%;transform:none}#bootLoader .ui-loader-shadow{opacity:.5;transform:scaleX(1)}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <div class="review-wrap">
    <div class="page-head-row">
      <h1 class="page-title">回顾</h1>
      <div class="tabs pill-tabs review-pill-tabs">
        <button class="tab-btn pill-tab active" data-tab="breakdown">模考</button>
        <button class="tab-btn pill-tab" data-tab="overall">实战</button>
        <button class="tab-btn pill-tab" data-tab="speaking">口语</button>
        <button class="tab-btn pill-tab" data-tab="record">轨迹</button>
      </div>
    </div>

    <section class="review-pane">
      <!-- 分项模考 Tab（默认） -->
      <div id="tab-breakdown" class="tab-panel active">
        <section class="card">
          <h2>添加分项记录</h2>
          <div>
            <div class="form-row">
              <div><label>粒度</label>
                <select id="mkGran">
                  <option value="whole">整卷（录全部 Part）</option>
                  <option value="part">单项（只录一个 Part）</option>
                </select>
              </div>
              <div><label>题型</label>
                <select id="mkType">
                  <option value="listening">听力</option>
                  <option value="reading">阅读</option>
                  <option value="speaking">口语</option>
                  <option value="writing">写作</option>
                </select>
              </div>
              <div><label>日期</label><input type="date" id="mkDate" /></div>
            </div>

            <div class="form-row" id="mkPartPick" hidden>
              <div style="flex:0 0 110px;min-width:90px"><label>选择 Part</label><select id="mkPart"></select></div>
              <div style="flex:1;min-width:160px"><label id="mkPartInputLabel">答对题数</label><input type="number" id="mkPartInput" min="0" placeholder="0" /></div>
            </div>

            <div id="mkParts" class="mk-parts"></div>

            <button class="btn btn-primary" id="mkAdd">保存分项</button>
          </div>
        </section>

        <section class="card">
          <div class="form-row" style="align-items:center">
            <h2 class="inline-h2">表现统计</h2>
            <div class="mk-filter-wrap"><label>范围</label>
              <select id="mkFilter">
                <option value="all">全部</option>
                <option value="whole">仅整卷</option>
                <option value="part">仅单项</option>
              </select>
            </div>
          </div>
          <h3>题型表现</h3>
          <div id="mkTypeStats"></div>
          <h3>各 Part 表现</h3>
          <div id="mkPartStats"></div>
        </section>

        <section class="card">
          <h2>分项记录列表</h2>
          <div id="mkList"></div>
        </section>
      </div>

      <!-- 实战 Tab -->
      <div id="tab-overall" class="tab-panel">
        <div class="grid">
          <section class="card">
            <h2>总览</h2>
            <div class="stat-grid" id="scoreStats"></div>
          </section>
          <section class="card">
            <h2>最近一次 vs 目标</h2>
            <div id="scoreBars"></div>
            <div id="actionTip" class="action-tip"></div>
          </section>
        </div>

        <section class="card">
          <h2>整卷记录列表</h2>
          <div id="scoreList"></div>
        </section>

        <details class="detail-block">
          <summary>添加真题成绩</summary>
          <div>
            <div class="form-row">
              <div><label>模考日期</label><input type="date" id="scoreDate" /></div>
              <div><label>听力</label><input type="number" id="scL" step="0.5" min="0" max="9" placeholder="0–9" /></div>
              <div><label>阅读</label><input type="number" id="scR" step="0.5" min="0" max="9" placeholder="0–9" /></div>
            </div>
            <div class="form-row">
              <div><label>写作</label><input type="number" id="scW" step="0.5" min="0" max="9" placeholder="0–9" /></div>
              <div><label>口语</label><input type="number" id="scS" step="0.5" min="0" max="9" placeholder="0–9" /></div>
              <div><label>备注（可选）</label><input id="scNote" placeholder="备注" /></div>
            </div>
            <button class="btn btn-primary" id="addScore">保存成绩</button>
          </div>
        </details>
      </div>

      <!-- 口语 Tab（整卷口语模考历史，由 mock-history.js 渲染） -->
      <div id="tab-speaking" class="tab-panel">
        <section class="card" id="mockSummaryCard">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>错误总结 <button class="btn sm btn-primary" id="mockSummaryBtn" style="margin-left:8px">生成总结</button></h2>
          <p class="muted">AI 自动统计你所有口语模考里的语法 / 用词错误，列出最高频与需重点修改的类型，并说明其频繁程度。</p>
          <div id="mockSummaryBox"></div>
        </section>

        <section class="card">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>口语整卷模考记录 <span class="muted mock-hist-count" id="mockHistCount"></span></h2>
          <p class="muted">P1→P2→P3 全真模考的历史报告，含逐题转写。点击「展开」看完整评分与转写，刷新不丢。</p>
          <div id="mockHistoryList"></div>
        </section>
      </div>

      <!-- 学习轨迹 Tab -->
      <div id="tab-record" class="tab-panel">
        <section class="card">
          <h2>近 30 天学习热力</h2>
          <div id="heatmap"></div>
          <div class="cal-legend" id="heatLegend"></div>
        </section>

        <section class="card">
          <h2>每日记录</h2>
          <div id="dayList"></div>
        </section>

        <section class="card" id="spPractice">
          <h2>口语日常练习 <span class="muted" id="spPracticeCount"></span></h2>
          <p class="muted">P1 / P2 单题手写练习的历史（含 AI 评分与纠错），按时间倒序。点击任意一条可展开看回答与纠错。</p>
          <div id="spPracticeList"></div>
        </section>
      </div>
    </section>
  </div>
</main>

</body>
</html>
