<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<style>
/* ===== 10/1 晚 · 回顾页手机端瘦身（她拍板：添加记录卡 ≤1/3 屏、列表收紧、禁左右滑） ===== */
@media(max-width:560px){
  /* 添加分项记录：两列网格 + 小标签，整卡高度压到 ~1/3 屏 */
  .card:has(.mk-entry-row),.card:has(.mk-list-head){padding:14px}
  .mk-entry-row{display:grid !important;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:6px}
  .mk-entry-row > div{min-width:0 !important;flex:none !important}
  .mk-entry-row label{font-size:11px;margin:0 0 2px;display:block}
  .mk-entry-row select,.mk-entry-row input{width:100%;min-width:0;padding:7px 9px;font-size:13px}
  .mk-entry-row #mkAdd{grid-column:1 / -1;min-height:38px;width:100%;margin-top:2px}
  .mk-list-head{display:flex !important;flex-wrap:nowrap;align-items:center;gap:6px;margin-bottom:6px}
  .mk-list-head .inline-h2{flex:none;font-size:15px;margin:0}
  .mk-list-head .mk-filter-wrap{display:flex;align-items:center;gap:4px;margin-left:0 !important;min-width:0;flex:0 1 auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:2px 4px 2px 10px}
  .mk-list-head .mk-filter-wrap > label{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .mk-list-head select{width:auto;min-width:0;flex:none;border:none;padding:5px 2px;font-size:13px;background:transparent}
  /* 记录行收紧 */
  .score-row.mk-row{padding:9px 10px;margin:0 0 8px}
  .score-row.mk-row .mk-note{font-size:12px}
  /* 表现统计头（范围筛选）同行化 */
  .card .form-row .mk-filter-wrap{flex:1;min-width:0;margin-left:0}
  .card .form-row .mk-filter-wrap select{width:100%;min-width:0;padding:8px 10px;font-size:13.5px}
}
/* ===== 记录列表头筛选器 · 桌面版（10/3 她报「这两个按钮太突兀」）=====
   ⚠️ 这块**必须在 @media(max-width:560px) 之外**（媒体查询里那份是移动端微调）——
   否则 1440px 桌面下整块不生效，元素就回退成 common.css:452 裸 select 的
   44px 高 + 白底 + 1px 边框 + 14.5px 字号，在 15px 的标题行里显得格外突兀。
   另：common.css:452 权重 (0,1,3) 高于普通类选择器，必须补 :not() 链压回。 */
.mk-list-head{display:flex !important;flex-wrap:nowrap;align-items:center;gap:8px;margin-bottom:10px}
.mk-list-head .inline-h2{flex:none;font-size:15px;margin:0}
.card .form-row.mk-list-head .mk-filter-wrap{
  display:flex;align-items:center;gap:4px;min-width:0;flex:0 1 auto;
  background:var(--n-100);border:1px solid transparent;border-radius:999px;padding:0 4px 0 12px;
  transition:background .15s,border-color .15s;
}
/* 标签隐藏后两个筛选器要贴到标题行最右（原来靠内联 margin-left:auto，现在由这条实现） */
.card .form-row.mk-list-head .mk-filter-wrap:first-of-type{margin-left:auto !important}
.card .form-row.mk-list-head .mk-filter-wrap:hover{background:var(--n-200);border-color:var(--line)}
.card .form-row.mk-list-head .mk-filter-wrap:focus-within{background:var(--surface);border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
/* 字段名只给读屏器（视觉隐藏）—— 提权到含 .mk-list-head 的选择器，才压得住媒体查询外那条 .card .form-row */
.card .form-row.mk-list-head .mk-filter-wrap > label{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;
}
/* 补 :not() 链压回 common.css:452：44px→34px、白底→透明、1px 边框→无、14.5px→13px */
.card .form-row.mk-list-head .mk-filter-wrap select:not([type=checkbox]):not([type=radio]):not([type=range]){
  width:auto;min-width:0;flex:none;border:none;height:34px;padding:0 22px 0 4px;font-size:13px;
  background:transparent;font-weight:600;color:var(--ink-2);
}
.card .form-row.mk-list-head .mk-filter-wrap select:focus{outline:none;box-shadow:none;background:transparent}

/* ===== 10/17 #9 层次 2 · 记录行里的「逐题明细」展开块（只在回顾页 .mk-row 内用）=====
   数据 = bank.js 交卷时落盘的 mockRecords[].detail[]（{qn,user,right,ok}）。
   ⚠️ 这里的 selector 必须比 common.css 的 #mkList 规则更具体或同位在后，
   否则 .mk-row 的 flex 布局会把 .mk-det 挤成一行里的一个小格（.mk-note 就靠 flex:0 1 100% 解决）。 */
#mkList .mk-det-btn{
  flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:999px;min-height:26px;
  cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,color .15s;
}
#mkList .mk-det-btn:hover{background:var(--n-100);border-color:var(--primary-200)}
#mkList .mk-det-btn.on{background:var(--primary-soft);border-color:var(--primary-200);color:var(--primaryText,var(--primary-900))}
#mkList .mk-det{flex:0 1 100%;min-width:0;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);padding:10px 12px}
#mkList .mk-det[hidden]{display:none}
#mkList .mk-det-head{font-size:12px;font-weight:700;color:var(--ink-2);margin-bottom:8px}
#mkList .mk-det-grid{display:flex;flex-wrap:wrap;gap:5px}
/* 每格 = 一个题号。答对只给题号；答错额外给「正确答案 / 你的答案」两行小字 */
#mkList .mk-dq{
  display:inline-flex;flex-direction:column;align-items:center;gap:1px;
  min-width:34px;padding:4px 7px;border-radius:7px;border:1px solid transparent;
  font-size:11.5px;line-height:1.25;font-variant-numeric:tabular-nums;
}
#mkList .mk-dq b{font-weight:800;font-size:12px}
#mkList .mk-dq.ok{background:#e7f6ef;border-color:#cfe6dd;color:#1f7a5c}
#mkList .mk-dq.no{background:#fdeceb;border-color:#f0c9c4;color:#b3261e}
#mkList .mk-dq.no i{font-style:normal;font-weight:700;font-size:10.5px;color:#1f7a5c;background:#fff;border-radius:4px;padding:0 4px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mkList .mk-dq.no em{font-style:normal;font-size:10.5px;color:#b3261e;opacity:.85;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mkList .mk-det-legend{display:flex;align-items:center;gap:4px;margin-top:9px;font-size:10.5px;color:var(--muted);flex-wrap:wrap}
#mkList .mk-det-legend .lg{display:inline-block;width:9px;height:9px;border-radius:3px;margin-left:6px}
#mkList .mk-det-legend .lg:first-child{margin-left:0}
#mkList .mk-det-legend .lg.ok{background:#e7f6ef;border:1px solid #cfe6dd}
#mkList .mk-det-legend .lg.no{background:#fdeceb;border:1px solid #f0c9c4}
        /* 10/17 #9 层次 3：按题型看正确率的说明行（只在本页用 → 写本页内联样式，不动 common.css，省一次全站 bump） */
        #mkQtStats .mk-qt-note{margin:10px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.75;overflow-wrap:anywhere}
        #mkQtStats .mk-qt-note b{color:var(--ink)}
</style>
<style id="t010ReviewRestyle">
/* =========================================================================
   T-010 · 回顾页 UI 整改（2026-10-22）
   视觉基准 = 口语页 T-004 成品（speaking.html）：
     · 顶部 tab 下划线式   → 靠 .page-head-row .sp-tabs.pill-tabs（T-004 已有块）
     · 驾驶舱统计条        → .rv-cockpit / .rv-stat-*（对齐 .sp-cockpit / .sp-stat-*）
     · 通栏行列表          → .rv-row（对齐 .sp-card-row：一行一条 / hover 左 2px）
     · 分组标题            → .rv-block-h（对齐 .sp-block-h）
   ⚠️ 三条硬约束（照 T-004 抄来的教训）：
     1. 颜色只引用 token，不新造色值 —— 深色下 --n-* 是反向阶，token 会自动适配。
     2. 不用 --primary-900 当正文色（T-004 踩过：深色无覆盖 = 黑底黑字），
        正文一律 --n-800 / 强调 --primary-700（深/浅都有覆盖值）。
     3. 只改渲染层：DOM 结构与数据字段一个没动（scores.js / mock-history.js 未改）。
   ========================================================================= */

/* ---- 1. 页面主体限宽 ----
   container 已是 max-width:1160（common.css:361）。T-010 只把内容再收一档到 1040，
   与口语页驾驶舱那段的观感一致；窄屏不设限宽（让内容占满）。 */
@media (min-width:1100px){
  .review-wrap{max-width:1040px;margin:0 auto}
}

/* ---- 1b. 顶部 tab 下划线式（T-004 同款；speaking.html 里那段是页内样式，
   本页拿不到 → 原样抄一份。选中态 2.5px teal 下划线。）---- */
.page-head-row .review-pill-tabs.pill-tabs{
  background:none;border:0;border-radius:0;padding:0;box-shadow:none;
  display:flex;align-items:stretch;gap:22px;
}
.page-head-row .review-pill-tabs.pill-tabs .pill-tab{
  background:none;border:0;border-radius:0;box-shadow:none;
  padding:10px 1px 9px;font-size:14.5px;font-weight:600;color:var(--n-600);
  position:relative;transition:color .15s;line-height:1;
}
.page-head-row .review-pill-tabs.pill-tabs .pill-tab:hover:not(.active){color:var(--n-900);background:none}
.page-head-row .review-pill-tabs.pill-tabs .pill-tab.active{color:var(--primary-700);background:none;box-shadow:none}
.page-head-row .review-pill-tabs.pill-tabs .pill-tab.active::after{
  content:'';position:absolute;left:0;right:0;bottom:-1px;height:2.5px;border-radius:2px 2px 0 0;background:var(--primary-600);
}
.page-head-row .review-pill-tabs.pill-tabs .pill-tab:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(58,154,147,.25)}
@media(max-width:560px){
  .page-head-row .review-pill-tabs.pill-tabs{gap:0;width:100%}
  .page-head-row .review-pill-tabs.pill-tabs .pill-tab{flex:1;justify-content:center;padding:9px 4px;font-size:14px}
}

/* ---- 2. 分组标题（对齐 .sp-block-h）---- */
.rv-block-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px 1px;flex-wrap:wrap}
.rv-block-h h2,.rv-block-h h3{margin:0;font-size:15px;font-weight:600;color:var(--n-800);letter-spacing:-.01em}
.rv-block-h .desc{font-size:12.5px;color:var(--n-500);font-weight:400}
.rv-block-h .spacer{flex:1}
/* 卡片内原有的裸 <h2>/<h3>（scores.js / review.html 静态）统一降级为分组标题观感，
   但保留其作为 h 标签的语义层级 —— 只改字号/字重/间距，不换标签。 */
.review-pane .card > h2,.review-pane .card > h3{
  font-size:15px;font-weight:600;color:var(--n-800);letter-spacing:-.01em;margin:0 0 12px;
}
.review-pane .card > h2 + h3,.review-pane .card > h3{margin-top:18px;color:var(--n-700);font-size:13.5px}
.review-pane .card > h2 svg{width:15px;height:15px;vertical-align:-2px;margin-right:5px;color:var(--n-500)}

/* ---- 3. 驾驶舱式统计条（对齐 .sp-cockpit / .sp-cockpit-stats 三格）----
   用途：实战 tab 的「总览」、模考 tab 的「表现统计」头部。
   ⚠️ 三格用 grid，格间竖线用 border-left（T-004 同款口径），不是卡片铺开。 */
.rv-cockpit{
  background:var(--n-0);border:1px solid var(--n-300);border-radius:16px;
  box-shadow:var(--sh-2);padding:20px 22px;margin:0 0 18px;
}
.rv-cockpit-label{font-size:12.5px;font-weight:500;color:var(--n-500);letter-spacing:.02em}
.rv-cockpit-num{font-size:28px;font-weight:700;color:var(--primary-700);letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums}
.rv-cockpit-unit{font-size:13.5px;font-weight:600;color:var(--primary-700)}
.rv-cockpit-stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:18px;padding-top:16px;border-top:1px solid var(--n-300)}
.rv-stat-cell{padding-right:18px;min-width:0}
.rv-stat-cell + .rv-stat-cell{padding-left:20px;border-left:1px solid var(--n-300)}
.rv-stat-k{font-size:12px;color:var(--n-500)}
.rv-stat-v{display:flex;align-items:baseline;gap:5px;margin-top:3px;font-size:17px;font-weight:600;color:var(--n-800);
  font-variant-numeric:tabular-nums}
.rv-stat-v i{font-style:normal;font-size:12.5px;font-weight:500;color:var(--n-500)}

/* 总览卡片：stat-grid 的卡片通行化（原来是带顶边框的小方卡，铺满一行显得散） */
#scoreStats.stat-grid{grid-template-columns:repeat(3,1fr);gap:0;margin-bottom:0}
#scoreStats .stat-card{
  background:none;border:0;border-top:0;border-radius:0;box-shadow:none;padding:0;text-align:left;
}
#scoreStats .stat-card:hover{transform:none;box-shadow:none}
#scoreStats .stat-value{font-size:24px;font-variant-numeric:tabular-nums}
/* 保留 accent 配色：statCard 传的 warn/med/danger/vocab/primary/muted 在深色主题下**全都有覆盖值**
   （common.css 的 [data-theme=dark] 块已逐条重定义），不会出现 T-004 那种黑底黑字。 */
#scoreStats .stat-label{font-size:12px;color:var(--n-500);margin-top:5px}
@media (max-width:720px){
  .rv-cockpit{padding:16px 14px;border-radius:14px}
  .rv-cockpit-num{font-size:24px}
  .rv-cockpit-stats,#scoreStats.stat-grid{grid-template-columns:1fr;gap:14px}
  .rv-stat-cell + .rv-stat-cell{padding-left:0;padding-top:14px;border-left:0;border-top:1px solid var(--n-300)}
}


/* 表现统计里的题型格（#mkTypeStats 内部 .stat-grid）：同样去卡化、格间竖线。
   ⚠️ 只动 #mkTypeStats 内的 .stat-card —— 别的页面/别的模块的 stat-card 一律不受影响。 */
#mkTypeStats .stat-grid{
  grid-template-columns:repeat(4,1fr);gap:0;margin:0;
  border-top:1px solid var(--n-300);padding-top:14px;
}
#mkTypeStats .stat-card{
  background:none;border:0;border-radius:0;box-shadow:none;padding:0 16px;text-align:left;
}
#mkTypeStats .stat-card:first-child{padding-left:0}
#mkTypeStats .stat-card + .stat-card{border-left:1px solid var(--n-300)}
#mkTypeStats .stat-card:hover{transform:none;box-shadow:none}
#mkTypeStats .stat-value{font-size:22px;font-variant-numeric:tabular-nums}
#mkTypeStats .stat-label{font-size:11.5px;color:var(--n-500);margin-top:4px}
@media (max-width:720px){
  #mkTypeStats .stat-grid{grid-template-columns:repeat(2,1fr);gap:14px 0}
  #mkTypeStats .stat-card:nth-child(odd){padding-left:0;border-left:0}
  #mkTypeStats .stat-card{padding:0 12px}
}


/* ---- 7. 口语练习数据（#progressView，progress.js 渲染）四格：同驾驶舱观感 ---- */
#progressView .prog-grid{grid-template-columns:repeat(4,1fr);gap:0;margin:0 0 18px;
  background:var(--n-0);border:1px solid var(--n-300);border-radius:14px;box-shadow:var(--sh-2);padding:16px 18px}
#progressView .prog-card{background:none;border:0;border-radius:0;box-shadow:none;padding:0 16px;text-align:left}
#progressView .prog-card:first-child{padding-left:0}
#progressView .prog-card + .prog-card{border-left:1px solid var(--n-300)}
#progressView .prog-card .n{font-size:22px;font-weight:700;color:var(--primary-700);font-variant-numeric:tabular-nums;line-height:1.1}
#progressView .prog-card .l{font-size:11.5px;color:var(--n-500);margin-top:4px}
@media (max-width:720px){
  #progressView .prog-grid{grid-template-columns:repeat(2,1fr);gap:14px 0;padding:14px}
  #progressView .prog-card:nth-child(odd){padding-left:0;border-left:0}
  #progressView .prog-card{padding:0 12px}
}


/* ---- 8. 口语整卷记录 · 移动端不换行崩字（T-010 375 实测：日期被折成「2026-10-」+「21」，
       总分徽章被挤成两行）。修法：日期 nowrap + 徽章 flex:none，让「展开/删除」自己换行。 ---- */
@media (max-width:640px){
  #mockHistoryList .mock-hist-head{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  #mockHistoryList .mock-hist-meta{flex:1 1 100%;flex-wrap:wrap;gap:6px;min-width:0}
  #mockHistoryList .mock-hist-meta b{white-space:nowrap;flex:none}
  #mockHistoryList .mock-hist-meta .badge{white-space:nowrap;flex:none}
  #mockHistoryList .mock-hist-dim{white-space:nowrap;flex:none;font-size:11.5px;padding:2px 7px}
  #mockHistoryList .mock-hist-ops{flex:none;gap:6px;margin-left:0}
  /* 表格化表头在 <1024 本就 display:none，这里只确保 375 下不出现 */
  .mock-hist-thead{display:none}
}

/* ---- 4. 通栏行列表（对齐 .sp-card-row：一行一条、hover 左侧 2px 标记）----
   覆盖对象：整卷记录 .score-row / 分项记录 #mkList .mk-row / 口语整卷 .mock-hist-card。
   ⚠️ 只改外观，不动 flex 子项顺序与 data-*（删除按钮靠 data-del / data-id 绑定，零影响）。 */
#scoreList .score-row,
#mkList .mk-row,
#mockHistoryList .mock-hist-card{
  position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  padding:12px 14px 12px 0;margin:0 0 6px;
  background:none;border:0;border-bottom:1px solid var(--n-100);border-radius:0;box-shadow:none;
  transition:background .15s;
}
#scoreList .score-row:last-child,
#mkList .mk-row:last-child,
#mockHistoryList .mock-hist-card:last-child{border-bottom:0}
#scoreList .score-row:hover,
#mkList .mk-row:hover,
#mockHistoryList .mock-hist-card:hover{background:var(--primary-50)}
#scoreList .score-row::before,
#mkList .mk-row::before,
#mockHistoryList .mock-hist-card::before{
  content:'';position:absolute;left:-14px;top:0;bottom:0;width:2px;background:transparent;border-radius:0 2px 2px 0;
}
#scoreList .score-row:hover::before,
#mkList .mk-row:hover::before,
#mockHistoryList .mock-hist-card:hover::before{background:var(--primary-500)}

/* 行内信息层级：主信息（日期 + 总分）突出，次要信息灰字小号 */
#scoreList .score-row strong,
#mkList .mk-row .mk-date{
  flex:none;font-size:14px;font-weight:600;color:var(--n-800);font-variant-numeric:tabular-nums}
#scoreList .score-row .badge.overall,
#mkList .mk-row .badge.overall{
  background:var(--primary-soft);color:var(--primary-text);font-weight:700}
/* 次要：四项小分 / 用时 / 备注 */
#scoreList .score-row .muted,
#mkList .mk-row .mk-note{font-size:12px;color:var(--n-500);font-weight:400}
#mkList .mk-parts-inline .badge{font-size:11.5px;font-weight:400;color:var(--n-600);opacity:1}
/* 删除操作：常驻低对比，hover 变实（她「删除要能一眼找到」→ 不用 hover 才显形） */
#scoreList .score-row .plan-del,
#mkList .mk-row .mk-del{margin-left:auto;flex:none;opacity:.5;color:var(--n-500);transition:opacity .15s,color .15s}
#scoreList .score-row:hover .plan-del,
#mkList .mk-row:hover .mk-del{opacity:1;color:var(--danger)}
@media (max-width:640px){
  #scoreList .score-row,
  #mkList .mk-row{padding:10px 0 10px 0}
  #scoreList .score-row::before,
  #mkList .mk-row::before{left:-10px}
  #scoreList .score-row strong,
  #mkList .mk-row .mk-date{font-size:13.5px}
}

/* ---- 5. 口语整卷记录：桌面表格化保留（10/6 已做，这里只统一行观感）---- */
@media (min-width:1024px){
  #tab-speaking .mock-hist-card{
    padding:12px 14px;margin-bottom:6px;border:0;border-bottom:1px solid var(--n-100);background:none;box-shadow:none}
  #tab-speaking .mock-hist-card:hover{background:var(--primary-50);border-color:transparent}
  #tab-speaking .mock-hist-card::before{
    content:'';position:absolute;left:-14px;top:0;bottom:0;width:2px;background:transparent}
  #tab-speaking .mock-hist-card:hover::before{background:var(--primary-500)}
  #tab-speaking .mock-hist-thead{padding:0 14px 8px;color:var(--n-500)}
  #tab-speaking .mock-hist-meta b{font-size:14px;font-weight:600;color:var(--n-800)}
}

/* ---- 6. 空态（renderEmpty 的 .empty）在整页里也要跟新观感一致 ---- */
.review-pane .empty{padding:16px 14px;text-align:left;color:var(--n-500);font-size:13.5px;
  background:var(--n-50);border:1px dashed var(--n-300);border-radius:10px}
[data-theme="dark"] .review-pane .empty{background:var(--n-50)}

/* ===== 10/6 桌面端：回顾页「口语模考记录」表格化 =====

@media (min-width:1024px){

<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>

<main class="container">
  <div class="review-wrap">
    <div class="page-head-row">
      <div class="tabs pill-tabs sp-tabs review-pill-tabs">
        <button class="tab-btn pill-tab active" data-tab="breakdown">模考</button>

        <button class="tab-btn pill-tab" data-tab="record">轨迹</button>
      </div>
    </div>

    <section class="review-pane">
      <!-- 分项模考 Tab（默认） -->
      <div id="tab-breakdown" class="tab-panel active">
        <!-- 💡 弱项诊断卡已删（10/1 晚她拍板：与冲刺卡「离目标还差多少」用途重复，且 30 天/7 天两套口径数字互相矛盾） -->
        <!-- 考前冲刺卡（10/1 从首页迁入，她拍板首页放不下；id 保留 dashSprint 供 sprint.js/探针复用） -->
        <section class="sprint" id="dashSprint" hidden></section>
        <section class="card">
          <h2>添加分项记录</h2>
          <div>
            <div class="form-row mk-entry-row">
              <div><label>粒度</label>
                <select id="mkGran">
                  <option value="part">单项</option>
                  <option value="whole">整卷</option>
                </select>
              </div>
              <div><label>题型</label>
                <select id="mkType">
                  <option value="listening">听力</option>
                  <option value="reading">阅读</option>
                  <option value="speaking">口语</option>
                  <option value="writing">写作</option>
                </select>
              </div>
              <div><label>日期</label><input type="date" id="mkDate" /></div>
              <div id="mkPartPick" style="flex:0 0 110px;min-width:90px"><label>选择 Part</label><select id="mkPart"></select></div>
              <div id="mkPartInputWrap" style="flex:1;min-width:160px"><label id="mkPartInputLabel">答对题数</label><input type="number" id="mkPartInput" min="0" placeholder="0" /></div>
            </div>

            <div id="mkParts" class="mk-parts" hidden></div>

            <button class="btn btn-primary" id="mkAdd">保存分项</button>
          </div>
        </section>

        <!-- T-010：表现统计同套驾驶舱观感（标题行 + 三块统计） -->
        <section class="card rv-cockpit">
          <div class="form-row" style="align-items:center">
            <h2 class="inline-h2">表现统计</h2>
            <div class="mk-filter-wrap"><label>范围</label>
              <select id="mkFilter">
                <option value="all">全部</option>
                <option value="recent">近十天</option>
              </select>
            </div>
          </div>
          <h3>题型表现</h3>
          <div id="mkTypeStats"></div>
          <h3>各 Part 表现</h3>
          <div id="mkPartStats"></div>
          <h3>按题型看正确率</h3>
          <div id="mkQtStats"></div>
        </section>

        <section class="card">
          <div class="form-row mk-list-head" style="align-items:center">
            <h2 class="inline-h2">记录列表</h2>
            <!-- 9/29 之之：分项记录加筛选——科目四选一 + 听/读/口/写通用的整卷/单篇粒度

                <option value="reading">阅读</option>
                <option value="speaking">口语</option>
                <option value="writing">写作</option>
              </select>

            <div class="mk-filter-wrap"><label>粒度</label>
              <select id="mkListGran">
                <option value="all">全部</option>
                <option value="whole">整卷</option>
                <option value="part">单篇</option>
              </select>
            </div>
          </div>
          <div id="mkList"></div>
        </section>
      </div>

      <!-- 实战 Tab -->

            <div class="stat-grid" id="scoreStats"></div>

            <h2>最近一次 vs 目标</h2>
            <div id="scoreBars"></div>
            <div id="actionTip" class="action-tip"></div>
          </section>
        </div>

        <section class="card">
          <h2 class="rv-block-h-t">整卷记录列表</h2>
          <div id="scoreList"></div>
        </section>

        <details class="detail-block">
          <summary>添加真题成绩</summary>
          <div>
            <div class="form-row">
              <div><label>模考日期</label><input type="date" id="scoreDate" /></div>
              <div><label>听力</label><input type="number" id="scL" step="0.5" min="0" max="9" placeholder="0–9" /></div>
              <div><label>阅读</label><input type="number" id="scR" step="0.5" min="0" max="9" placeholder="0–9" /></div>
            </div>
            <div class="form-row">
              <div><label>写作</label><input type="number" id="scW" step="0.5" min="0" max="9" placeholder="0–9" /></div>
              <div><label>口语</label><input type="number" id="scS" step="0.5" min="0" max="9" placeholder="0–9" /></div>
              <div><label>备注（可选）</label><input id="scNote" placeholder="备注" /></div>
            </div>
            <button class="btn btn-primary" id="addScore">保存成绩</button>
          </div>
        </details>
      </div>

      <!-- 口语 Tab（整卷口语模考历史，由 mock-history.js 渲染） -->
      <div id="tab-speaking" class="tab-panel">
        <section class="card" id="mockSummaryCard">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>错误总结 <button class="btn sm btn-primary" id="mockSummaryBtn" style="margin-left:8px">生成总结</button></h2>

          <div id="mockSummaryBox"></div>
        </section>

        <section class="card">
          <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"/></svg>口语整卷模考记录 <span class="muted mock-hist-count" id="mockHistCount"></span></h2>
          <!-- 10/6 桌面端：记录列表改表格化（表头只在这里，列宽与下方 .mock-hist-card 共用 --mhcols）。
               手机端整行 display:none，列表仍是原来的卡片形态。 -->
          <div class="mock-hist-thead" aria-hidden="true">
            <span>日期</span><span>总分</span><span>语法</span><span>词汇</span><span class="mh-ops">操作</span>
          </div>
          <div id="mockHistoryList"></div>
        </section>

        <!-- 口语练习数据（原口语页「数据」tab，9/10 迁移到回顾·口语；由 progress.js 渲染） -->
        <div id="progressView"></div>
      </div>

      <!-- 学习轨迹 Tab -->
      <div id="tab-record" class="tab-panel">
        <section class="card">
          <h2>近 30 天学习热力</h2>
          <div id="heatmap"></div>
          <div class="cal-legend" id="heatLegend"></div>
        </section>

        <section class="card rv-fold" data-foldkey="day">
          <h2 class="rv-fold-head">每日记录 <span class="muted" style="font-size:12px;font-weight:400">点击展开 / 收起</span><span class="rv-arrow">▸</span></h2>
          <div class="rv-fold-body" hidden><div id="dayList"></div></div>
        </section>

        <section class="card rv-fold" id="spPractice" data-foldkey="sp">
          <h2 class="rv-fold-head">口语日常练习 <span class="muted" id="spPracticeCount"></span><span class="rv-arrow">▸</span></h2>
          <div class="rv-fold-body" hidden><div id="spPracticeList"></div></div>
        </section>
      </div>
    </section>
  </div>
</main>
