/* REVIEW-POLISH-1 (v821) 仅本页：往已点头设计稿 REVIEW-TABS-1 精致化。
   全部既有 DOM/ID/数据落点一个不删（rvx-data.js / rec-all.js 照常写它们），只统一视觉皮肤：
   旧 .rv2-* 卡片（彩色四科边 / warn 混色底 / 48px 大号总分）重皮成设计稿那套 teal 精致皮肤，
   补齐设计稿标志细节（可见页头、38px 图标结论条 + 右侧按钮、总览两列）。变量与 .rv-* 组件对齐稿子。*/
:root{
  --teal:#5cb3ab; --teal-d:#3a8f87; --teal-700:#2f7d76; --teal-50:#e8f3f1;
  --bg:#f6f9fb; --surface:#fff; --line:#e6e9ea; --line-2:#eef1f2;
  --ink:#1f2328; --ink-2:#3f464d; --muted:#71767e; --muted-2:#9aa0a6;
  --amber:#b3792c; --amber-50:#fbf1e3; --danger:#bd7364; --danger-50:#f8eeeb;
  --radius:14px; --shadow:0 1px 2px rgba(24,40,48,.04), 0 6px 18px -12px rgba(24,40,48,.18);
}
#hubSubs{display:none!important}
.rv-pane-block{margin:16px 0 0}
.rv-pane-block[hidden]{display:none}
.rv-stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.rv-two-col{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin:14px 0}
.rv-stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;min-height:92px;box-shadow:var(--shadow)}
.rv-stat.ok{border-color:#cde5e1;background:linear-gradient(180deg,#f4faf9,var(--surface))}
.rv-stat .k{font-size:11.5px;color:var(--muted);font-weight:600}
.rv-stat .v{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--ink);line-height:1.25;margin-top:5px}
.rv-stat .v small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.rv-stat .v.teal{color:var(--teal-700)}
.rv-stat .v.warn{color:var(--amber)}
.rv-stat .d{font-size:11px;color:var(--muted-2);margin-top:2px}
.rv-panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.rv-panel-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:15px 18px 4px;margin-bottom:0}
.rv-panel-h b{font-size:13.5px;font-weight:750}
.rv-panel-h span{font-size:11.5px;color:var(--muted)}
.rv-panel-h .right{margin-left:auto}
.rv-ruler-head{display:flex;align-items:baseline;gap:10px;padding:15px 18px 0;margin-bottom:0}
.rv-ruler-head b{font-size:13.5px;font-weight:750}
.rv-ruler-head span{font-size:11.5px;color:var(--muted)}
.rv-ruler-track{position:relative;height:14px;border-radius:8px;background:linear-gradient(90deg,#e9eef0,#dbe9e6 70%,#cfe6e1);margin:24px 20px 0;overflow:visible}
.rv-ruler-track i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--teal);opacity:.28}
.rv-ruler-goal{position:absolute;top:-7px;bottom:-7px;width:2px;background:var(--teal-700)}
.rv-ruler-goal::after{content:"目标";position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:750;color:var(--teal-700);white-space:nowrap}
.rv-ruler-cur{position:absolute;top:-6px;width:4px;height:26px;border-radius:3px;background:var(--ink);transform:translateX(-2px)}
.rv-ruler-cur::after{content:"当前";position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:750;color:var(--ink);white-space:nowrap}
.rv-ruler-ticks{display:flex;justify-content:space-between;margin:26px 20px 16px;font-size:10.5px;color:var(--muted-2)}
.rv-callout{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 18px;border-radius:var(--radius);background:linear-gradient(100deg,var(--teal-50),#f2f9f7 65%,var(--surface));border:1px solid #dceeea;margin:14px 0 0}
.rv-callout .ic{width:38px;height:38px;border-radius:11px;background:var(--surface);color:var(--teal-700);display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:var(--shadow)}
.rv-callout .ic svg{width:20px;height:20px}
.rv-callout .tx{min-width:0;flex:1}
.rv-callout .tx b{display:block;font-size:14px;font-weight:750}
.rv-callout .tx span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.rv-callout .btn{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:700;white-space:nowrap}
.rv-callout .btn:hover{border-color:var(--teal);color:var(--teal-700)}
.rv-subj-row{display:flex;align-items:center;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line-2)}
.rv-subj-row:last-child{border-bottom:0}
.rv-subj-n{width:52px;flex:0 0 auto;font-size:12.5px;font-weight:700}
.rv-subj-track{position:relative;flex:1;height:12px;border-radius:6px;background:var(--bg);overflow:visible}
.rv-fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--teal);opacity:.85}
.rv-fill.weak{background:var(--amber);opacity:.9}
.rv-goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--teal-700)}
.rv-subj-v{width:74px;flex:none;text-align:right;font-size:12.5px;font-weight:750}
.rv-subj-v small{display:block;font-size:10.5px;font-weight:600;color:var(--muted)}
.rv-radar-box{padding:8px 10px 14px}
.rv-radar-box svg{width:280px;max-width:100%;height:auto;display:block;margin:0 auto}
.rv-radar-lab{font-size:12px;fill:var(--muted)}
.rv-radar-legend{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:11px;color:var(--muted)}
.rv-radar-legend i{display:inline-block;width:16px;height:0;border-top:2px solid var(--teal);vertical-align:middle;margin-right:5px}
.rv-radar-legend i.first{border-top:2px dashed var(--muted-2)}
.rv-heat{display:grid;grid-template-rows:repeat(7,13px);grid-auto-flow:column;grid-auto-columns:13px;gap:3px}
.rv-heat i{width:13px;height:13px;border-radius:3px;background:#eef2f2;display:block}
.rv-heat i.l1{background:#dcefeb}.rv-heat i.l2{background:#b8ded7}.rv-heat i.l3{background:#86c7bd}.rv-heat i.l4{background:var(--teal)}
.rv-heat-legend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:10.5px;color:var(--muted-2)}
.rv-heat-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.rv-chart{padding:18px 20px 16px}
.rv-bars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:0 2px;border-bottom:1px solid var(--line)}
.rv-bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.rv-bar i{width:100%;max-width:26px;border-radius:5px 5px 0 0;background:var(--teal);opacity:.85}
.rv-bar.today i{background:var(--teal-d);opacity:1}
.rv-bar em{font-size:10px;font-style:normal;color:var(--muted-2);margin-bottom:2px}
.rv-bar-labels{display:flex;gap:6px;margin-top:7px}
.rv-bar-labels span{flex:1;text-align:center;font-size:10px;color:var(--muted-2)}
.rv-empty{padding:34px 18px;font-size:12.5px;color:var(--muted);text-align:center}
.rv-mobile-tabs{display:none}
.rv2-content.rv-one-col{grid-template-columns:minmax(0,1fr)}

/* 设计稿标志性细节：sparkline / 最近三次 / 可见页头 */
.rv-spark{padding:14px 18px 18px}
.rv-spark svg{width:100%;height:76px;display:block}
.rv-spark-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted-2);margin-top:4px}
.rv-line-grid{stroke:var(--line-2);stroke-width:1;stroke-dasharray:3 4}
.rv-line-dot{fill:var(--surface);stroke:var(--teal);stroke-width:2.4}
.rv-mini-row{display:flex;align-items:center;gap:14px;padding:13px 18px;border-bottom:1px solid var(--line-2);min-height:64px}
.rv-mini-row:last-child{border-bottom:0}
.rv-mini-row .grow{min-width:0;flex:1}
.rv-mini-row .t{font-size:13.5px;font-weight:700}
.rv-mini-row .d{font-size:11.5px;color:var(--muted);margin-top:2px}
.rv-mini-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.rv-mini-pill.key{background:var(--teal-50);color:var(--teal-700)}
.rv-mini-pill.warn{background:var(--amber-50);color:var(--amber)}
.rv-link{font-size:11.5px;color:var(--teal-700);font-weight:700;text-decoration:none;cursor:pointer}
.rv-vhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 16px}
.rv-vhead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.rv-vhead .hint{font-size:12.5px;color:var(--muted)}
.rv-vhead .right{margin-left:auto}

/* 旧 .rv2-* 卡片统一重皮：去彩色四科边 / warn 混色 / 48px 大号总分，换设计稿 teal 精致皮肤 */
.hub-main .rv2-summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;display:grid;grid-template-columns:1fr 2fr;gap:18px;align-items:center;margin:0}
.hub-main .rv2-latest{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.hub-main .rv2-muted,.hub-main .rv2-hint{font-size:11.5px;color:var(--muted)}
.hub-main .rv2-score{font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--teal-700);line-height:1.2}
.hub-main .rv2-score small{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.hub-main .rv2-target{font-size:12.5px;color:var(--muted)}
.hub-main .rv2-subjects{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.hub-main .rv2-subject{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);border-left:0;border-radius:10px;background:var(--bg)}
.hub-main .rv2-subject span{font-size:11px;color:var(--muted);font-weight:600}
.hub-main .rv2-subject b{font-size:19px;font-weight:800;color:var(--ink);line-height:1.2}
.hub-main .rv2-subject small{font-size:10.5px;color:var(--muted-2)}
.hub-main .rv2-subject.rvx-ok{border:1px solid #cde5e1;background:var(--teal-50)}
.hub-main .rv2-subject.rvx-ok b{color:var(--teal-700)}
.hub-main .rv2-subject.rvx-weak{border:1px solid #ecd9b6;background:var(--amber-50)}
.hub-main .rv2-subject.rvx-weak b{color:var(--amber)}
.hub-main .rv2-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:0;overflow:hidden;margin-top:14px}
.hub-main .rv2-card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:15px 18px 10px;border-bottom:1px solid var(--line-2)}
.hub-main .rv2-card-head h2{margin:0;font-size:13.5px;font-weight:750}
.hub-main .rv2-card-head .rv2-hint{font-size:11.5px}
.hub-main .rv2-head-tools{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hub-main .rv2-segment{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hub-main .rv2-segment button{min-height:30px;padding:0 11px;border:0;border-radius:7px;background:transparent;font-size:12px;font-weight:650;color:var(--muted)}
.hub-main .rv2-segment button.active{background:var(--surface);color:var(--teal-700);font-weight:750;box-shadow:var(--shadow)}
.hub-main .rv2-chart,.hub-main #recAll,.hub-main .rv2-perf-grid,.hub-main .rv2-more{padding:14px 18px}
.hub-main .rv2-chart-foot{display:flex;gap:12px;flex-wrap:wrap;padding:0 18px 14px;font-size:11px;color:var(--muted)}
.hub-main .rv2-insight{background:var(--surface)}
.hub-main .rv2-weak{background:linear-gradient(100deg,var(--teal-50),#f2f9f7 70%,var(--surface));border-bottom:1px solid var(--line-2);padding:16px 18px}
.hub-main .rv2-weak>span{font-size:11px;color:var(--muted);font-weight:600}
.hub-main .rv2-weak h2{margin:4px 0;font-size:18px;font-weight:800;color:var(--ink)}
.hub-main .rv2-weak p{margin:0;font-size:12px;color:var(--muted)}
.hub-main .rv2-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px}
.hub-main .rv2-facts>div{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hub-main .rv2-facts b{display:block;font-size:19px;font-weight:800;color:var(--teal-700)}
.hub-main .rv2-facts span{font-size:11px;color:var(--muted)}
.hub-main .rv2-note{padding:0 18px 16px;font-size:11px;color:var(--muted-2)}
.hub-main .rv2-head{position:relative;height:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:2px 0 16px;padding:0}
.hub-main .rv2-head h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;clip:auto;clip-path:none;position:static;width:auto;height:auto}
.hub-main .rv2-head p{margin:0;font-size:12.5px;color:var(--muted)}
.hub-main .rv2-head .rv2-primary{position:static;margin-left:auto}
.hub-main .rv2-primary{min-height:36px;padding:0 14px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;box-shadow:0 6px 16px -8px rgba(58,143,135,.9)}
.hub-main .rv2-primary:hover{background:var(--teal-d)}

.hub-main #rv2Summary .rv2-empty{padding:34px 18px;text-align:center;color:var(--muted);font-size:12.5px}
.hub-main #rv2Summary .rv2-empty h2{margin:0 0 6px;font-size:14px;font-weight:750;color:var(--ink)}
.hub-main #rv2Summary .rv2-empty p{margin:0;font-size:12px}
.hub-main #rv2Summary .rv2-empty .rv2-primary{margin-top:14px;margin-left:0}
.hub-main .rv2-dialog-shell input,.hub-main .rv2-dialog-shell select,.hub-main .rv2-card-head select{border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12.5px;background:var(--surface);color:var(--ink)}
.hub-main .rv2-records,.hub-main .rv2-performance{margin-top:14px}
/* 旧 css/p/review.css 用 .rv2-head>div 的 clip-path 把 h1 藏了、用 .rv2-subjects>#rvxCellX 的 id 特异度给四科上蓝紫黄粉底色。
   本页样式以更高特异度压回设计稿：h1 可见、四科中性卡（只按达标/未达标给 teal / amber 描边）。 */
.hub-main .rv2-head>div{position:static;width:auto;height:auto;overflow:visible;clip-path:none;white-space:normal}

.hub-main .rv2-subjects>#rvxCellL,.hub-main .rv2-subjects>#rvxCellR,
.hub-main .rv2-subjects>#rvxCellW,.hub-main .rv2-subjects>#rvxCellS{background:var(--bg);border:1px solid var(--line);border-left:1px solid var(--line);border-radius:10px;padding:10px 12px}
.hub-main .rv2-subjects>#rvxCellL>span,.hub-main .rv2-subjects>#rvxCellR>span,
.hub-main .rv2-subjects>#rvxCellW>span,.hub-main .rv2-subjects>#rvxCellS>span{color:var(--muted)}
.hub-main .rv2-subjects>.rv2-subject>b{font-size:19px;font-weight:800;color:var(--ink)}
.hub-main .rv2-subjects>.rv2-subject>small{display:block;margin-top:0;padding:0;border-radius:0;background:none;font-size:10.5px;color:var(--muted-2)}
.hub-main .rv2-subjects>.rv2-subject.rvx-ok>small,.hub-main .rv2-subjects>.rv2-subject.rvx-weak>small{background:none}
.hub-main .rv2-subjects>.rv2-subject.rvx-ok{border-color:#cde5e1;background:var(--teal-50)}
.hub-main .rv2-subjects>.rv2-subject.rvx-ok>b{color:var(--teal-700)}
.hub-main .rv2-subjects>.rv2-subject.rvx-weak{border-color:#ecd9b6;background:var(--amber-50)}
.hub-main .rv2-subjects>.rv2-subject.rvx-weak>b{color:var(--amber)}
@media(max-width:860px){
  .rv-mobile-tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin-bottom:4px;-webkit-overflow-scrolling:touch}

   按已点头样子稿 design/REVIEW-EMPTY-1-... 1:1 落地）。一套空态两种尺寸：首屏一张大卡

   rve- 前缀，避开既有的 rv2-empty、rv2-chart-empty、rv2-rec-empty、rv-empty 各类名。 */
.rve{text-align:center}
.rve--hero{position:relative;padding:30px 24px 24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;animation:rve-in .45s ease-out both}
.rve--hero::before{content:"";position:absolute;left:50%;top:-120px;width:460px;height:260px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(92,179,171,.13),rgba(92,179,171,0) 70%);pointer-events:none}
.rve-art{position:relative;width:240px;max-width:100%;margin:2px auto 4px}
.rve-art svg{width:100%;height:auto;display:block}
.rve-title{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.rve-desc{max-width:440px;margin:8px auto 0;font-size:12.5px;line-height:1.75;color:var(--muted)}
.rve-btn{margin-top:18px;min-height:38px;padding:0 18px;border:0;border-radius:10px;background:var(--teal);color:#fff;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 6px 16px -8px rgba(58,143,135,.9)}
.rve-btn:hover{background:var(--teal-d)}
.rve-after{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-2)}
.rve-after>span{font-size:11px;color:var(--muted-2)}
.rve-pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--teal-50);color:var(--teal-700);font-size:10.5px;font-weight:700}
.rve-pill i{width:5px;height:5px;border-radius:50%;background:var(--teal);display:inline-block}
.rve--inline{padding:34px 18px}
.rve-ic{width:44px;height:44px;border-radius:13px;background:var(--teal-50);color:var(--teal-700);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;box-shadow:inset 0 0 0 1px rgba(92,179,171,.14)}
.rve-ic svg{width:21px;height:21px}
.rve--inline .rve-title{font-size:13.5px;font-weight:750}
.rve--inline .rve-desc{margin-top:6px;font-size:12px;line-height:1.65;max-width:330px}
.rve--roomy{padding:54px 18px}
.rve--roomy .rve-ic{width:52px;height:52px;border-radius:15px}
.rve--roomy .rve-ic svg{width:24px;height:24px}
.rve--roomy .rve-title{font-size:14.5px}
.rve-foot{margin-top:12px;font-size:11px;color:var(--muted-2)}
.rve-stat .v{color:var(--line)}

@keyframes rve-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rve-breathe{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:.22;transform:scale(1.07)}}
.rve-halo{transform-box:fill-box;transform-origin:center;animation:rve-breathe 3.6s ease-in-out infinite}

/* 空账号时 #rv2Summary 外壳让位给 hero：去掉卡中卡的双边框和 grid 压缩。
   页头那枚「录入成绩」由既有 :has 规则认 rv2-empty 类收掉，功能由 hero 里那枚承担。 */
.hub-main .rv2-summary:has(> .rv2-empty.rve--hero){display:block;background:transparent;border:0;box-shadow:none;padding:0;margin:0}
.hub-main #rv2Summary > .rv2-empty.rve--hero{grid-column:1/-1;padding:30px 24px 24px;color:var(--ink);font-size:inherit}
.hub-main #rv2Summary .rv2-empty.rve--hero h2{margin:0;font-size:17px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
.hub-main #rv2Summary .rv2-empty.rve--hero p{max-width:440px;margin:8px auto 0;font-size:12.5px;line-height:1.75;color:var(--muted)}
@media(max-width:860px){

   design/REVIEW-EMPTY-1-回顾页空态重新设计_样子稿-2026-11-09.html。

<script>
/* REVIEW-EMPTY-1 空态工厂：三个脚本共用，避免在 rv-tabs.js / rvx-data.js / rec-all.js 里各写一份 SVG。
   hero 的按钮必须带 data-rv2-add（rvx-data.js 的 document 级委托靠它打开 #rv2AddDialog）。 */
window.RVE=(function(){
'use strict';
var ICON={
 grid:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

};
var ART='<svg viewBox="0 0 240 132" role="img" aria-label="一条还没开始画的成长曲线">'+
 '<defs><linearGradient id="rveArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cb3ab" stop-opacity=".16"/><stop offset="1" stop-color="#5cb3ab" stop-opacity="0"/></linearGradient></defs>'+
 '<g stroke="#eef1f2" stroke-width="1"><path d="M18 30H222M18 66H222M18 102H222"/><path d="M70 16V112M122 16V112M174 16V112"/></g>'+
 '<path d="M216 16V112" stroke="#cfe6e1" stroke-width="1.4" stroke-dasharray="3 4"/>'+
 '<path d="M18 104 C 70 100 96 84 128 74 S 186 44 216 26 L216 112 L18 112 Z" fill="url(#rveArea)"/>'+
 '<path d="M18 104 C 70 100 96 84 128 74 S 186 44 216 26" fill="none" stroke="#3a8f87" stroke-opacity=".55" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 6"/>'+
 '<g fill="#fff" stroke="#5cb3ab" stroke-opacity=".45" stroke-width="1.6"><circle cx="100" cy="88" r="3.2"/><circle cx="168" cy="56" r="3.2"/></g>'+
 '<circle class="rve-halo" cx="18" cy="104" r="17" fill="#5cb3ab" opacity=".12"/>'+
 '<circle cx="18" cy="104" r="9" fill="#5cb3ab" opacity=".16"/>'+
 '<circle cx="18" cy="104" r="4.6" fill="#3a8f87"/>'+

function inline(o){
 o=o||{};
