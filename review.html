.rv-ruler-goal,.rv-ruler-cur{position:absolute;top:-6px;width:2px;height:22px}
.rv-ruler-goal{background:#c98a2b}
.rv-ruler-cur{background:var(--primary,#5cb3ab);width:3px}
.rv-ruler-ticks{display:flex;justify-content:space-between;margin:8px 2px 0;font-size:10px;color:var(--muted,#9aa1a8)}

.rv-subj-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.rv-subj-n{width:36px;flex:none;font-size:13px;font-weight:600}
.rv-subj-track{position:relative;flex:1;height:10px;border-radius:6px;background:#eef2f2}
.rv-fill{position:absolute;left:0;top:0;height:100%;border-radius:6px;background:var(--primary,#5cb3ab)}
.rv-fill.weak{background:#e0b25a}
.rv-goal{position:absolute;top:-4px;width:2px;height:18px;background:#c98a2b}
.rv-subj-v{width:96px;flex:none;text-align:right;font-size:14px;font-weight:700}
.rv-subj-v small{display:block;font-size:10.5px;font-weight:500;color:var(--muted,#9aa1a8)}
.rv-radar-box svg{width:100%;max-width:320px;display:block;margin:0 auto}
.rv-radar-lab{font-size:12px;fill:#7a8580}
.rv-radar-legend{display:flex;gap:16px;justify-content:center;margin-top:6px;font-size:11.5px;color:var(--muted,#9aa1a8)}
.rv-radar-legend i{display:inline-block;width:14px;height:3px;background:var(--primary,#5cb3ab);vertical-align:middle;margin-right:5px}
.rv-radar-legend i.first{background:#7a8580}
.rv-heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.rv-heat i{height:14px;border-radius:3px;background:#eef2f2}
.rv-heat i.l1{background:#dcefeb}.rv-heat i.l2{background:#b8ded7}.rv-heat i.l3{background:#86c7bd}.rv-heat i.l4{background:var(--primary,#5cb3ab)}

.rv-bar-labels{display:flex;gap:4px;margin-top:4px}
.rv-bar-labels span{flex:1;text-align:center;font-size:9px;color:var(--muted,#9aa1a8)}

.rv-mobile-tabs{display:none}
.rv2-content.rv-one-col{grid-template-columns:minmax(0,1fr)}

}
