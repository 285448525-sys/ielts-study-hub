<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<script>
/* 预览专用：?previewdata=1 注入示例计时记录。只写 8089 本地 origin。 */
(function(){
  if(!/[?&]previewdata=1/.test(location.search)) return;
  var now = new Date();
  function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function hm(h,m){ var d=new Date(now); d.setHours(h,m,0,0); return d.getHours()*3600+d.getMinutes()*60; }
  var data = {
    settings:{ name:'Camille', dailyGoalHours:6, theme:'light' },
    words:[], plans:{items:[]}, mockRecords:[], meds:[],
    sessions:[
      { date: ymd(now), moduleId:'listening', durationSec: 3420, startTs: hm(9,10) },
      { date: ymd(now), moduleId:'vocab', durationSec: 480, startTs: hm(10,32) },
      { date: ymd(now), moduleId:'reading', durationSec: 2100, startTs: hm(11,5) },
      { date: ymd(now), moduleId:'writing', durationSec: 900, startTs: hm(14,20) }
    ]
  };
  try{ localStorage.setItem('ielts_study_hub_v1', JSON.stringify(data)); }catch(e){}
})();
</script>

<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .ui-loader{margin-bottom:8px}
@media (prefers-reduced-motion: reduce){#bootLoader .ui-loader-dot,#bootLoader .ui-loader-shadow{animation:none}#bootLoader .ui-loader-dot{top:20px;height:20px;border-radius:50%;transform:none}#bootLoader .ui-loader-shadow{opacity:.5;transform:scaleX(1)}}
</style>
<style>
/* ===== 10/1 晚 · 计时页 v2 大改版（她拍板「说不上来的丑，直接大更新」）=====
   只动皮不动骨：timer.js 的全部 DOM 钩子（liveTimer/timerGoal/goalMin/modeSeg/
   timerProgress/activeInfo/focusInfo/stopBtn/pauseBtn/timerMods/recMini*/phr*）原样保留。 */
.timer-stage{
  position:relative;max-width:540px;margin:0 auto 8px;padding:32px 32px 30px;
  border-radius:22px;overflow:hidden;text-align:center;
  background:linear-gradient(165deg,var(--primary-50),var(--n-0) 65%);
  border:1px solid var(--primary-100);
}
.timer-stage::before{content:'';position:absolute;inset:0;background:radial-gradient(460px 220px at 50% -70px,rgba(58,154,147,.12),transparent 70%);pointer-events:none}
.ts-status-wrap{text-align:center;margin-bottom:12px;position:relative}
.ts-status{display:inline-block;padding:4px 14px;border-radius:999px;background:var(--primary-soft);color:var(--primary-700);font-size:12.5px;font-weight:600}
.live-timer{position:relative;font-size:clamp(52px,9vw,74px);font-weight:800;letter-spacing:.01em;color:var(--n-900);margin:0 0 4px;font-variant-numeric:tabular-nums;line-height:1.05}
.ts-focus{position:relative;min-height:20px;font-size:13px;color:var(--muted);margin:0 0 12px}
.timer-goal{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px;flex-wrap:wrap}
.timer-goal label{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
.timer-goal input.goal-input{width:64px;height:36px;padding:0 8px;border:none;border-radius:10px;background:var(--primary-soft);color:var(--ink);font:inherit;font-size:14px;text-align:center;outline:none}
.timer-goal input.goal-input:focus{box-shadow:0 0 0 2px var(--primary)}
.seg{display:inline-flex;border:1px solid var(--primary-100);border-radius:10px;overflow:hidden;height:38px;background:var(--surface)}
.seg-btn{font:inherit;font-size:13px;font-weight:700;padding:0 15px;border:none;background:var(--surface);color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg-btn + .seg-btn{border-left:1px solid var(--primary-100)}
.seg-btn.active{background:var(--primary);color:var(--on-primary)}
.seg-btn.active + .seg-btn{border-left-color:transparent}
.timer-progress{position:relative;margin:0 0 16px;text-align:left}
.timer-progress:empty{margin-bottom:0}
.timer-btns{position:relative;display:flex;gap:12px;justify-content:center}
.timer-btns .btn,.timer-btns .ui-dark-btn{
  min-width:148px;min-height:46px;padding:0 26px;border-radius:999px;
  font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
}
.timer-btns .ui-dark-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.timer-btns .ui-dark-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary);transform:none;box-shadow:none}
.timer-btns .btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.timer-btns button:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* 任务选择：连体胶囊 → 独立竖卡（桌面 5 列 / 平板 3 列 / 手机 2 列） */
.timer-mods{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:10px}
.timer-mods .mod-card{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:18px 12px 14px;border-radius:16px;
  background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.timer-mods .mod-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-card-hover);border-color:var(--primary)}
.timer-mods .mod-card.running{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.timer-mods .mod-ic{width:44px;height:44px;border-radius:13px;font-size:20px}
.timer-mods .mod-ic svg{width:22px;height:22px}
.timer-mods .mod-name{font-size:14.5px;font-weight:700}
.timer-mods .timer-start{width:100%;margin:0;padding:7px 0;font-size:13px;border-radius:10px;justify-content:center}
@media(max-width:760px){.timer-mods{grid-template-columns:repeat(3,1fr);gap:10px}}
@media(max-width:480px){
  .timer-mods{grid-template-columns:repeat(2,1fr)}
  .timer-stage{padding:26px 18px 24px}
  .timer-btns .btn,.timer-btns .ui-dark-btn{min-width:0;flex:1;padding:0 18px}
}

/* 今日记录：行卡化 */
.rec-mini{padding:20px 22px;margin-top:30px;border-radius:18px}
.rec-mini-grid{display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
.rec-mini-item{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
.rec-mini-item .rec-mini-dur{font-size:14px}
@media(max-width:480px){.rec-mini{padding:16px 14px}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <section class="card timer-stage">
    <div class="ts-status-wrap"><span class="ts-status" id="activeInfo">当前没有进行中的学习</span></div>
    <div class="live-timer" id="liveTimer">00:00:00</div>
    <div id="focusInfo" class="ts-focus"></div>
    <div id="timerProgress" class="timer-progress"></div>
    <div id="timerGoal" class="timer-goal">
      <label class="muted" for="goalMin">本次目标</label>
      <input id="goalMin" type="number" min="1" inputmode="numeric" placeholder="分钟" class="goal-input">
      <div class="seg" id="modeSeg">
        <button type="button" class="seg-btn active" data-mode="up">正计时</button>
        <button type="button" class="seg-btn" data-mode="down">倒计时</button>
      </div>
    </div>
    <div class="timer-btns">
      <button class="ui-dark-btn ui-dark-btn--sm" id="stopBtn" disabled>结束并保存</button>
      <button class="ui-dark-btn ui-dark-btn--sm" id="pauseBtn" disabled>暂停</button>
    </div>
  </section>

  <p class="section-title">选择本次任务</p>
  <div class="timer-mods" id="timerMods"></div>

  <section class="card rec-mini">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="recTotalMini">0h0m</b></span>
    </div>
    <div class="rec-mini-grid" id="recMiniGrid"></div>
    <p class="rec-empty" id="recEmpty">还没有计时记录。开始一次专注学习吧。</p>
  </section>
</main>

</body>
