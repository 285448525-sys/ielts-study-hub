<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .load-reveal{text-align:center}
#bootLoader .load-reveal>span{font-size:58px;font-weight:800;color:var(--ink,#173a39);display:inline-block;opacity:0;animation:eFade 1.8s cubic-bezier(.2,.7,.2,1) forwards}
#bootLoader .load-reveal>span:nth-child(1){animation-delay:0s}
#bootLoader .load-reveal>span:nth-child(2){animation-delay:.12s}
#bootLoader .load-reveal>span:nth-child(3){animation-delay:.24s}
#bootLoader .load-reveal>span:nth-child(4){animation-delay:.36s}
#bootLoader .load-reveal>span:nth-child(5){animation-delay:.48s}
@keyframes eFade{0%{opacity:0;transform:translateY(14px);filter:blur(6px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
#bootLoader .load-bar{width:180px;height:3px;margin:18px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--primary,#3a9a93),transparent);background-size:55% 100%;background-repeat:no-repeat;animation:eLoad 1.7s cubic-bezier(.4,0,.2,1) infinite}
@keyframes eLoad{0%{background-position:-100px 0}100%{background-position:240px 0}}
#bootLoader .load-sub{margin-top:12px;font-size:12.5px;color:var(--muted,#6b7d7c);letter-spacing:.3em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){#bootLoader .load-reveal>span{animation:none;opacity:1;filter:none}#bootLoader .load-bar{animation:none}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="load-reveal"><span>I</span><span>E</span><span>L</span><span>T</span><span>S</span><div class="load-bar"></div><div class="load-sub">Loading</div></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">计划</h1>

  <!-- 今日计划：日期 + 添加 + 列表 合一 -->
  <section class="card">
    <div class="card-head">
      <h2>今日计划</h2>
      <span class="badge" id="planCount">0 / 0</span>
    </div>
    <div class="form-row" style="align-items:center;margin-bottom:14px">
      <label style="font-size:13px;color:var(--muted);margin:0;white-space:nowrap;flex:none;min-width:0">选择日期</label>
      <input type="date" id="planDate" style="max-width:180px" />
      <span class="muted" id="dateLabel" style="font-size:12px;margin:0;flex:1;min-width:0"></span>
    </div>
    <textarea id="planText"
      placeholder="写下今天的任务…&#10;例如：精听 S1 填空 30 分钟 / 背 20 个阅读生词"
      style="width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;line-height:1.6;background:var(--surface);color:var(--ink);resize:vertical"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
      <button class="btn" id="aiPlan"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7L12 4z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>AI 安排今天</button>
      <button class="btn btn-primary" id="addPlan">添加任务</button>
    </div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <div id="planProgress"></div>
      <div id="planList" style="margin-top:10px"></div>
    </div>
  </section>

  <!-- 计划：自由输入 + AI 智能分配到每天 -->
  <section class="card">
    <h2>计划</h2>
    <textarea id="weekTasks" class="plan-textarea" placeholder="例如：&#10;周一 上午 背完 Word List 5-7，下午 精听 3 段 S3&#10;周二 写 1 篇大作文 + 模考复盘&#10;口语 P2 串题素材过一遍（分两天）"></textarea>
    <div class="plan-actions">
      <div class="plan-actions-right">
        <button class="btn" id="genWeek" style="flex:none">无 AI 也排</button>
        <button class="btn btn-primary" id="aiWeek" style="flex:none"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7L12 4z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>AI 智能分配</button>
      </div>
    </div>
    <div id="weekBox" style="margin-top:16px"></div>
  </section>

  <!-- 历史计划：整模块默认折叠，移到最下面 -->
  <section class="card history-folded">
    <details class="history-wrap" id="historyWrap">
      <summary>
        <div class="history-summary">
          <h2 style="margin:0">历史计划</h2>
          <span class="muted" id="historyMeta">点击展开</span>
        </div>
      </summary>
      <div id="histPlans"></div>
    </details>
  </section>
</main>

</body>
