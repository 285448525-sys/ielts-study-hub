<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<style id="desktopStyle">
/* ===== 10/6 桌面端重设计（她 09:13 报「计划页只适配了手机，电脑端全是空的」）=====

     · plans.html 里 **min-width 断点 = 0 个**，只有 3 个 max-width(420/640/380) → 只做了移动端
     · 今日 Tab：单列一卡 1077px 宽，右侧空出约 450px 高
     · 规划 Tab：dg-hero 1077x406，一条竖排文字占满整行
     · 诊断弹窗：.dg-page{max-width:560px} = 1440 屏的 39%，两侧全空
   手法（铁律：移动端一行都不能动）：
     · 所有规则都关在 @media (min-width:1024px) 里
     · HTML 只加了两个 class（pt-add / pt-list），没改任何 id、没改元素顺序
     · 手机端 .pt-add 用 display:contents —— 包装层不参与布局，渲染结果与改版前完全一致
     · 特异度对齐/超过原规则（表单重置在 common.css:452 有 (0,2,1) 权重，这里一律挂 id 作用域） */

/* 手机端默认：包装层不参与布局（写在媒体查询外，保证 <1024px 零影响） */
#ptabToday .pt-add{display:contents}

@media (min-width:1024px){

  /* ---------- ① 今日 Tab：左「写任务」/ 右「任务清单」 ---------- */
  #ptabToday > .card{

  #ptabToday > .card > .card-head{grid-column:1 / -1;margin-bottom:18px}
  #ptabToday .pt-add{
    display:block;grid-column:1;grid-row:2;

  #ptabToday .plan-item{padding:11px 8px}
  #ptabToday .plan-text{font-size:14.5px}

  /* ---------- ② 规划 Tab：未诊断英雄卡 → 左文案 / 右三步 ---------- */
  #diagRoot .dg-hero{
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);

  }
  #diagRoot .dg-hero-ic{grid-column:1;font-size:44px;margin-bottom:16px}
  #diagRoot .dg-hero h2{grid-column:1;margin:0 0 10px}
  #diagRoot .dg-hero-p{grid-column:1;margin:0 0 22px;max-width:none;line-height:1.8}

  #diagRoot .dg-hero .dg-text-btn{grid-column:1;max-width:320px;text-align:center}
  /* 三步：竖排成三张带序号的卡（原来是一串居中的圆点列表，手机端保持原样） */
  #diagRoot .dg-hero-steps{

  #diagRoot .dg-hero-steps li{

  #diagRoot .dg-hero-steps li::before{

  /* ---------- ②b 规划 Tab：已诊断概览 —— 四科并排 + 头部对齐 ---------- */
  #diagRoot .dg-sum-head{align-items:center}

  #diagRoot .dg-chip{padding:12px 14px}
  #diagRoot .dg-chip-bands{font-size:16px}
  #diagRoot .dg-block-btn,#diagRoot .dg-summary .dg-block-btn{max-width:420px;text-align:center}

  /* ---------- ③ 诊断弹窗：改成「站内标准弹窗」（对齐 .fb-overlay 范式）----------
     🔴 14:09 她 09:5x 截图批「我让你做电脑端适配，但它看起来完全不像电脑端，跟网站别的页面
     完全不是一个风格，就明显看得出来是给手机端设计的」。
     根因（对照 .fb-overlay 量出来的）：站内弹层的标准做法是
       桌面 = 半透明遮罩 rgba(0,0,0,.42) + **居中白卡**（16px 圆角 + 同款阴影），
       手机 = 贴底抽屉（≤860px 才 `align-items:flex-end`）。
     而 #diagOverlay 一直是 `position:fixed;inset:0;background:var(--bg)` —— **两种端都全屏铺满灰底**，
     把侧栏和顶栏全盖住 → 视觉上就成了「另一个 app 的全屏页」。
     第一版我只把它加宽到 980 + 分两栏，宽度治不了「不像站内」这个病根。
     下面按站内范式重做：遮罩 + 居中白卡（宽度对齐 main.container 实测 1105），
     密度也一起对齐站点（卡片 padding 20 / 间距 20 / 小标题 16px / 输入框 38px ——
     44px 是触控标准，那是手机的尺寸，桌面对话框里显得「手机放大版」）。 */
  #diagOverlay{
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;background:rgba(0,0,0,.42);
  }
  #diagOverlay .dg-page{
    width:100%;max-width:1105px;height:min(86vh,900px);min-height:0;
    background:var(--surface);border:1px solid var(--line);border-radius:16px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.4);
    overflow:hidden;
  }
  /* 内部滚动交给 .dg-body（外层 fixed 不再滚）——与 .fb-panel 的 flex 列 + 体内滚同构 */
  #diagOverlay .dg-body{overflow-y:auto;overscroll-behavior:contain;padding:22px 26px 24px}
  #diagOverlay .dg-top{padding:16px 26px;background:var(--surface)}
  #diagOverlay .dg-top strong{font-size:18px;font-weight:800;letter-spacing:-.01em}
  #diagOverlay .dg-foot{padding:14px 26px;background:var(--surface)}
  /* 只有问卷屏（内含 .dg-band-grid）才分两栏；报告屏保持单栏、限宽居中，避免长行难读 */
  #diagOverlay .dg-body:has(.dg-band-grid){
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:16px;align-items:start;padding:22px 26px 28px;
  }
  #diagOverlay .dg-body:has(.dg-band-grid) .dg-warn{grid-column:1 / -1}
  #diagOverlay .dg-body:has(.dg-band-grid) .dg-sec{margin:0}
  /* 分栏方式：①「你现在的水平」内容最多，独占左列并跨两行；②目标 + ③时段 在右列上下排。
     第一版是「①②并排 / ③整行」，实测 ① 高 423px、② 只有 145px，右列下方空出约 280px；
     换成现在这样两列高度 423 vs 511，缺口不到 90px。 */
  #diagOverlay .dg-body:has(.dg-band-grid) .dg-sec:nth-of-type(1){grid-column:1;grid-row:1 / span 2}
  #diagOverlay .dg-body:has(.dg-band-grid) .dg-sec:nth-of-type(2){grid-column:2;grid-row:1}
  #diagOverlay .dg-body:has(.dg-band-grid) .dg-sec:nth-of-type(3){grid-column:2;grid-row:2}
  #diagOverlay .dg-band-grid{grid-template-columns:repeat(2,1fr)}
  #diagOverlay .dg-foot .dg-block-btn{max-width:460px;margin:0 auto;display:block;text-align:center}
  /* 密度对齐站点（.card padding 24 / 间距 24 / h2 18px800 / 输入框 44 是触控尺寸） */
  #diagOverlay .dg-sec{padding:18px 20px;margin:0 0 20px}
  #diagOverlay .dg-sec h3{font-size:16px;font-weight:700;margin:0 0 12px}
  #diagOverlay .dg-hint{font-size:12.5px;margin:0 0 12px}
  #diagOverlay input[type="number"],#diagOverlay select{height:38px;font-size:14px;border-radius:10px}
  #diagOverlay .dg-slot{padding:6px 11px;font-size:12.5px}
  #diagOverlay .dg-band-src{font-size:11.5px}
  /* 报告屏：单栏 + 限宽居中（不跟问卷一起分栏） */
  #diagOverlay .dg-body:not(:has(.dg-band-grid)){max-width:780px;margin:0 auto;width:100%}

  /* ---------- ④ 历史 Tab：日卡两列网格 ---------- */
  #ptabHistory > .card{padding:22px 24px}
  #ptabHistory #histPlans{
    padding:0;display:grid;gap:12px;align-items:start;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  }
  #ptabHistory .hist-plan{margin:0}
  #ptabHistory .hist-plan[open]{grid-column:1 / -1}   /* 展开的那张占满整行，明细不被挤进半栏 */
}

/* 中屏（平板 861–1023px）：只把诊断弹窗适度放宽，其余保持手机版，避免 2 栏被挤扁 */
@media (min-width:861px) and (max-width:1023px){
  #diagOverlay .dg-page{max-width:720px}
}
</style>
