<!-- frame-ancestors 只由 HTTP 响应头下发（CF Pages 根目录 _headers）：按 CSP 规范它写在 meta 里会被浏览器忽略，本页 meta CSP 不再包含该指令 -->

<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">

  <!-- 10/1 她拍板拆三个子 Tab：「今日」= 今天的任务，「规划」= 未来 N 天总体计划 + AI 智能分配，
       「历史」= 历史计划（她 10/1 下午拍板：从两 Tab 外共享位置收进独立 Tab）。
       Tab 名按全站两字口径（练习/题库、学习/词库、拆解/总览），她不满意随时改。 -->
  <div class="page-head-row">
    <div class="pill-tabs" id="planTabs">
      <button data-ptab="today" class="pill-tab active">今日</button>
      <button data-ptab="plan" class="pill-tab">规划</button>
      <button data-ptab="history" class="pill-tab">历史</button>
    </div>
  </div>

  <!-- Tab 1 今日：日期 + 添加 + 列表 合一 -->
  <div class="tab-panel active" id="ptabToday">
  <section class="card">
    <div class="card-head">
      <h2>今日计划</h2>
      <span class="badge" id="planCount">0 / 0</span>
    </div>
    <div class="form-row" style="align-items:center;margin-bottom:14px">
      <label style="font-size:13px;color:var(--muted);margin:0;white-space:nowrap;flex:none;min-width:0">选择日期</label>
      <input type="date" id="planDate" style="max-width:180px" />
      <span class="muted" id="dateLabel" style="font-size:12px;margin:0;flex:1;min-width:0"></span>
    </div>
    <textarea id="planText"
      placeholder="写下今天的任务，如：精听 S1 填空 30 分钟"
      style="width:100%;min-height:64px;padding:10px;border:1px solid var(--line);border-radius:var(--radius-sm);font:inherit;font-size:14px;line-height:1.6;background:var(--surface);color:var(--ink);resize:vertical"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:10px">
      <button class="btn" id="aiPlan"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7L12 4z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>AI 安排今天</button>
      <button class="btn btn-primary" id="addPlan">添加任务</button>
    </div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <div id="planProgress"></div>
      <div id="planList" style="margin-top:10px"></div>
    </div>
  </section>
  </div>

  <!-- Tab 2 规划：自由输入 + AI 智能分配到每天 -->
  <div class="tab-panel" id="ptabPlan">
  <section class="card">
    <h2>计划</h2>
    <textarea id="weekTasks" class="plan-textarea" placeholder="列出任务，AI 帮你排到每天，如：周一背单词 / 周二写作文"></textarea>
    <div class="plan-actions">
      <div class="plan-actions-right">
        <button class="btn" id="genWeek" style="flex:none">无 AI 也排</button>
        <button class="btn btn-primary" id="aiWeek" style="flex:none"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l1.7 4.3L18 10l-4.3 1.7L12 16l-1.7-4.3L6 10l4.3-1.7L12 4z"/><path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>AI 智能分配</button>
      </div>
    </div>
    <div id="weekBox" style="margin-top:16px"></div>
  </section>
  </div>

  <!-- Tab 3 历史：她 10/1 拍板收进独立 Tab。details 壳默认展开（Tab 语义=进来直接看），
       保留整体收起能力与「共 N 天」meta；每天内部的折叠照旧。零新增 CSS。 -->
  <!-- Tab 3 历史：10/1 晚重排（她拍板）——外层 details 折叠壳删掉（太奇怪），头部平铺；
       每天一张独立日卡（日期块+完成度进度条+徽章，点开看当天明细）。 -->
  <div class="tab-panel" id="ptabHistory">
  <section class="card history-folded">
    <div class="history-summary">
      <h2 style="margin:0">历史计划</h2>
      <span class="muted" id="historyMeta">共 0 天</span>
    </div>
    <div id="histPlans"></div>
  </section>
  </div>
</main>
