<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单词 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script src="js/practice.js" defer></script>
  <script src="js/words.js" defer></script>
<style>
  .word-tabs{display:flex;gap:8px;margin-bottom:16px}
  .wtab{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--surface);
        border-radius:12px;font:inherit;font-size:14.5px;font-weight:600;color:var(--muted);
        cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .wtab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
</style>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">单词</h1>
  <p class="page-sub">看词选义记单词，或从词库导入新词。</p>

  <div class="word-tabs">
    <button class="wtab active" data-wtab="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/><path d="M12 20h9"/></svg>学习</button>
    <button class="wtab" data-wtab="bank"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>词库</button>
  </div>

  <div id="studyView" class="study-view-fit">
    <section class="card practice-card practice-card-fit" id="practiceArea">
      <div class="practice-head-row">
        <span class="score-badge" id="practiceScore"></span>
        <div class="head-actions">
          <button class="btn btn-sm" id="cfgGear" title="练习设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
          <button class="btn btn-sm" id="exitPractice">重来</button>
        </div>
      </div>
      <div class="prog-bar-wrap" id="progBarWrap" hidden>
        <div class="prog-bar-track"><div class="prog-bar-fill" id="progBarFill" style="width:0%"></div></div>
      </div>
      <div id="practiceBody" class="practice-body-fit"></div>
      <div class="practice-tools-row" id="practiceTools">
        <button class="btn tool-btn" id="toolSpeaker" title="再读一遍"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></button>
      </div>
    </section>
  </div>

  <div id="bankView" hidden>
    <section class="card">
      <div id="dropZone" class="word-drop-zone">
        <div style="margin-bottom:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:34px;height:34px;vertical-align:-3px" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 20h16"/></svg></div>
        <div style="font-weight:700;font-size:15.5px;color:var(--ink);margin-bottom:6px">
          粘贴或拖入任意内容
        </div>
        <div style="font-size:13px;color:var(--muted);margin-bottom:16px;max-width:400px;margin-left:auto;margin-right:auto">
          单个单词 · 词表 · 整段英文 · 中英文混排 · .txt/.md/.csv 文件<br>
          AI 自动挑出生词并翻译
        </div>
        <textarea id="smartInput"
          style="width:100%;min-height:100px;padding:12px;border:1px solid var(--line);
                 border-radius:var(--radius-sm);font:inherit;font-size:14px;line-height:1.7;
                 background:var(--surface);color:var(--ink);resize:vertical"
          placeholder="在这里粘贴内容，或把文件拖进来…"></textarea>
        <div style="display:flex;justify-content:center;margin-top:14px">
          <button class="btn btn-primary" id="smartImport" style="padding:8px 20px;font-size:14px">
            AI 导入
          </button>
        </div>
      </div>
      <p class="muted" id="importHint" style="margin:10px 0 0;text-align:center"></p>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>
          <h2 style="margin:0">我的词库</h2>
          <p class="muted" style="font-size:12.5px;margin:2px 0 0">共 <span id="wordCount">0</span> 个单词</p>
        </div>
        <button class="btn btn-sm" id="backfillBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>补全释义</button>
      </div>
      <div class="form-row">
        <input id="searchWord" placeholder="搜索单词…" style="flex:1" />
      </div>
      <div id="wordList" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:12px"></div>
    </section>
  </div>

  <!-- 设置弹窗（右上角齿轮触发） -->
  <div id="cfgModal" class="cfg-modal-overlay" hidden>
    <div class="cfg-modal">
      <div class="cfg-modal-head">
        <h3 style="margin:0">设置</h3>
        <button id="cfgClose" class="cfg-modal-close" title="关闭">&times;</button>
      </div>
      <div class="cfg-modal-body">
        <!-- 分组渲染见 js/practice.js renderCfgModal() -->
      </div>
    </div>
  </div>
</main>

</body>
</html>
