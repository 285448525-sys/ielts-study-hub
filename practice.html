<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单词练习 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/prompts.js"></script>
  <script src="js/practice.js" defer></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">单词练习</h1>
  <p class="page-sub">从「我的词库」出题，支持看词选义、听义选义、默写听读音和闪卡。</p>

  <section class="card" id="modeSelect">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <h2 style="margin:0">选择练习模式</h2>
      <button class="btn btn-sm" id="cfgGear" title="练习设置">⚙️</button>
    </div>
    <p class="muted" style="font-size:13px;margin-bottom:12px">从你的词库出题，支持 4 种练习方式</p>
    <div class="grid" style="margin-top:12px;grid-template-columns:repeat(2,1fr)">
      <button class="btn mod-card" data-mode="flashcard">
        <div class="mod-icon">🔁</div>
        <div class="mod-body">
          <div class="mod-title">复习单词</div>
          <div class="mod-desc">按记忆曲线自动排程</div>
        </div>
      </button>
      <button class="btn mod-card" data-mode="seeWord">
        <div class="mod-icon" style="background:var(--primary-soft)">👁</div>
        <div class="mod-body">
          <div class="mod-title">看词选义</div>
          <div class="mod-desc">看英文选释义 · 自动下一题</div>
        </div>
      </button>
      <button class="btn mod-card" data-mode="hearMeaning">
        <div class="mod-icon" style="background:var(--med-soft)">👂</div>
        <div class="mod-body">
          <div class="mod-title">听音选义</div>
          <div class="mod-desc">听发音选中文释义 · 自动下一题</div>
        </div>
      </button>
      <button class="btn mod-card" data-mode="dictation">
        <div class="mod-icon" style="background:var(--warn-soft)">✍️</div>
        <div class="mod-body">
          <div class="mod-title">单词听写</div>
          <div class="mod-desc">爱听写风格 · 逐字母批改</div>
        </div>
      </button>
    </div>
    <p class="muted" style="margin-top:10px">想练<strong>句子听写</strong>（整句听音默写）？去 <a href="corpus.html">听力语料库</a> 页批量导入句子后开始听写。</p>
  </section>

  <section class="card practice-card" id="practiceArea" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="score-badge" id="practiceScore"></span>
      <button class="btn btn-sm" id="exitPractice">退出练习</button>
    </div>
    <div class="prog-bar-wrap" id="progBarWrap" hidden>
      <div class="prog-bar-track"><div class="prog-bar-fill" id="progBarFill" style="width:0%"></div></div>
    </div>
    <div id="practiceBody"></div>
    <div style="margin-top:20px">
      <button class="btn btn-primary" id="nextBtn" hidden>下一题</button>
    </div>
  </section>

  <!-- 设置弹窗（右上角齿轮触发） -->
  <div id="cfgModal" class="cfg-modal-overlay" hidden>
    <div class="cfg-modal">
      <div class="cfg-modal-head">
        <h3 style="margin:0">设置</h3>
        <button id="cfgClose" class="cfg-modal-close" title="关闭">&times;</button>
      </div>
      <div class="cfg-modal-body">
        <!-- 分组渲染见 js/practice.js renderCfgModal() -->
      </div>
    </div>
  </div>
</main>

</body>
</html>
