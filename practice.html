<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单词练习 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/practice.js" defer></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">单词练习</h1>
  <p class="page-sub">从「我的词库」出题，支持看词选义、听义选义、默写听读音、闪卡和语料库。</p>

  <section class="card" id="practiceCfg">
    <div class="cfg-head" id="cfgToggle">
      <h2 style="margin:0">⚙️ 练习设置</h2>
      <span class="cfg-chev" id="cfgChev">▾</span>
    </div>
    <div class="cfg-body" id="cfgBody">
      <div class="cfg-grid">
        <div class="cfg-item">
          <label>语速</label>
          <div class="cfg-ctrl">
            <input type="range" id="pcRate" min="0.5" max="1.3" step="0.05" value="0.9" />
            <span id="pcRateTxt" class="cfg-val">0.90x</span>
          </div>
        </div>
        <div class="cfg-item">
          <label>朗读次数</label>
          <div class="cfg-ctrl">
            <input type="range" id="pcRepeat" min="1" max="5" step="1" value="1" />
            <span id="pcRepeatTxt" class="cfg-val">1 次</span>
          </div>
        </div>
        <div class="cfg-item">
          <label>朗读间隔</label>
          <div class="cfg-ctrl">
            <select id="pcInterval">
              <option value="800">0.8s</option>
              <option value="1200">1.2s</option>
              <option value="1800" selected>1.8s</option>
              <option value="2400">2.4s</option>
              <option value="3200">3.2s</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>题量</label>
          <div class="cfg-ctrl">
            <select id="pcBatch">
              <option value="5">5 题</option>
              <option value="10">10 题</option>
              <option value="20">20 题</option>
              <option value="-1" selected>全部</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>选项数量</label>
          <div class="cfg-ctrl">
            <select id="pcOptCount">
              <option value="4" selected>4 个</option>
              <option value="6">6 个</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>出题顺序</label>
          <div class="cfg-ctrl">
            <select id="pcShuffle">
              <option value="1" selected>随机乱序</option>
              <option value="0">按词库顺序</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>答对自动下一题</label>
          <div class="cfg-ctrl">
            <select id="pcAutoNext">
              <option value="1" selected>开启</option>
              <option value="0">关闭（手动点）</option>
            </select>
          </div>
        </div>
        <div class="cfg-item" id="autoNextDelayWrap">
          <label>自动下一题延迟</label>
          <div class="cfg-ctrl">
            <select id="pcAutoDelay">
              <option value="400">0.4s</option>
              <option value="800" selected>0.8s</option>
              <option value="1500">1.5s</option>
              <option value="2500">2.5s</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>自动播放下题读音</label>
          <div class="cfg-ctrl">
            <select id="pcAutoPlay">
              <option value="1" selected>开启</option>
              <option value="0">关闭</option>
            </select>
          </div>
        </div>
        <div class="cfg-item cfg-item-dict">
          <label>大小写敏感（听写）</label>
          <div class="cfg-ctrl">
            <select id="pcCase">
              <option value="0" selected>不敏感</option>
              <option value="1">敏感</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>显示释义提示</label>
          <div class="cfg-ctrl">
            <select id="pcShowCn">
              <option value="0" selected>不显示</option>
              <option value="1">显示</option>
            </select>
          </div>
        </div>
        <div class="cfg-item">
          <label>显示英文原词</label>
          <div class="cfg-ctrl">
            <select id="pcShowEn">
              <option value="0" selected>不显示</option>
              <option value="1">答错时显示</option>
              <option value="2">始终显示</option>
            </select>
          </div>
        </div>
      </div>
      <p class="muted" style="font-size:12px;margin:10px 0 0">设置会自动保存。听写模式默认朗读 3 次，可在上方单独调整；选择题默认朗读 1 次。</p>
    </div>
  </section>

  <section class="card" id="modeSelect">
    <h2>选择练习模式</h2>
    <div class="grid" style="margin-top:12px">
      <button class="btn mod-card" data-mode="flashcard" style="text-align:left">
        <div class="mod-title">🔁 复习单词</div>
        <div class="muted">按记忆曲线自动排程，先列出今日待复习词</div>
      </button>
      <button class="btn mod-card" data-mode="seeWord" style="text-align:left">
        <div class="mod-title">👁 阅读词汇·看词选义</div>
        <div class="muted">看英文，选正确释义；答对自动进入下一题</div>
      </button>
      <button class="btn mod-card" data-mode="hearMeaning" style="text-align:left">
        <div class="mod-title">👂 听力词汇·听音选义</div>
        <div class="muted">听英文发音，选中文释义；答对自动进入下一题</div>
      </button>
      <button class="btn mod-card" data-mode="dictation" style="text-align:left">
        <div class="mod-title">✍️ 单词听写（爱听写风格）</div>
        <div class="muted">可调语速/次数/间隔/题量；逐字母批改、错词归集、答对自动下一题</div>
      </button>
      <button class="btn mod-card" data-mode="corpus" style="text-align:left">
        <div class="mod-title">📋 听力词汇语料库</div>
        <div class="muted">浏览全部单词列表</div>
      </button>
    </div>
    <p class="muted" style="margin-top:10px">想练<strong>句子听写</strong>（整句听音默写）？去 <a href="corpus.html">听力语料库</a> 页批量导入句子后开始听写。</p>
  </section>

  <section class="card practice-card" id="practiceArea" hidden>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <span class="score-badge" id="practiceScore"></span>
      <button class="btn btn-sm" id="exitPractice">退出练习</button>
    </div>
    <div class="prog-bar-wrap" id="progBarWrap" hidden>
      <div class="prog-bar-track"><div class="prog-bar-fill" id="progBarFill" style="width:0%"></div></div>
    </div>
    <div id="practiceBody"></div>
    <div style="margin-top:20px">
      <button class="btn btn-primary" id="nextBtn" hidden>下一题</button>
    </div>
  </section>
</main>

</body>
</html>
