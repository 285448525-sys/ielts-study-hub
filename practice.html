<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<style>
/* ============================================================
   10/3 A 版「今日复习卡 + 学习状态分组」（她选的 A 版）
   参考：墨墨「当日记忆曲线，红色段=优先复习」·扇贝「每日任务量+复习比例」
   —— 全部色值走站内 token，禁硬编码
   —— 数据全部来自现有字段（wordIntervalDesc / errTotal / level / wbTodayWrongEns），零新增存储
   ============================================================ */

/* ---------- 今日复习卡 ---------- */
/* 10-23 修深色：--primary-700 在深色主题下被提亮成 #7ccac2 → 渐变左端几乎变成浅薄荷绿，
   压在上面的白字对比只剩约 2:1，卡顶部糊成一片。
   深色下改用 800→900（两档深色主题块没有重定义，继承浅色深值，是真正的深绿底 + 白字，
   与深色版 .hero 的写法一致）。浅色主题完全不变。 */
.wb-today{background:linear-gradient(135deg,var(--primary-700),var(--primary-900));border-radius:var(--radius);
  padding:15px 17px;margin:0 0 12px;box-shadow:0 4px 16px rgba(44,120,115,.26);color:#fff}
html[data-theme="dark"] .wb-today{background:linear-gradient(135deg,var(--primary-800),var(--primary-900))}
.wb-today-top{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.wb-today-ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);
  display:flex;align-items:center;justify-content:center;flex:none}
.wb-today-ic svg{width:20px;height:20px}
.wb-today-tx{flex:1;min-width:0}
.wb-today-tx b{display:block;font-size:15.5px;font-weight:700;line-height:1.3}
.wb-today-tx span{display:block;font-size:11.5px;opacity:.78;margin-top:2px}
.wb-today-go{flex:none;height:38px;padding:0 20px;border:none;border-radius:999px;background:#fff;
  color:var(--primary-800);font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.wb-today-go:hover{background:var(--primary-50)}
/* 10-23 T-018 她：「好几个绿色的框不好看」→ 四块各自染底 → 一条分隔线分四栏。
   依据 design\_mock-背词页统计条-2026-10-23.html「方案 A」。
   为什么采 A 不采 B：B 把「答错待巩固」压成右侧小行，而那是她每天最该看的数（决定要不要重刷）。 */
.wb-today-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.14);padding-top:14px;gap:0}
.wb-tcell{position:relative;padding:0 16px;background:none;border-radius:0}
.wb-tcell:first-child{padding-left:0}
.wb-tcell + .wb-tcell{border-left:1px solid rgba(255,255,255,.14)}
.wb-tcell em.wb-tdot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:1px}
.wb-tdot-grey{background:rgba(255,255,255,.4)}
.wb-tdot-mint{background:#8fe3d8}
.wb-tdot-amber{background:#ffc978}
.wb-tdot-plain{background:rgba(255,255,255,.7)}
.wb-tcell span{display:inline;font-size:11.5px;font-weight:600;color:rgba(255,255,255,.68);letter-spacing:.01em}
.wb-tcell b{display:block;margin-top:4px;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff}
/* 计数为 0 时压暗，一眼看出「今天还没开始」 */
.wb-tcell b.is-zero{opacity:.55}
@media (max-width:560px){
  /* 2×2 时竖线要跟着重排，否则第三条会顶到第二行开头 */
  .wb-today-grid{grid-template-columns:repeat(2,1fr);row-gap:14px}
  .wb-tcell{padding:0 12px}
  .wb-tcell:nth-child(odd){padding-left:0;border-left:0}
  .wb-tcell:nth-child(3),.wb-tcell:nth-child(4){border-top:1px solid rgba(255,255,255,.14);padding-top:12px}
  .wb-today-top{flex-wrap:wrap}
  .wb-today-go{width:100%;height:44px}
}

/* ---------- 掌握进度（放大版：从5px 条 + 12px 小字 → 11px 条 + 图例 + 百分比） ---------- */
.wl-stats.amp{display:block}
.wl-stats.amp .wl-stats-bar{height:11px;border-radius:6px;display:flex}
.wl-stats.amp .wl-stats-seg{height:100%}
.wl-stats.amp .wl-stats-seg.s-ok{background:linear-gradient(90deg,#34c759,#1a7f45)}
.wl-stats.amp .wl-stats-seg.s-mid{background:linear-gradient(90deg,var(--primary-300),var(--primary-500))}
.wl-stats.amp .wl-stats-seg.s-new{background:var(--line)}
.wb-mastery{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 17px;margin:0 0 12px;box-shadow:var(--shadow)}
.wb-mlegend{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.wb-ml{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.wb-ml i{width:9px;height:9px;border-radius:3px;flex:none}
.wb-ml b{color:var(--ink);font-weight:700}
.wb-ml .pct{color:var(--muted);font-size:11.5px}

/* ---------- AI 导入折叠条（从常驻 132px 卡 → 44px 条） ---------- */
.wl-imp-card{padding:0;overflow:hidden}
.wl-imp-bar{display:flex;align-items:center;gap:9px;width:100%;padding:10px 14px;
  background:transparent;border:0;cursor:pointer;font-family:inherit;text-align:left}
.wl-imp-bar:hover{background:var(--n-50)}
.wl-imp-ic{width:24px;height:24px;border-radius:7px;background:var(--primary-50);color:var(--primary-700);
  display:flex;align-items:center;justify-content:center;flex:none}
.wl-imp-ic svg{width:14px;height:14px}
.wl-imp-tx{flex:1;min-width:0;font-size:12.5px;color:var(--ink-2)}
.wl-imp-tx b{color:var(--ink)}
.wl-imp-caret{color:var(--muted);font-size:10px;transition:transform .15s;flex:none}
.wl-imp-card.open .wl-imp-caret{transform:rotate(90deg)}
.wl-imp-body{padding:0 14px 12px}

/* ---------- 学习状态分组（今日要复习 / 答错过 / 学习中 / 已掌握 / 词组） ---------- */
.wb-groups{margin:0 0 8px}
.wb-grp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);margin:0 0 10px;overflow:hidden}
.wb-grp-head{display:flex;align-items:center;gap:8px;padding:11px 15px;background:var(--n-50);
  border-bottom:1px solid var(--line);cursor:pointer;user-select:none;list-style:none;transition:background .15s}
.wb-grp-head::-webkit-details-marker{display:none}
.wb-grp-head:hover{background:var(--n-100)}
.wb-grp-caret{color:var(--muted);font-size:9px;transition:transform .15s;flex:none}
.wb-grp[open] > .wb-grp-head .wb-grp-caret{transform:rotate(90deg)}
.wb-grp-ic{width:15px;height:15px;flex:none;color:var(--primary-500)}
.wb-grp-head b{font-size:13px;font-weight:700;color:var(--ink)}
.wb-grp-n{font-size:11.5px;color:var(--muted);font-weight:600}
.wb-grp-desc{font-size:11.5px;color:var(--muted);margin-left:auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wb-grp-body{padding:0}
.wb-grp-empty{padding:12px 15px;font-size:12.5px;color:var(--muted)}

/* 词条横向布局：勾选 + 单词（定宽）+ 释义（占满）+ 标签组 + 删除 */
.wl-list{list-style:none;margin:0;padding:0}
.wl-item.row{display:flex;align-items:center;gap:11px;padding:9px 15px;border-bottom:1px solid var(--n-50);
  transition:background .15s}
.wl-item.row:last-child{border-bottom:0}
.wl-item.row:hover{background:var(--primary-50)}
.wl-item.row .wl-check{flex:none}
.wl-item.row .wl-word{flex:none;min-width:132px;font-size:15px;font-weight:600}
.wl-item.row .wl-senses{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl-item.row .wl-sense-pos{color:var(--vocab,#5b6bbf);font-weight:600;margin-right:5px}
.wl-item.row .wl-tags{flex:none;display:flex;align-items:center;gap:6px}
.wl-item.row .wl-del{flex:none}
.wl-tg{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--n-100);color:var(--ink-2)}
.wl-tg.done{background:var(--ok-soft,rgba(52,199,89,.12));color:var(--ok-text,#1a7f45)}
.wl-tg.err{background:var(--err-bg);color:var(--danger-text)}
.wl-tg.lv{background:var(--vocab-bg,rgba(91,107,191,.10));color:#3f4d9e}
.wl-tg.due{background:var(--warn-soft);color:var(--warn-ink)}
.wl-tg.over{background:var(--err-bg);color:var(--danger-text)}
.wb-grp-toggle-all{background:none;border:0;color:var(--primary-700);font-family:inherit;font-size:11.5px;
  font-weight:600;cursor:pointer;padding:0 0 0 8px;white-space:nowrap}
.wb-grp-toggle-all:hover{color:var(--primary-900);text-decoration:underline}
@media (max-width:560px){
  .wb-grp-desc{display:none}
  /* 🔴 10/6 02:20 移动端词条改**两行**：第一行 = 勾选 + 英文 + 词性/中文 + 删除；第二行 = 状态标签。
     旧版五个元素硬挤一行：.wl-tags 是 flex:none（线上实测 182px：「今天 · 半衰期 1 天」+「错 2」+「Lv 0」），
     把 flex:1 的 .wl-senses 挤成 **0px** → 中文释义一个字都看不见（她原话：等级和已过期把中文字全盖掉了）。
     优先级必须是「英文 + 词性 + 中文」> 状态标签，所以让标签整组下沉一行；释义改允许换行（最多 2 行）。 */
  .wl-item.row{flex-wrap:wrap;align-items:flex-start;row-gap:5px;padding:10px 15px}
  .wl-item.row .wl-check{flex:none;margin-top:3px}
  /* ⚠️ 必须连 width 一起覆盖：css/common.css:922 的 .wl-word 有 `width:22%`，
     22% × 306px 行宽 = 67px —— 只改 flex 不改 width，词照样被砍成「internat…」。
     （实测踩过：词宽 67px / 需要 136px，而 flex 已是 0 0 auto 且不缩。）
     宽度优先级：英文完整 > 中文可读（中文给死 min-width:64px 的下限，不会再被挤没）。 */
  .wl-item.row .wl-word{flex:0 0 auto;width:auto;min-width:0;max-width:55%;font-size:14.5px}
  .wl-item.row .wl-senses{flex:1 1 64px;min-width:64px;white-space:normal;overflow:hidden;
    display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-height:1.4;font-size:12.5px}
  .wl-item.row .wl-del{flex:none;margin-top:1px}
  .wl-item.row .wl-tags{order:9;flex:1 1 100%;margin-left:29px;flex-wrap:wrap;row-gap:4px}
}

/* ---------- 10/4 改版：词库卡头部改上下堆叠 ----------
   她 12:57 反馈：「复习计划」「AI 补全」文字被竖排挤成两列。
   根因 = 头部是左右两栏横排，左侧统计把右侧按钮挤到极窄，中文可逐字断行。
   改法 = 窄屏改为上下：标题与统计在上、按钮整行铺满在下（不靠补丁硬撑宽度）。 */
.wl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.wl-head-main{flex:1 1 auto;min-width:0}
.wl-head-btns{display:flex;gap:8px;flex:none;align-items:center}
.wl-imp-more{color:var(--muted)}
@media (max-width:640px){
  .wl-head{flex-direction:column;align-items:stretch;gap:14px}
  .wl-head-btns{width:100%}
  .wl-head-btns .btn{flex:1 1 0;min-width:0;white-space:nowrap;justify-content:center}
  /* 更透气：导入条只留一句短话（格式说明展开后仍可见），图例与进度条拉开 */
  .wl-imp-more{display:none}
  .wl-imp-bar{padding:12px 14px}
  .wb-mlegend{gap:12px 16px}
  .wl-stats.amp .wl-stats-bar{height:12px}
}

/* 10-22 第 4 批换顶栏：全屏沉浸背单词（body.word-fullscreen）原本就藏掉整条导航与页头，
   顶栏壳要跟着收掉；否则 44px 顶栏压在背词区上方，body 的 44px 让位还白留一条空带 */

body.word-fullscreen .hub-topbar{display:none !important}

      <div class="word-tools-row" id="wordToolsRow" hidden>
        <button class="btn btn-sm icon-square-btn" id="cfgGear" title="练习设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg></button>
        <button class="btn btn-sm icon-square-btn" id="fullscreenBtn" title="全屏沉浸式背单词"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
      </div>
      <div id="practiceBody" class="practice-body-fit"></div>
      <div class="practice-tools-row" id="practiceTools">
        <button class="btn tool-btn" id="toolSpeaker" title="再读一遍"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></button>
      </div>
    </section>
  </div>

  <div id="bankView" hidden>
    <!-- design/78：词库切换分段条（我的词库 / 学术阅读 AWL），wbRenderSwitchers 渲染。
         10-23 4-3：词书网格（#wbDeckGrid）取代了它的展示职责 —— 这个容器与 id 保留不动
         （js/wordbank.js 的 wbSetActive 内部会调 wbRenderSwitchers 往这里写），只是不再显示。 -->
    <div id="wbSwitcher" hidden></div>
    <!-- 10/3 A 版「今日复习卡」：借鉴墨墨「当日记忆曲线，优先复习哪一段」+ 扇贝「每日任务量」。
         **数据全部来自现有字段**（wordIntervalDesc 的 next/overdue + errTotal + level + wbTodayWrongEns），
         **零新增存储**。官方词包（只读、无学习进度）不渲染这张卡。 -->
    <section class="wb-today" id="wbTodayCard" hidden>
      <div class="wb-today-top">
        <span class="wb-today-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/></svg></span>
        <span class="wb-today-tx">
          <b id="wbTodayTitle">今天要复习 0 个词</b>
          <!-- 10-23 4-2：默认空着（「正在算」只在真算的时候由 scripts 写进来），
               避免没有词库时这张卡一闪而过「正在算…」这种假加载。 -->
          <span id="wbTodaySub"></span>
        </span>
        <button class="wb-today-go" id="wbTodayGo" type="button">开始复习</button>
      </div>
      <div class="wb-today-grid">
        <div class="wb-tcell"><em class="wb-tdot wb-tdot-grey"></em><span>已过期</span><b id="wbNOverdue">0</b></div>
        <div class="wb-tcell"><em class="wb-tdot wb-tdot-mint"></em><span>新高频</span><b id="wbNNew">0</b></div>
        <div class="wb-tcell"><em class="wb-tdot wb-tdot-amber"></em><span>答错待巩固</span><b id="wbNWrong">0</b></div>
        <div class="wb-tcell"><em class="wb-tdot wb-tdot-plain"></em><span>今日已学</span><b id="wbNLearned">0</b></div>
      </div>
    </section>

    <!-- ===== 10-23 4-3 词书库（版一：词书卡片网格）=====
         她 10-5x 拍板：「我是想着后续要多加很多词书进去，所以现在这样两个栏切换完全不行」。
         结构 = 一行标题（N 本 · 共 M 词）+ 卡片网格，末尾一张「+ 添加词书」虚线卡。
         🔴 加新词书 = 网格里多一张卡，结构永远不变（这是本方案唯一命门）。
         数据全部来自现有字段（每本书的 words / 进度 / 待复习数本来就在算），零新增存储。 -->
    <section class="wb-lib" id="wbDeckGrid">
      <div class="wb-lib-head">
        <b id="wbLibTitle">我的词书</b>
        <span id="wbLibSub"></span>
      </div>
      <div class="wb-decks" id="wbDecks"></div>
    </section>

    <!-- 10/3 A 版：AI 导入从常驻 132px 卡收成 44px 折叠条（偶尔用的功能不该占首屏 C 位）。
         **所有 id 一律保留**（dropZone/smartInput/smartImport/importHint），导入逻辑零改动。 -->
    <section class="card wl-imp-card" id="bankImportCard">
      <button type="button" class="wl-imp-bar" id="wlImpBar" aria-expanded="false" aria-controls="wlImpBody">
        <span class="wl-imp-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span class="wl-imp-tx"><b>批量导入单词</b><span class="wl-imp-more"> · 粘贴文本或拖入文件（.txt .md .csv .xlsx）</span></span>
        <span class="wl-imp-caret" aria-hidden="true">▶</span>
      </button>
      <div class="wl-imp-body" id="wlImpBody" hidden>
        <div id="dropZone" class="wl-import">
          <textarea id="smartInput" class="wl-import-hint" placeholder="粘贴内容或拖入文件… 支持单词/列表/整段英文/.txt .md .csv .xlsx"></textarea>
          <button class="btn btn-primary" id="smartImport">AI 导入</button>
        </div>
        <!-- 🔴 10/20 深夜（她拍板）：这里原本有「AI 补全」按钮，已删除。
             她的原话：「我其实想把 AI 补全这个按钮去掉，你还给我又加一个按钮，我希望这个功能导入的时候就是完全体」。
             ⇒ 词库整理（重复词合并 / 释义清洗 / 词组词性归一）全部改为**进页面自动静默跑一遍**
             （见 js/words.js 的 autoTidyWords），不再提供任何手动按钮；导入走 AI 两阶段，落库即完全体。 -->
        <p class="muted" id="importHint" style="margin:8px 0 0"></p>
      </div>
    </section>

    <section class="card">
      <!-- 10-23 4-4 进书视图：面包屑「词书库 › 书名」，点「词书库」回上面的卡片网格。
           原来这是个整页列表，现在它是「某一本书的里面」，所以必须先告诉人自己在哪、怎么退出去。 -->
      <nav class="wb-crumb" id="wbCrumb" aria-label="位置">
        <button type="button" class="wb-crumb-a" id="wbCrumbBack">词书库</button>
        <span class="wb-crumb-sep" aria-hidden="true">›</span>
        <span class="wb-crumb-cur" id="wbCrumbCur">我的词库</span>
      </nav>
      <div class="wl-head">
        <div class="wl-head-main">
          <h2 style="margin:0" id="bankTitle">我的词库</h2>
          <p class="muted" style="font-size:12.5px;margin:2px 0 0">共 <span id="wordCount">0</span> 个单词</p>
          <!-- design/78：官方词库副标题（meta.desc，一行小字，title 收 meta.source） -->
          <p class="muted" id="bankSub" hidden style="font-size:12px;margin:2px 0 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(560px,60vw)"></p>
          <div class="wl-stats" id="bankStats"></div>
        </div>
        <div class="wl-head-btns" id="bankCustomBtns">
          <button class="btn btn-sm" id="bankPlanBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.8v3.4M16 2.8v3.4"/></svg>复习计划</button>
          <!-- 🔴 10/20 深夜：原「AI 补全」按钮已按她要求删除（理由见上方 #bankImportCard 注释）。
               补全能力没有丢——它下沉进了「导入时自动执行」和「进页面自动整理」两条自动路径。 -->
        </div>
        <!-- design/78：官方词库视图按钮组（custom 视图隐藏） -->
        <div class="wl-head-btns" id="bankOfficialBtns" hidden>
          <button class="btn btn-sm btn-primary" id="officialStartBtn">开始学习</button>
          <button class="btn btn-sm" id="officialResetBtn">重置进度</button>
        </div>
      </div>
      <div class="plan-panel" id="planPanel" hidden></div>
      <div class="wl-search-wrap">
        <input aria-label="搜索单词" id="searchWord" class="wl-search" placeholder="搜索单词…" />
      </div>
      <!-- 10-23 4-4：原来这里是「类型 / 错误」两个大分类按钮，点开再展小分类（两层）。
           现在压成一行状态胶囊，点哪个筛哪批。原来那套（#wordCats / #catPanel-* / #filterType / #filterErr）
           **一个 id 都没删，只是不再显示** —— words.js 里仍会往它们写值，全站导入/批量操作也照旧。 -->
      <div class="wb-chips" id="wbStatusChips"></div>
      <div class="wl-cats-row" id="wordCats" hidden>
        <button class="wl-cat-btn" data-cat="type" type="button">类型<svg class="wl-cat-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
        <button class="wl-cat-btn" data-cat="err" type="button">错误<svg class="wl-cat-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      </div>
      <div class="wl-cat-panel" id="catPanel-type" hidden>
        <div class="wl-filter-chips" id="filterType">
          <button class="chip active" data-type="all">全部</button>
          <button class="chip" data-type="word">单词</button>
          <button class="chip" data-type="phrase">词组</button>
        </div>
      </div>
      <div class="wl-cat-panel" id="catPanel-err" hidden>
        <div class="wl-filter-chips" id="filterErr"></div>
      </div>
      <!-- 勾选词后的批量操作条（勾选 >0 时出现） -->
      <div class="wl-action-bar" id="bankActionBar" hidden>
        <span class="wl-action-hint">已选 <b id="bankCheckedN">0</b> 个词</span>
        <button class="btn btn-primary btn-sm" id="bankPracticeBtn">开始选词义练习</button>
        <button class="btn btn-sm" id="bankClearBtn">取消选择</button>
      </div>
      <div id="wordList" class="wl-list"></div>
    </section>
  </div>

  <!-- 设置弹窗（右上角齿轮触发） -->
  <div id="cfgModal" class="cfg-modal-overlay" hidden>
    <div class="cfg-modal">
      <div class="cfg-modal-head">
        <h3 style="margin:0">设置</h3>
        <button id="cfgClose" class="cfg-modal-close" title="关闭">&times;</button>
      </div>
      <div class="cfg-modal-body">
        <!-- 分组渲染见 js/practice.js renderCfgModal() -->
      </div>
    </div>
  </div>
</main>

</body>
</html>
