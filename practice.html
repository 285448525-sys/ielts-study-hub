<meta http-equiv="Expires" content="0" />
<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

        </div>
      </div>
      <div class="prog-bar-wrap" id="progBarWrap" hidden>

      </div>

      <div class="practice-tools-row" id="practiceTools">

      </div>
    </section>
  </div>

  <div id="bankView" hidden>
    <section class="card">
      <div id="dropZone" class="wl-import">
        <textarea id="smartInput" class="wl-import-hint" placeholder="粘贴内容或拖入文件… 支持单词/列表/整段英文/.txt .md .csv"></textarea>
        <button class="btn btn-primary" id="smartImport">AI 导入</button>
      </div>
      <p class="muted" id="importHint" style="margin:8px 0 0"></p>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div>

          <p class="muted" style="font-size:12.5px;margin:2px 0 0">共 <span id="wordCount">0</span> 个单词</p>
        </div>
        <button class="btn btn-sm" id="backfillBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>AI 补全</button>
      </div>
      <div class="wl-search-wrap">
        <input id="searchWord" class="wl-search" placeholder="搜索单词…" />

          <span class="wl-filter-label">等级</span>

        </div>
      </div>
      <ul id="wordList" class="wl-list"></ul>
    </section>
  </div>

  <!-- 设置弹窗（右上角齿轮触发） -->
  <div id="cfgModal" class="cfg-modal-overlay" hidden>
