       这一屏把该组的模块全列成卡，点卡进原页面 —— 原页面零改动。 -->
  <div id="hubGroupRoot">
    <div class="empty">加载中…</div>

<!-- 10/5 15:04 组页提速：hubgroup.js 是自包含的（实测零引用 common.js 的任何符号），
     所以 data.js(120K) + common.js(275K) 改为**动态加载**，让卡片先渲染出来。
     病根：之前三个都是 defer 并行下载执行，而 initBootLoader(common.js) 与 hubgroup 的 boot()
     在同一个 DOMContentLoaded 上抢跑 —— 慢的那次就把转圈遮罩留在屏幕上（实测 study/plans-hub 遮罩残留），
     卡片其实早渲染好了、只是被盖住，看起来像「加载半天」。
     修法：先渲染卡片（立刻可见、可点）→ 再异步补 common.js（导航/dock/主题/SW 随后到位）。 -->
<script>
  /* 10/5 15:10 组页自收启动遮罩 —— ⭐ 这是本批第二个真病根。
     #bootLoader 是**内联在 HTML 里**的（首字节即渲染，防硬刷新白屏），
     而唯一收起它的 initBootLoader() 住在 common.js 里。
     我把 common.js 改成延后加载后 → **没人收遮罩了**，卡片被转圈盖住，
     用户看到的仍是「一直转圈」（探针 6 条 FAIL 就是这个）。
     修法：组页自己内联一份收起逻辑（两帧 rAF 后撤 + 8s 兜底），不依赖 common.js 时机。 */
  (function(){
    function fin(){
      var el=document.getElementById('bootLoader');
      if(!el||el.dataset.done) return;
      el.dataset.done='1'; el.classList.add('hide');
      setTimeout(function(){ if(el&&el.parentNode) el.parentNode.removeChild(el); }, 400);
    }
    window.__hubBootDone = fin;   // common.js 到位后若再调也能用
    var raf=window.requestAnimationFrame||function(cb){setTimeout(cb,16);};
    raf(function(){ raf(fin); });
    setTimeout(fin, 8000);        // 兜底：绝不卡死在遮罩上
  })();
</script>
<script defer src="js/hubgroup.js?v=20261006a"></script>
<!-- 🔴 10/5 15:40 加载顺序契约 —— ⚠️ 三个 defer 的顺序**不可改、不可改成动态加载**！
     hubgroup.js 的渲染门控（boot()）等两个条件：
       A. common.js 已就绪（PAGES 这个顶层 const 可用）
       B. hostGroup() 认得出当前组（靠 body[data-hub-group] 或 _hubCurrentFile）
     我 15:04 为「组页点开加载慢」把 common.js/data.js 改成延后动态加载，
     → hubgroup.js 先跑时 PAGES 不存在 → 门控失败 → **点「我的」没反应、
       学习组只剩计划和计时**（她 15:37 报）。已回退（commit df0b8be）。
     🔑 defer 顺序不只是性能参数，它是**契约**：后一个脚本可以假定前一个已定义全局。
        要优化组页性能，先跑 tests/_probe_softnav_groups_1005.cjs（它会测软导航序列）。 -->
<script defer src="js/data.js?v=20261005a"></script>
<script defer src="js/common.js?v=20261006b"></script>
