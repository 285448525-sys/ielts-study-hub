<style>
/* ===== 模考页样式（页面内联，不动 common.css → 免全站 bump）===== */
.mock-wrap{max-width:1080px;margin:0 auto}
.mock-head h1{font-size:22px;font-weight:800;margin:0 0 6px}
.mock-head p{color:var(--muted);font-size:14px;margin:0 0 18px;line-height:1.6}
.mock-tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.mock-tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  font-size:14px;font-weight:600;padding:9px 20px;border-radius:10px;cursor:pointer;min-height:40px;transition:.15s}
.mock-tab:hover{border-color:var(--primary);color:var(--primary)}
.mock-tab.active{background:var(--primary);border-color:var(--primary);color:#fff}

.full-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.full-row .l b{font-size:15.5px;font-weight:700}
.full-row .l span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.btn-primary{appearance:none;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:14px;
  padding:10px 22px;border-radius:10px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn-primary:hover{background:var(--primary-600)}
.btn-ghost{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;
  font-size:14px;padding:9px 18px;border-radius:10px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}

.bank-count{font-size:13px;color:var(--muted);margin:0 0 10px}
.bank-items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.bank-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.bank-item:first-child{border-top:none}
.bank-item:hover{background:var(--surface-2)}
.bank-item-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.bank-item-main b{font-size:15px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank-item-zh{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bank-item-meta{display:flex;gap:6px;flex:none;align-items:center}
.bank-tag{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--line);padding:3px 9px;border-radius:20px;white-space:nowrap}
.bank-tag.ok{color:var(--primary-900);background:var(--primary-50);border-color:var(--primary-100);font-weight:700}
.bank-loading,.bank-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.bank-note{margin:18px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.soon-box{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}

/* ===== 做题页（全屏覆盖：左文右题 + 答题卡）===== */
#examRoot{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column}
#examRoot[hidden]{display:none}
.ex-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;
  background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.ex-name{font-weight:700;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-name small{font-weight:400;color:var(--muted);margin-left:7px}
.ex-mid{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted);flex:none}
.ex-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:15px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:4px 12px}
.ex-timer.warn{color:#b3261e;border-color:#e6b3ae;background:#fdf3f2}
.ex-actions{display:flex;gap:8px;flex:none}
.ex-split{flex:1;display:grid;grid-template-columns:1.05fr .95fr;min-height:0}
.ex-article{overflow:auto;padding:24px 28px 60px;background:var(--surface);border-right:1px solid var(--line);
  font-size:14.5px;line-height:1.9;color:var(--ink)}
.ex-article img{max-width:100%}
.ex-qcol{overflow:auto;padding:20px 22px 90px;background:var(--bg)}
.ex-group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.ex-grp-h{font-size:13.5px;font-weight:800;margin:0 0 3px}
.ex-grp-i{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.6}
.ex-q{margin:0 0 14px;font-size:14px;line-height:1.75}
.ex-q:last-child{margin-bottom:0}
.ex-qn{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;border-radius:6px;
  background:var(--bg);border:1px solid var(--line);font-size:12px;font-weight:700;margin-right:7px;vertical-align:1px}
.ex-qn.miss{background:#fdf3f2;border-color:#e6b3ae;color:#b3261e}
.ex-qn.hit{background:var(--primary-50);border-color:var(--primary-100);color:var(--primary-900)}
.ex-pills{display:flex;gap:7px;margin-top:7px;flex-wrap:wrap}
.ex-pill{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 13px;font-size:13px;cursor:pointer;transition:.12s}
.ex-pill:hover{border-color:var(--primary)}
.ex-pill.on{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
.ex-pill.right{background:var(--primary-50);border-color:var(--primary);color:var(--primary-900);font-weight:700}
.ex-pill.wrong{background:#fdf3f2;border-color:#e6b3ae;color:#b3261e;font-weight:700}
.ex-hdbox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.ex-hdbox div{font-size:13.5px;margin:3px 0;line-height:1.6}
.ex-hdbox i{font-style:normal;font-weight:700;color:var(--primary-900);display:inline-block;min-width:30px}
.ex-cbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px 6px;margin:0 0 14px}
.ex-cbox .row{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.7;padding:6px 0;cursor:pointer}
.ex-cbox .row input{margin-top:4px;flex:none}
.ex-html input[placeholder]{border:none;border-bottom:1.5px dashed var(--n-400);
  background:transparent;font:inherit;font-size:13.5px;padding:1px 5px;margin:0 3px;color:var(--ink);min-width:88px}
.ex-html input[placeholder]:focus{outline:none;border-bottom-color:var(--primary);background:var(--primary-50)}
.ex-html table{width:100%;border-collapse:collapse}
.ex-html td,.ex-html th{border:1px solid var(--line);padding:7px 9px;font-size:13.5px;vertical-align:middle}
.ex-html img{max-width:100%}
.ex-expl{margin-top:7px;font-size:12.5px;color:var(--muted);line-height:1.75;background:var(--surface-2);
  border-left:3px solid var(--line);border-radius:0 8px 8px 0;padding:8px 11px}
.ex-expl b{color:var(--ink);font-weight:700}
.ex-bar{flex:none;border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px}
.ex-sheet{display:flex;gap:6px;flex-wrap:wrap;max-width:100%;max-height:66px;overflow:auto}
.ex-sq{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;cursor:pointer;flex:none}
.ex-sq.done{background:var(--primary-100);border-color:var(--primary);color:var(--primary-900)}
.ex-sq.hit{background:var(--primary-100);border-color:var(--primary);color:var(--primary-900)}
.ex-sq.miss{background:#fdf3f2;border-color:#e6b3ae;color:#b3261e}
.ex-legend{font-size:12px;color:var(--muted);margin-top:7px}
.ex-score{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.ex-score b{font-size:20px;font-weight:800}
.ex-score span{color:var(--muted);font-size:13px}
@media(max-width:860px){
  .ex-split{grid-template-columns:1fr;grid-template-rows:minmax(170px,36vh) 1fr}
  .ex-article{border-right:none;border-bottom:1px solid var(--line);padding:16px 16px 40px}
  .ex-qcol{padding:14px 14px 90px}
  .ex-top{flex-wrap:wrap;gap:8px}
  .mock-tab{flex:1;text-align:center;padding:9px 8px;font-size:13.5px}
}
</style>
<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .ui-loader{margin-bottom:8px}
@media (prefers-reduced-motion: reduce){#bootLoader .ui-loader-dot,#bootLoader .ui-loader-shadow{animation:none}#bootLoader .ui-loader-dot{top:20px;height:20px;border-radius:50%;transform:none}#bootLoader .ui-loader-shadow{opacity:.5;transform:scaleX(1)}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <!-- 🔴 软导航契约：功能容器必须在 <main> 之内 -->
  <div class="mock-wrap" id="bankRoot" data-mock-tab="reading">
    <div class="mock-head">
      <h1>模考</h1>
      <p>四科按真实机考的形式练：听力 30 分钟、阅读 60 分钟、写作 60 分钟、口语 14 分钟。</p>
    </div>

    <div class="mock-tabs" id="mockTabs" role="tablist">
      <button class="mock-tab active" type="button" data-mtab="reading" role="tab">阅读</button>
      <button class="mock-tab" type="button" data-mtab="listening" role="tab">听力</button>
      <button class="mock-tab" type="button" data-mtab="writing" role="tab">写作</button>
      <button class="mock-tab" type="button" data-mtab="speaking" role="tab">口语</button>
    </div>

    <section class="mock-pane" id="pane-reading">
      <div id="bankList"><div class="bank-loading">目录加载中…</div></div>
      <p class="bank-note">每篇 = 一次完整阅读练习（13 或 14 题）。做完自动判分、逐题给解析。</p>
    </section>

    <section class="mock-pane" id="pane-listening" hidden>
      <div class="soon-box">听力模考正在准备中。<br>要先备好音频素材（约 2.8GB），之后与阅读同款：左音频右题目、自动判分。</div>
    </section>

    <section class="mock-pane" id="pane-writing" hidden>
      <div class="soon-box">写作模考正在接入。<br>沿用你现有的写作机考界面（左题目右作答 + 倒计时 + AI 批改）；写作页本身的模板等功能不动。</div>
    </section>

    <section class="mock-pane" id="pane-speaking" hidden>
      <div class="soon-box">口语模考正在接入。<br>会先给一页注意事项 + 「开始模考」按钮，再进入现有口语模考流程；口语页本身的题库等功能不动。</div>
    </section>
  </div>

  <!-- 做题页（全屏覆盖，仍挂在 main 内以满足软导航契约） -->
  <div id="examRoot" hidden></div>
</main>

</body>
