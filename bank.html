<style>
/* ===== 模考页样式（页面内联，不动 common.css → 免全站 bump）===== */
.mock-wrap{max-width:1080px;margin:0 auto}
/* 小 tab 直接用全站 .pill-tabs / .pill-tab（css/common.css），此处不另造样式 */
.mock-tabs{margin:0 0 12px}
.partbar{display:flex;align-items:center;gap:16px;margin:0 0 10px;flex-wrap:wrap}
.partmeta{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}

.full-row{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.full-row .l b{font-size:15.5px;font-weight:700}
.full-row .l span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.btn-primary{appearance:none;border:none;background:var(--primary);color:#fff;font-weight:700;font-size:14px;
  padding:10px 22px;border-radius:10px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn-primary:hover{background:var(--primary-600)}
.btn-ghost{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;
  font-size:14px;padding:9px 18px;border-radius:10px;cursor:pointer;min-height:40px;white-space:nowrap}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}

.bank-count{font-size:13px;color:var(--muted);margin:0 0 10px}
.bank-items{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.bank-item{display:flex;align-items:center;gap:14px;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer;transition:background .12s}
.bank-item:first-child{border-top:none}
.bank-item:hover{background:var(--surface-2)}
.bank-item:hover .bi-tt b{color:var(--primary-700)}
.bank-item:hover .bi-chev{color:var(--primary)}
.bi-no{width:24px;flex:none;font-size:12px;font-weight:700;color:var(--n-500);text-align:right;font-variant-numeric:tabular-nums}
.bi-tt{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px;overflow:hidden}
.bi-tt b{font-size:14.5px;font-weight:650;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s}
.bi-tt i{font-style:normal;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bi-chips{display:flex;gap:5px;flex:none}
.bi-ch{font-size:11.5px;padding:2px 8px;border-radius:6px;white-space:nowrap;line-height:1.5}
.bi-ch.t1{color:var(--primary-900);background:var(--primary-50);border:1px solid var(--primary-100)}
.bi-ch.t2{color:#4a6b8a;background:#eef2f6;border:1px solid #dbe4ee}
.bi-ch.t3{color:#8a6238;background:#f7f0e8;border:1px solid #eddfcd}
.bi-qn{width:50px;flex:none;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bi-st{width:58px;flex:none;text-align:right;font-size:12.5px;color:var(--n-500);font-variant-numeric:tabular-nums}
.bi-st.ok{color:var(--primary-900);font-weight:700}
.bi-chev{width:14px;flex:none;text-align:right;color:var(--n-400);font-size:15px;transition:color .12s}
.bank-loading,.bank-empty{padding:40px 16px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.bank-note{margin:18px 0 0;font-size:13px;color:var(--muted);line-height:1.7}
.soon-box{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}

/* ===== 做题页（全屏 · 全英文 · 仿真机考）===== */
#examRoot{position:fixed;inset:0;z-index:900;background:#fff;display:flex;flex-direction:column;--exfs:20px}
#examRoot[hidden]{display:none}
.ex-top{display:flex;align-items:center;gap:12px;padding:9px 16px;background:#f7f8f9;border-bottom:1px solid var(--line);flex:none}
.ex-name{font-size:14px;font-weight:700;color:#111;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex-name small{font-weight:400;color:var(--muted);margin-left:8px}
.ex-timer{margin:0 auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;color:#111;
  background:#fff;border:1px solid var(--n-400);border-radius:4px;padding:3px 14px}
.ex-timer.warn{color:#b3261e;border-color:#e6b3ae;background:#fdf3f2;animation:exblink 1s step-start infinite}
@keyframes exblink{50%{opacity:.35}}
.ex-icons{display:flex;gap:6px;margin-left:auto;position:relative}
.ex-ico{width:34px;height:34px;border:1px solid var(--n-400);background:#fff;border-radius:6px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#111;font-size:14px;font-weight:700;flex:none}
.ex-ico:hover{border-color:#111}
.ex-pop{position:absolute;top:42px;right:0;z-index:20;background:#fff;border:1px solid var(--n-400);border-radius:6px;
  box-shadow:0 6px 20px rgba(0,0,0,.12);padding:14px 16px;min-width:220px;display:none}
.ex-pop.on{display:block}
.ex-pop h5{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ex-pop label{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0;cursor:pointer;color:#111}
.ex-pop hr{border:none;border-top:1px solid var(--line);margin:10px 0}
.ex-split{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.ex-article{overflow:auto;padding:26px 34px 60px;background:#fff;border-right:1px solid var(--line);
  font-size:var(--exfs);line-height:1.95;color:#111}
.ex-article img{max-width:100%}
.ex-qcol{overflow:auto;padding:22px 26px 60px;background:#fff;font-size:var(--exfs)}
.ex-group{margin:0 0 26px}
.ex-grp-h{font-size:.85em;font-weight:800;margin:0 0 6px;color:#111}
.ex-grp-i{font-size:.85em;line-height:1.75;color:#111;margin:0 0 14px}
.ex-q{margin:0 0 16px;font-size:.9em;line-height:1.75;color:#111}
.ex-q:last-child{margin-bottom:0}
.ex-qn{display:inline-block;min-width:20px;font-weight:700;margin-right:7px}
.ex-qn.miss{color:#b3261e}
.ex-qn.hit{color:var(--primary-900)}
.ex-pills{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.ex-pill{border:1px solid var(--n-400);background:#fff;border-radius:3px;padding:5px 14px;font-size:.85em;cursor:pointer}
.ex-pill:hover{border-color:#111}
.ex-pill.on{background:#111;border-color:#111;color:#fff;font-weight:700}
.ex-pill.right{background:var(--primary-50);border-color:var(--primary);color:var(--primary-900);font-weight:700}
.ex-pill.wrong{background:#fdf3f2;border-color:#b3261e;color:#b3261e;font-weight:700}
.ex-hdbox{border:1px solid var(--n-400);border-radius:4px;padding:12px 16px;margin-bottom:16px}
.ex-hdbox div{font-size:.9em;margin:4px 0;line-height:1.7}
.ex-hdbox i{font-style:normal;font-weight:700;display:inline-block;min-width:30px}
.ex-cbox{margin:0 0 14px}
.ex-cbox .row{display:flex;gap:10px;align-items:flex-start;font-size:.9em;line-height:1.75;padding:5px 0;cursor:pointer}
.ex-cbox .row input{margin-top:5px;flex:none}
.ex-html input[placeholder]{border:none;border-bottom:1px dashed #111;
  background:transparent;font:inherit;font-size:.9em;padding:0 6px;margin:0 4px;color:#111;min-width:104px}
.ex-html input[placeholder]:focus{outline:none;border-bottom:1.5px solid var(--primary);background:var(--primary-50)}
.ex-html table{width:100%;border-collapse:collapse}
.ex-html th{background:#3a3f45;color:#fff;font-size:.72em;font-weight:700;text-align:left;padding:8px 10px;border:1px solid #3a3f45}
.ex-html td{border:1px solid var(--n-400);padding:8px 10px;font-size:.9em;vertical-align:middle}
.ex-html img{max-width:100%}
.ex-expl{margin-top:8px;font-size:12.5px;color:var(--n-600);line-height:1.75;background:var(--surface-2);
  border-left:3px solid var(--line);border-radius:0 6px 6px 0;padding:8px 11px}
.ex-expl b{color:#111;font-weight:700}
.ex-bar{flex:none;background:#f7f8f9;border-top:1px solid var(--line);padding:8px 14px 10px;display:flex;align-items:center;gap:12px}
.ex-sheet{display:flex;gap:5px;flex:1;flex-wrap:wrap;align-items:center;max-height:72px;overflow:auto}
.ex-sq{position:relative;width:30px;height:30px;border:1px solid var(--n-400);background:#fff;border-radius:3px;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;cursor:pointer;flex:none;color:#111}
.ex-sq.done::before{content:"";position:absolute;top:-5px;left:50%;width:11px;height:2.5px;margin-left:-5.5px;background:#111;border-radius:2px}
.ex-sq.flag{border-radius:50%}
.ex-sq.cur{border-color:#111;border-width:2px}
.ex-sq.hit{background:var(--primary-50);border-color:var(--primary);color:var(--primary-900)}
.ex-sq.miss{background:#fdf3f2;border-color:#b3261e;color:#b3261e}
.ex-actions{display:flex;gap:8px;flex:none;margin-left:auto}
.ex-split.ts-large{--exfs:23px}
.ex-split.ts-xl{--exfs:27px}
.ex-split.ct-dark{background:#1b1b1b}
.ex-split.ct-dark .ex-article,.ex-split.ct-dark .ex-qcol{background:#1b1b1b;color:#fff;border-color:#3a3f45}
.ex-split.ct-dark .ex-grp-h,.ex-split.ct-dark .ex-grp-i,.ex-split.ct-dark .ex-q{color:#fff}
.ex-split.ct-dark .ex-pill{background:#1b1b1b;color:#fff;border-color:#6a6f77}
.ex-split.ct-dark .ex-hdbox{border-color:#6a6f77}
.ex-split.ct-yellow{background:#141414}
.ex-split.ct-yellow .ex-article,.ex-split.ct-yellow .ex-qcol{background:#141414;color:#ffd400;border-color:#3a3f45}
.ex-split.ct-yellow .ex-grp-h,.ex-split.ct-yellow .ex-grp-i,.ex-split.ct-yellow .ex-q{color:#ffd400}
@media(max-width:860px){
  .ex-split{grid-template-columns:1fr;grid-template-rows:minmax(170px,36vh) 1fr}
  .ex-article{border-right:none;border-bottom:1px solid var(--line);padding:16px 16px 40px}
  .ex-qcol{padding:14px 14px 90px}
  .ex-top{flex-wrap:wrap;gap:8px}
  .mock-tabs .pill-tab,.partbar .pill-tab{padding:9px 12px;font-size:13.5px}
  .mock-tabs{width:100%}.mock-tabs .pill-tab{flex:1;justify-content:center}
  .bi-chips{display:none}.bi-qn{width:44px}
}
</style>
<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .ui-loader{margin-bottom:8px}
@media (prefers-reduced-motion: reduce){#bootLoader .ui-loader-dot,#bootLoader .ui-loader-shadow{animation:none}#bootLoader .ui-loader-dot{top:20px;height:20px;border-radius:50%;transform:none}#bootLoader .ui-loader-shadow{opacity:.5;transform:scaleX(1)}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <!-- 🔴 软导航契约：功能容器必须在 <main> 之内 -->
  <div class="mock-wrap" id="bankRoot" data-mock-tab="reading" data-mock-part="Part 1">
    <div class="mock-tabs pill-tabs" id="mockTabs" role="tablist">
      <button class="pill-tab active" type="button" data-mtab="reading" role="tab">阅读</button>
      <button class="pill-tab" type="button" data-mtab="listening" role="tab">听力</button>
      <button class="pill-tab" type="button" data-mtab="writing" role="tab">写作</button>
      <button class="pill-tab" type="button" data-mtab="speaking" role="tab">口语</button>
    </div>

    <section class="mock-pane" id="pane-reading">
      <div class="partbar">
        <div class="pill-tabs" id="partTabs">
          <button class="pill-tab active" type="button" data-part="Part 1">Part 1</button>
          <button class="pill-tab" type="button" data-part="Part 2">Part 2</button>
          <button class="pill-tab" type="button" data-part="Part 3">Part 3</button>
        </div>
        <span class="partmeta" id="partMeta"></span>
      </div>
      <div id="bankList"><div class="bank-loading">目录加载中…</div></div>
    </section>

    <section class="mock-pane" id="pane-listening" hidden>
      <div class="soon-box">听力模考正在准备中。<br>要先备好音频素材（约 2.8GB），之后与阅读同款：左音频右题目、自动判分。</div>
    </section>

    <section class="mock-pane" id="pane-writing" hidden>
      <div class="soon-box">写作模考正在接入。<br>沿用你现有的写作机考界面（左题目右作答 + 倒计时 + AI 批改）；写作页本身的模板等功能不动。</div>
    </section>

    <section class="mock-pane" id="pane-speaking" hidden>
      <div class="soon-box">口语模考正在接入。<br>会先给一页注意事项 + 「开始模考」按钮，再进入现有口语模考流程；口语页本身的题库等功能不动。</div>
    </section>
  </div>

  <!-- 做题页（全屏覆盖，仍挂在 main 内以满足软导航契约） -->
  <div id="examRoot" hidden></div>
</main>

<!-- 🔴 加载顺序契约（10/5 铁律）：defer 顺序不可改 —— bank.js 依赖 common.js 的 PAGES -->
<script defer src="js/data.js?v=20261011e"></script>
<script defer src="js/common.js?v=20261011b"></script>
<script defer src="js/bank.js?v=20261011e"></script>
</body>
</html>
