<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>仪表盘 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/prompts.js"></script>
  <script defer src="js/index.js"></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">你好，<span id="userName">Camille</span> 👋</h1>
  <p class="page-sub">首考 <span id="examDate">2026-08-02</span>，还剩 <strong id="daysLeft">--</strong> 天 · 目标总分 <strong id="targetOverall">6.0</strong></p>

  <section class="hero">
    <div class="card hero-card">
      <div class="hero-count" id="todayTime">0h0m</div>
      <div class="hero-label">今日已专注 / 目标 <span id="goalHours">8</span>h</div>
      <div id="todayProgress"></div>
    </div>
    <div class="card hero-card">
      <div class="hero-count" id="medStatus">未服药</div>
      <div class="hero-label" id="medSub">今天还没记录专注达</div>
      <div id="medBar"></div>
    </div>
  </section>

  <section class="card">
    <h2>⚡ 快捷入口 <span class="muted" style="font-size:12.5px;font-weight:500">· 侧边栏点 ❤ 收藏的页面会出现在这里</span></h2>
    <div class="quick-links" id="quickLinks"></div>
  </section>

  <section class="card">
    <h2>🔥 连续打卡</h2>
    <div id="streakBox"></div>
  </section>

  <section class="card">
    <h2>🔔 智能提醒</h2>
    <div id="reminderBox"></div>
  </section>

  <section class="card">
    <h2>📊 今日模块分布</h2>
    <div id="todayBars"></div>
    <hr style="margin:18px 0;border:none;border-top:1px solid var(--line)">
    <h2>🌐 常用网址</h2>
    <div id="favLinks"></div>
  </section>

  <section class="card">
    <h2>📋 今日总结</h2>
    <p class="muted" style="font-size:13px;margin:0 0 10px">把今天的学习时长、分模块分布、最近模考成绩和考试倒计时汇成一段纯文本，方便复制到日记里，或直接丢给 AI 做复盘。</p>
    <button class="btn btn-primary" id="genSummaryBtn">📋 生成今日总结</button>
    <div id="summaryOutput" style="display:none;margin-top:12px"></div>
  </section>

</main>

</body>
</html>
