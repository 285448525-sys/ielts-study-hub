<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}

<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container home">
  <!-- v6 首页：hero 倒计时 + 紧凑双卡 + 快速入口 + 今日记录（design/31 A 版） -->

  <!-- L1 · hero 倒计时主卡（问候/目标/连续天数已收进卡内，避免顶部独立横条造成左侧空白） -->
  <section class="hero">
    <div class="hero-greet">
      <div class="hero-user">
        <span class="hero-hi">你好，<span id="userName">Camille</span></span>
        <span class="hero-date" id="dashDate"></span>
        <span class="streak-chip" id="dashStreakChip"></span>
      </div>
    </div>
    <div class="hero-main">
      <div class="hero-left">
        <div class="hero-num" id="dashHeroNum"><span class="big">--</span><span class="unit">天</span></div>
      </div>
      <div class="hero-right">
        <a class="hero-cta" href="timer.html">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="6,4 20,12 6,20"/></svg>
          开始计时学习
        </a>
      </div>
    </div>
  </section>

  <!-- L2 · 紧凑双卡（包 a 可点击，与下方 6 模块去重后作为唯一入口） -->
  <section class="meta">
    <a class="meta-card" href="timer.html">
      <div class="meta-left">
        <div class="label">今日学习</div>
        <div class="val" id="dashTodayTime"></div>
        <div class="hint" id="dashTodayMods"></div>
      </div>
      <div class="meta-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
      </div>
    </a>
    <a class="meta-card" href="practice.html">
      <div class="meta-left">
        <div class="label">待学习单词</div>
        <div class="val" id="dashDueWords"></div>
        <div class="hint" id="dashDueHint"></div>
      </div>
      <div class="meta-ico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h12a3 3 0 0 1 3 3v11H7a3 3 0 0 1-3-3V5zM4 5a3 3 0 0 1 3-3h9"/><path d="M9 9h7M9 13h5"/></svg>
      </div>
    </a>
  </section>

  <!-- L3 · 4 模块快速入口（计时/单词去重后保留：计划 / 句子 / 口语 / 写作） -->
  <section class="quick qc-4">
    <a class="qc" href="plans.html"><span class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4"/></svg></span><span class="qc-nm">计划</span></a>
    <a class="qc" href="corpus.html"><span class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l11-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></span><span class="qc-nm">句子</span></a>
    <a class="qc" href="speaking.html"><span class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6.5A8 8 0 1121 12z"/></svg></span><span class="qc-nm">口语</span></a>
    <a class="qc" href="writing.html"><span class="qc-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L18.5 9.5l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg></span><span class="qc-nm">写作</span></a>
  </section>

  <!-- 今日学习记录 -->
  <section class="rec">
    <div class="rec-h">
      <h3>今日学习记录</h3>
      <span class="rec-total">总计 <b id="dashRecTotal">0h0m</b></span>
    </div>
    <div class="rec-body" id="dashRecBody"></div>
  </section>
</main>

</body>
