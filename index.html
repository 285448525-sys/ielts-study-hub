<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>首页 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<link rel="icon" type="image/x-icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/index.js"></script>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <!-- v5 首页：纵向信息流（design/30 首页Dashboard+导航全面简化 v5） -->
  <div class="dash-top-v5">
    <span class="hi">你好，<span id="userName">Camille</span></span>
    <span class="date" id="dashDate"></span>
  </div>

  <!-- 三格指标横条 -->
  <section class="dash-stats">
    <!-- 格1：考试倒计时 -->
    <article class="dash-stat cd-main">
      <div class="dsl">距离考试</div>
      <div class="dsv" id="dashCDNum"><span class="num">--</span><span class="unit">天</span></div>
      <div class="dsd" id="dashCDSub">未设置考试日期</div>
      <div class="dsbar"><i id="dashCDBar" style="width:0%"></i></div>
    </article>
    <!-- 格2：今日学习时长 -->
    <article class="dash-stat">
      <div class="dsl">今日学习</div>
      <div class="dsv" id="dashTodayTime"><span class="num">0</span><span class="unit">h</span><span class="num">0</span><span class="unit">m</span></div>
      <div class="dsd" id="dashTodayMods">0 个模块已记录</div>
    </article>
    <!-- 格3：待复习 -->
    <article class="dash-stat">
      <div class="dsl">待复习</div>
      <div class="dsv" id="dashDueWords"><span class="num">0</span><span class="unit">词</span></div>
      <div class="dsd" id="dashDueHint">暂无到期单词</div>
    </article>
  </section>

  <!-- 今日学习记录详情 -->
  <section class="dash-rec">
    <div class="dash-rec-head">
      <h2>今日学习记录</h2>
      <span class="total">总计 <b id="dashRecTotal">0h0m</b></span>
    </div>
    <div class="dash-rec-body" id="dashRecBody">
      <!-- JS 动态注入模块行 -->
    </div>
  </section>

  <!-- 行动召唤 -->
  <div class="dash-action">
    <a class="dash-start" href="timer.html">▶ 开始计时学习</a>
    <span class="dash-streak" id="dashStreak"></span>
  </div>

</main>

</body>
</html>
