<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<style>
  .eb-input{width:100%;min-height:190px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;font-size:14.5px;line-height:1.75;background:var(--bg);color:var(--ink);resize:vertical}
  .eb-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .eb-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .eb-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;background:var(--surface)}
  .eb-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .eb-title{font-size:15.5px;font-weight:700;line-height:1.5;margin-bottom:10px}
  .eb-block{margin-top:10px}
  .eb-block h4{margin:0 0 5px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .eb-block ol,.eb-block ul{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
  .eb-block p{margin:0;font-size:14px;line-height:1.75}
  .eb-wrong{background:rgba(239,68,68,.07);border-left:3px solid var(--danger);padding:9px 12px;border-radius:8px;font-size:14px;line-height:1.7}
  .eb-rule{background:var(--primary-soft);border-left:3px solid var(--primary);padding:9px 12px;border-radius:8px;font-size:14px;line-height:1.7}
  .eb-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .eb-chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px}
  .eb-src{margin-top:12px;font-size:12.5px;color:var(--muted)}
  .eb-src summary{cursor:pointer;user-select:none}
  .eb-src pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--line);font:inherit;font-size:13px;line-height:1.7;max-height:260px;overflow:auto}
  .eb-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .badge-trap{background:var(--warn);color:#fff;border-color:var(--warn)}
  .badge-ok{background:var(--primary);color:#fff;border-color:var(--primary)}
  .eb-list-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .eb-list-head h2{margin:0}
  .eb-list-head select{margin-left:auto}
  .eb-loading{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:14px}
  .eb-long{margin-top:6px;padding:8px 10px;background:var(--bg);border-left:3px solid var(--primary);border-radius:8px}
  .eb-long-s{font-size:14px;font-weight:600;color:var(--ink);line-height:1.6}
  .eb-long-a{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.7}

</style>
<style id="bootLoaderStyle">
#bootLoader{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:radial-gradient(1100px 560px at 100% -8%,rgba(58,154,147,.05),transparent 60%),var(--bg,#f6f9fb);opacity:1;pointer-events:auto;transition:opacity .18s ease}
#bootLoader.hide{opacity:0;pointer-events:none}
#bootLoader .load-reveal{text-align:center}
#bootLoader .load-reveal>span{font-size:58px;font-weight:800;color:var(--ink,#173a39);display:inline-block;opacity:0;animation:eFade 1.8s cubic-bezier(.2,.7,.2,1) forwards}
#bootLoader .load-reveal>span:nth-child(1){animation-delay:0s}
#bootLoader .load-reveal>span:nth-child(2){animation-delay:.12s}
#bootLoader .load-reveal>span:nth-child(3){animation-delay:.24s}
#bootLoader .load-reveal>span:nth-child(4){animation-delay:.36s}
#bootLoader .load-reveal>span:nth-child(5){animation-delay:.48s}
@keyframes eFade{0%{opacity:0;transform:translateY(14px);filter:blur(6px)}100%{opacity:1;transform:translateY(0);filter:blur(0)}}
#bootLoader .load-bar{width:180px;height:3px;margin:18px auto 0;border-radius:3px;background:linear-gradient(90deg,var(--primary,#3a9a93),transparent);background-size:55% 100%;background-repeat:no-repeat;animation:eLoad 1.7s cubic-bezier(.4,0,.2,1) infinite}
@keyframes eLoad{0%{background-position:-100px 0}100%{background-position:240px 0}}
#bootLoader .load-sub{margin-top:12px;font-size:12.5px;color:var(--muted,#6b7d7c);letter-spacing:.3em;text-transform:uppercase}
@media (prefers-reduced-motion: reduce){#bootLoader .load-reveal>span{animation:none;opacity:1;filter:none}#bootLoader .load-bar{animation:none}}
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="load-reveal"><span>I</span><span>E</span><span>L</span><span>T</span><span>S</span><div class="load-bar"></div><div class="load-sub">Loading</div></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <div class="page-head-row">
    <h1 class="page-title">词句</h1>
    <div class="sub-tabs pill-tabs" id="wordTabs">
      <button data-sub="ls" class="pill-tab active">长难句拆解</button>
      <button data-sub="eb" class="pill-tab">错题本</button>
    </div>
  </div>

  <!-- 长难句拆解（置前） -->
  <div id="lsView">
    <section class="card">
      <h2>粘贴长难句</h2>
      <textarea id="sentInput" placeholder="在此粘贴你遇到的长难句，例如：&#10;The theory, which was proposed by a group of researchers who had spent decades observing the species, suggests that the decline is not merely a temporary fluctuation but a sign of a deeper ecological imbalance."></textarea>
      <div class="form-row row-end mt-10">
        <button class="btn btn-primary" id="analyzeBtn">拆解分析</button>
        <span id="sentStatus" class="word-status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card" id="resultCard" style="display:none">
      <div class="card-head">
        <h2>拆解结果</h2>
        <button class="btn btn-sm btn-ghost" id="copyBtn">复制全文</button>
      </div>
      <blockquote id="origSent" class="quote"></blockquote>
      <div id="resultBody"></div>
    </section>

    <section class="card" id="histCard" style="display:none">
      <h2>我的拆解记录 · <span id="histCount">0</span></h2>
      <div id="histList" class="grid ls-hist-grid"></div>
    </section>
  </div>

  <!-- 错题本 -->
  <div id="ebView" hidden>

  <section class="card">
    <textarea class="eb-input" id="ebInput" placeholder="把你的错题讲解贴进来就行（AI 对你截图的回复、你自己记的笔记都行），不用整理格式。
比如：
一道阅读判断题，我选 NOT GIVEN，答案是 FALSE，原文说的是 …"></textarea>
    <div class="eb-bar">
      <button class="btn btn-primary" id="ebAnalyze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 7V3M9 3h6"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/><path d="M9 16h6"/></svg>理清错因并归档</button>
      <button class="btn" id="ebRaw">只存原文</button>
      <span class="muted" style="font-size:12.5px">自动分析用的是「设置 / AI 接口」里的 DeepSeek Key</span>
    </div>
    <div id="ebLoading" class="eb-loading" hidden></div>
  </section>

  <section class="card">
    <div class="eb-list-head">
      <h2>已归档 · <span id="count">0</span> 条</h2>
    </div>
    <div id="list"></div>
    <div id="empty" class="muted" hidden>还没有记录。把你的错题笔记贴到上面那个框，点「理清错因并归档」。</div>
  </section>
  </div>
</main>

</body>
