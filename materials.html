<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>

<style>
  /* === 万能素材生成器（沿用全站 Teal Token） === */
  .mat-intro{ padding:14px 16px; background:var(--primary); color:#fff; border-radius:var(--radius); font-size:13.5px; line-height:1.7; margin:12px 0; box-shadow:var(--shadow); }
  .mat-intro b{ font-weight:700; }
  .mat-sec-title{ font-size:15px; font-weight:700; margin:18px 0 8px; color:var(--ink); letter-spacing:-.01em; }
  .mat-sec-title .tag{ font-size:12px; font-weight:600; color:var(--muted); margin-left:6px; }
  .mat-q{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px; box-shadow:var(--shadow); }
  .mat-q.optional{ opacity:.92; border-style:dashed; }
  .mat-q-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:4px; }
  .mat-q-title{ font-size:15px; font-weight:700; color:var(--ink); }
  .mat-q-title .req{ color:var(--danger); margin-left:4px; font-size:12px; }
  .mat-q-title .opt{ color:var(--muted); margin-left:4px; font-size:12px; }
  .mat-q-hint{ font-size:12.5px; color:var(--muted); margin:2px 0 8px; line-height:1.6; }
  .mat-q textarea{ width:100%; min-height:84px; padding:10px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); font:inherit; background:var(--surface); color:var(--ink); resize:vertical; box-sizing:border-box; line-height:1.7; transition:border-color .15s,box-shadow .15s; }
  .mat-q textarea:focus{ border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-soft); outline:none; }
  .mat-char{ font-size:12px; color:var(--muted); margin-top:4px; }
  .mat-char.warn{ color:var(--warn); }
  .mat-actions{ display:flex; gap:10px; flex-wrap:wrap; margin:16px 0 4px; }
  .mat-add{ font-size:13px; color:var(--primary); background:none; border:1px dashed var(--primary); border-radius:var(--radius-sm); padding:8px 14px; cursor:pointer; }
  .mat-add:hover{ background:var(--primary-soft); }
  .mat-loading{ padding:40px 20px; text-align:center; color:var(--muted); font-size:15px; }
  .mat-spinner{ width:34px; height:34px; border:4px solid var(--primary-soft); border-top-color:var(--primary); border-radius:50%; margin:0 auto 14px; animation:matspin 1s linear infinite; }
  @keyframes matspin{ to{ transform:rotate(360deg); } }

  /* 结果页 */
  /* 10-23 T-017c：人设从大块渐变降成一条横向人物条（设计稿 ≤72px）。
     h3 变成左侧小标、pp-line 主行、标签紧跟、右侧「改人设」小按钮；
     960 以下折行（见文件末 @media）。 */
  .mat-persona{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:14px 20px; margin:0 0 16px; background:linear-gradient(135deg,var(--primary-600),var(--primary-800)); border-radius:var(--radius); color:#fff; box-shadow:var(--shadow); }
  .mat-persona h3{ margin:0; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; opacity:.75; flex:none; }
  .mat-persona .pp-line{ font-size:14px; font-weight:800; line-height:1.4; flex:none; }
  .mat-persona .pp-tags{ display:flex; gap:6px; flex-wrap:wrap; margin:0; flex:1; min-width:0; }
  .mat-persona .pp-tag{ font-size:11.5px; padding:2px 9px; border-radius:999px; background:rgba(255,255,255,.2); }
  .mat-persona .pp-edit{ margin-left:auto; flex:none; font-size:12px; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.34); color:#fff; cursor:pointer; }
  .mat-persona .pp-edit:hover{ background:rgba(255,255,255,.28); }

  .mat-mat{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:0; box-shadow:var(--shadow); overflow:hidden; transition:border-color .16s; }
  .mat-mat:hover{ border-color:var(--primary-200); }
  /* 卡头：3px 品牌色左竖条 + 标签行 + 15.5 加粗标题（设计稿 .mcard-h） */
  .mat-mat-head{ position:relative; display:block; padding:15px 18px 14px; cursor:pointer; border-bottom:1px solid var(--line); }
  .mat-mat-head::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:linear-gradient(180deg,var(--primary-300),var(--primary-600)); }
  .mat-mat-head:hover{ background:var(--surface-2); }
  .mat-mat-title{ display:block; font-size:15.5px; font-weight:800; line-height:1.4; letter-spacing:-.005em; color:var(--ink); padding-right:22px; }
  .mat-mat-meta{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:5px; }
  .mat-mat-meta .mm{ font-size:11.5px; font-weight:700; padding:1px 8px; border-radius:999px; background:var(--bg); color:var(--muted); border:1px solid var(--line); }
  .mat-mat-meta .mm.star{ background:var(--primary-50); color:var(--primary-800); border-color:transparent; }
  .mat-mat .mat-caret{ position:absolute; right:16px; top:16px; }
  .mat-mat-cov{ font-size:12px; color:var(--primary); font-weight:600; white-space:nowrap; }
  .mat-caret{ color:var(--muted); transition:transform .2s; flex:none; }
  .mat-mat.open .mat-caret{ transform:rotate(90deg); }
  .mat-facets{ display:flex; gap:6px; flex-wrap:wrap; padding:0 16px; }
  .mat-facet{ font-size:11px; padding:2px 9px; border-radius:10px; background:var(--bg); color:var(--muted); border:1px solid var(--line); }
  .mat-facet.f{ background:var(--primary-soft); color:var(--med); border-color:transparent; }
  .mat-body{ padding:0 16px 14px; display:none; }
  .mat-mat.open .mat-body{ display:block; }
  .mat-sub{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:var(--muted); margin:16px 0 9px; }
  .mat-sub::after{ content:""; flex:1; height:1px; background:var(--line); }
  .mat-sub:first-child{ margin-top:0; }
  .mat-skel{ list-style:none; margin:0; padding:0; }
  .mat-skel li{ font-size:14px; line-height:1.7; padding:4px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; }
  .mat-skel li .en{ flex:1; color:var(--ink); }
  .mat-skel li .zh{ flex:1; color:var(--muted); }
  .mat-cov-list{ display:flex; gap:6px; flex-wrap:wrap; }
  .mat-cov-item{ font-size:12px; padding:2px 10px; border-radius:10px; background:var(--primary-soft); color:var(--med); }
  .mat-p3{ font-size:13px; color:var(--ink); line-height:1.7; }
  .mat-p3 div{ padding:2px 0; }
  .mat-raw-edit{ width:100%; min-height:70px; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-sm); font:inherit; background:var(--surface); color:var(--ink); resize:vertical; box-sizing:border-box; margin-top:6px; }
  .mat-mat-actions{ display:flex; gap:6px; flex-wrap:wrap; margin:16px -18px -14px; padding:12px 18px; border-top:1px solid var(--line); background:var(--surface-2); }
  .mat-mat-actions .mat-mini{ background:var(--surface); }
  .mat-mat-actions .spacer{ flex:1; }
  /* T-017c：操作条统一白底会盖掉置顶态的 primary 底 → 白底白字，这里救回来 */
  .mat-mat-actions .mat-mini.mat-pin-on{ background:var(--primary-500); border-color:var(--primary-500); color:#fff; }
  html[data-theme="dark"] .mat-mat-actions .mat-mini.mat-pin-on{ background:var(--primary-600); border-color:var(--primary-600); color:#fff; }

  /* 两列网格（T-017c）：1280 两列、≤960 单列 */
  .mat-mgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:16px; align-items:start; }
  .mat-mgrid .mat-mat{ margin-bottom:0; }
  .mat-mini{ font-size:12px; padding:6px 12px; border-radius:var(--radius-sm); border:1px solid var(--line); background:var(--surface); color:var(--ink); cursor:pointer; }
  .mat-mini:hover{ border-color:var(--primary); color:var(--primary); }
  .mat-mini.danger{ color:var(--danger); border-color:var(--line); }
  .mat-mini.danger:hover{ border-color:var(--danger); }
  .mat-edit-input{ width:100%; box-sizing:border-box; font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:9px 11px; margin-bottom:2px; }
  .mat-edit-input:focus{ outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); }
  .mat-edit-area{ min-height:120px; resize:vertical; line-height:1.7; white-space:pre-wrap; }
  .mat-edit-hint{ font-size:12px; color:var(--muted); margin:8px 0 2px; }
  .mat-edit-hint b{ color:var(--primary); }
  .mat-mini.btn-save{ background:var(--primary); color:#fff; border-color:var(--primary); }
  .mat-mini.btn-save:hover{ filter:brightness(1.05); color:#fff; }
  .mat-mini.mat-pin-on{ color:var(--primary); border-color:var(--primary); background:var(--primary-soft); }

  /* P1：当季覆盖矩阵 */
  .mat-matrix{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0; box-shadow:var(--shadow); }
  .mat-mx-head{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:10px; }
  .mat-mx-head h3{ margin:0; font-size:15px; }
  .mat-mx-stat{ font-size:12px; color:var(--muted); }
  .mat-mx-row{ display:flex; gap:10px; align-items:flex-start; padding:6px 0; }
  .mat-mx-cat{ flex:0 0 3.2em; font-size:12px; color:var(--muted); padding-top:5px; }
  .mat-mx-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .mat-chip{ display:inline-block; font-size:12px; line-height:1; padding:7px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); background:var(--surface); }
  .mat-chip-natural{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .mat-chip-loose{ border-color:var(--primary); color:var(--primary); background:var(--primary-soft); }
  .mat-mx-legend{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .mat-mx-legend .mat-mx-go{ margin-left:auto; min-height:44px; padding:10px 16px; }
  .mat-mx-dig{ min-height:44px; padding:10px 16px; }
  .mat-mx-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .mat-mx-actions .btn{ min-height:44px; }
  .mat-mx-tip{ font-size:12px; color:var(--muted); margin-top:8px; }

  /* P1：素材卡点题句区块 */
  .mat-covs{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .mat-cov{ display:flex; flex-direction:column; gap:2px; padding:8px 10px; background:var(--primary-soft-2); border-radius:var(--radius-sm); }
  .mat-cov-topic{ font-size:13px; font-weight:600; }
  .mat-bridge{ font-size:13px; line-height:1.6; color:var(--primary); font-weight:700; }
  .mat-cov-note{ font-size:12.5px; color:var(--muted); }

  /* P2：换季重映射横幅 + 质检软门槛 + 字数三档 */
  .mat-remap{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; background:var(--warn-soft, rgba(255,149,0,.12)); border:1px solid var(--warn); border-radius:var(--radius); padding:12px 14px; margin:12px 0; }
  .mat-remap-txt{ flex:1 1 240px; font-size:13px; line-height:1.6; }
  .mat-remap .btn{ min-height:44px; }
  .mat-char.ok{ color:var(--warn-ink); }
  .mat-char.good{ color:var(--primary); }
  .mat-shortwarn{ background:var(--warn-soft, rgba(255,149,0,.12)); border:1px solid var(--warn); border-radius:var(--radius); padding:14px 16px; margin:12px 0; font-size:13.5px; line-height:1.7; }
  .mat-shortwarn-list{ margin:8px 0; color:var(--warn-ink); }
  .mat-shortwarn-actions{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .mat-shortwarn-actions .btn{ min-height:44px; }
  .mat-shortwarn-tip{ font-size:12px; color:var(--muted); }

  .mat-gaps{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin:16px 0; box-shadow:var(--shadow); }
  .mat-gaps h3{ margin:0 0 10px; font-size:15px; }
  .mat-gap{ display:flex; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:13.5px; }
  .mat-gap:last-child{ border-bottom:none; }
  .mat-gap .gt{ font-weight:700; color:var(--ink); flex:none; }
  .mat-gap .ga{ color:var(--muted); flex:1; }
  .mat-empty{ text-align:center; padding:40px 20px; color:var(--muted); font-size:14px; }

  /* === 万能素材生成器重构：可背小故事 + 中文逻辑链 + AI 追问区（沿用 teal token，不引新变量） === */
  .mat-story-en{ white-space:pre-wrap; line-height:1.7; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-left:3px solid var(--primary); border-radius:10px; padding:10px 12px; font-size:14px; }
  .mat-logic{ white-space:pre-wrap; line-height:1.8; background:var(--primary-soft); border-radius:10px; padding:10px 12px; font-size:14px; }
  .mat-followup{ margin-top:16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .mat-followup h3{ margin:0 0 6px; font-size:15px; }
  .mat-followup-tip{ font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.6; }
  .mat-followup .mat-q{ box-shadow:none; margin-bottom:10px; }
  .mat-gap-topic{ font-weight:700; color:var(--primary); }
  .mat-gap-q .mat-q-head{ font-size:14px; font-weight:600; color:var(--ink); line-height:1.6; }
  .mat-cov-badge{ font-size:11px; padding:1px 6px; border-radius:6px; margin-right:4px; }
  .mat-cov-badge.loose{ background:#fef3c7; color:#92400e; }
  .mat-cov-badge.nat{ background:var(--primary-soft); color:var(--primary); }
  .mat-cov-note{ display:block; font-size:11.5px; color:var(--muted); margin-top:2px; }
  [data-theme="dark"] .mat-story-en{ background:var(--surface); color:var(--ink); }

  /* === design/86 · 漏斗式动态问卷 + 故事骨架层 === */
  .opt-tag{ font-size:11px; font-weight:600; color:var(--muted); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:1px 7px; margin-left:6px; vertical-align:1px; }
  .mat-step{ margin:12px 0 2px; }
  .mat-step-label{ font-size:13.5px; font-weight:600; color:var(--ink); line-height:1.6; margin-bottom:6px; }
  .mat-step input[type="text"]{ width:100%; box-sizing:border-box; min-height:44px; padding:9px 12px; border:1px solid var(--line); border-radius:var(--radius-sm); font:inherit; font-size:14px; background:var(--surface); color:var(--ink); transition:border-color .15s, box-shadow .15s; }
  .mat-step input[type="text"]:focus{ border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft); outline:none; }
  .mat-yn{ display:flex; gap:10px; }
  .mat-yn button{ flex:1; min-height:44px; border:1.5px solid var(--line); border-radius:var(--radius-sm); background:var(--surface); color:var(--ink); font:inherit; font-size:14px; font-weight:700; cursor:pointer; transition:border-color .15s, background .15s, color .15s; }
  .mat-yn button:hover{ border-color:var(--primary); }
  .mat-yn button.on{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary); }
  .mat-chips{ display:flex; flex-wrap:wrap; gap:8px; }
  .mat-chip.pick{ cursor:pointer; font:inherit; font-size:12.5px; padding:8px 13px; transition:border-color .15s, background .15s, color .15s; }
  .mat-chip.pick:hover{ border-color:var(--primary); color:var(--primary); }
  .mat-chip.pick.on{ background:var(--primary); border-color:var(--primary); color:#fff; }
  .mat-nohint{ font-size:12.5px; color:var(--muted); line-height:1.6; margin-top:6px; }
  /* 10/2 她拍板：串题前先讲清串题的优势（简单填几个问题 → 几个专属题材 → 尽量串多题）。
     用主色浅底 + 左描边，与下面的白卡片拉开层次，但不抢人设卡的注意力。 */
  .mat-why{ background:var(--primary-soft); border:1px solid var(--primary); border-left:3px solid var(--med); border-radius:var(--radius); padding:13px 15px; margin:14px 0 4px; }

  /* ===== 10/4 02:00 题库页 A 版（她 01:10 授权自选）=====
     ① intro + 「为什么要先填人设」合并：8 行常驻 → 一行 + 折叠链接
     ② 三步编号（1 人设 / 2 复用素材 / 3 生成），让用户知道走到哪
     ③ 已有素材入口提到顶部常驻（她 00:57 拍板） */
  .mat-why-fold{ background:var(--primary-soft); border:1px solid var(--primary); border-left:3px solid var(--med);
    border-radius:var(--radius); padding:12px 15px; margin:8px 0 12px; font-size:13px; line-height:1.7; }
  .mat-why-link{ display:inline-block; margin-top:7px; background:none; border:0; padding:0; cursor:pointer;
    font:inherit; font-size:12.5px; font-weight:600; color:#fff; text-decoration:underline; text-underline-offset:2px; opacity:.9; }
  .mat-why-link:hover{ opacity:1; }
  .mat-why-link::after{ content:' ▾'; font-size:10px; }
  .mat-why-link.on::after{ content:' ▴'; }
  .mat-step-n{ display:inline-flex; align-items:center; justify-content:center; width:19px; height:19px;
    border-radius:50%; background:var(--primary); color:#fff; font-size:11px; font-weight:800;
    margin-right:7px; vertical-align:1px; flex:none; }
  .mat-sec-title{ display:flex; align-items:center; }
  .mat-why-t{ font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  .mat-why-l{ font-size:13px; line-height:1.75; color:var(--ink); }
  .mat-why-l b{ color:var(--med); font-weight:700; }
  /* 10/2 平台自带万用人设快捷填充 */

/* MAT-INTRO-1（10-25）：导出工具提示 `.mi-note` 在 DOM 里用了但 CSS 没定义（会裸奔）。

/* ═══ MAT-INTRO-1（10-25）圆角钉死 + mi-note 兜底 ═══
   🔴 为什么需要这一段：导出工具把设计稿私有变量 --r(14px) / --r-sm(10px)
      映射成了站点 --radius(16px) / --radius-sm(12px) —— 站点这几档比设计稿大 2px。
      1:1 基线按设计稿算，所以实测每条都差 2px。按设计稿原值钉回。 */
.mi-page .mi-hero,.mi-page .mi-col,.mi-page .mi-old,.mi-page .mi-new,

/* .mi-note：导出工具提示「DOM 用了但 CSS 没定义」，补一条兜底（期望圆角 10px） */
