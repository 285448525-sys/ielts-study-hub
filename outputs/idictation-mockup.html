<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背词页原型 v2（居中无例句）</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #eef0f3;
    color: #1a1a1a;
    display: flex; justify-content: center; padding: 24px 12px;
  }
  .wrap { width: 100%; max-width: 960px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 12px 12px 0 0;
    padding: 12px 18px; font-size: 14px; color: #666;
  }
  .topbar .title { font-weight: 600; color: #1a1a1a; }
  .topbar .progress { font-size: 13px; color: #888; }

  .stage {
    background: #fff; border: 1px solid #e5e7eb; border-top: none;
    border-radius: 0 0 12px 12px; padding: 28px 26px 26px;
  }

  /* ── 单词区：全部居中，无例句 ── */
  .word-area {
    position: relative; text-align: center;
    padding: 10px 4px 24px; margin-bottom: 22px;
    border-bottom: 1px solid #f0f0f0;
  }
  .mastered {
    position: absolute; top: 2px; right: 6px;
    background: #ecfdf3; color: #16a34a; border: 1px solid #bbf7d0;
    font-size: 12px; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  }
  .en  { font-size: 38px; font-weight: 800; letter-spacing: -.02em; line-height: 1.25; }
  .ipa { font-size: 15px; color: #999; font-family: Georgia, serif; margin-top: 6px; }
  .pos { font-size: 15px; color: #3b82f6; font-weight: 600; margin-top: 5px; }
  /* 预留高度，答后中文出现不跳动 */
  .cn  { font-size: 15px; color: #555; margin-top: 5px; min-height: 23px; line-height: 1.55; }

  /* ── 选项 2×2：第一行词性，第二行中文 ── */
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .opt {
    height: 88px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    gap: 6px; padding: 14px 18px;
    background: #fff; border: 1.5px solid #e5e7eb; border-radius: 10px;
    cursor: pointer; transition: all .15s ease; overflow: hidden;
  }
  .opt:hover { border-color: #cbd5e1; }
  /* 固定行高 18px：字号变化只改字大小，行盒高度不变 → 中文不被压下去 */
  .opt .tag { font-size: 13px; color: #999; font-weight: 500; line-height: 18px; }
  /* 答后 tag 里冒出的英文：大一号 16px，但行高仍是 18px 不撑高 */
  .opt.wrong .tag, .opt.correct .tag { font-size: 16px; line-height: 18px; }
  .opt .cn2 { font-size: 17px; font-weight: 600; color: #1a1a1a; line-height: 1.4; }

  .opt.wrong { border-color: #fca5a5; background: #fef2f2; }
  .opt.wrong .tag { color: #b91c1c; font-weight: 700; }
  .opt.correct { border-color: #86efac; background: #f0fdf4; }
  .opt.correct .tag { color: #166534; font-weight: 700; }

  .unknown {
    margin-top: 20px; display: inline-flex; align-items: center;
    border: 1px solid #e5e7eb; border-radius: 8px; background: #fff;
    padding: 9px 22px; font-size: 14px; color: #888; cursor: pointer;
  }
  .unknown:hover { border-color: #3b82f6; color: #3b82f6; }

  .toolbar {
    margin-top: 24px; padding-top: 16px; border-top: 1px solid #f0f0f0;
    display: flex; justify-content: center; gap: 14px;
  }
  .speaker {
    width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid #e5e7eb;
    background: #fff; font-size: 22px; cursor: pointer;
  }
  .speaker:hover { border-color: #3b82f6; }

  .switch { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .switch button {
    border: 1.5px solid #cbd5e1; background: #fff; color: #475569;
    padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
  }
  .switch button.active { border-color: #3b82f6; background: #eff6ff; color: #2563eb; font-weight: 600; }
  .note { font-size: 12px; color: #94a3b8; margin-top: 12px; line-height: 1.65; }
</style>
</head>
<body>
<div class="wrap">

  <div class="switch">
    <button id="btnInit" class="active" onclick="setState('init')">① 初始态（答题前）</button>
    <button id="btnWrong" onclick="setState('wrong')">② 答错看反馈</button>
    <button id="btnRight" onclick="setState('right')">③ 答对看反馈</button>
  </div>

  <div class="topbar">
    <span class="title">背单词 · 拼写测试</span>
    <span class="progress">第 3 / 20 个</span>
  </div>

  <div class="stage">
    <!-- 单词区：居中，无例句 -->
    <div class="word-area">
      <button class="mastered">已掌握</button>
      <div class="en">pity</div>
      <div class="ipa">/ˈpɪti/</div>
      <div class="cn" id="cn"></div>
    </div>

    <!-- 选项 -->
    <div class="opts">
      <button class="opt" data-en="loan" data-pos="n." data-cn="贷款；借出">
        <span class="tag">n.</span><span class="cn2">贷款；借出</span>
      </button>
      <button class="opt" data-en="pity" data-pos="n." data-cn="怜悯；同情；憾事">
        <span class="tag">n.</span><span class="cn2">怜悯；同情；憾事</span>
      </button>
      <button class="opt" data-en="tone" data-pos="n." data-cn="语气；音调；色调">
        <span class="tag">n.</span><span class="cn2">语气；音调；色调</span>
      </button>
      <button class="opt" data-en="lush" data-pos="adj." data-cn="茂盛的；豪华的">
        <span class="tag">adj.</span><span class="cn2">茂盛的；豪华的</span>
      </button>
    </div>

    <button class="unknown">不知道</button>

    <div class="toolbar">
      <button class="speaker" title="再读一遍">&#128266;</button>
    </div>

    <div class="note">说明：单词 / 音标 / 词性 / 中文释义 全部居中显示，无例句卡片。答题前中文为空，答后才浮现。选项第一行=词性，第二行=中文。布局全程不跳动。</div>
  </div>
</div>

<script>
  const opts = document.querySelectorAll('.opt');
  const cn = document.getElementById('cn');

  function reset(){
    opts.forEach(o => {
      o.classList.remove('correct','wrong');
      o.querySelector('.tag').textContent = o.dataset.pos;
    });
    cn.textContent = '';
  }

  function setState(s){
    document.getElementById('btnInit').classList.toggle('active', s==='init');
    document.getElementById('btnWrong').classList.toggle('active', s==='wrong');
    document.getElementById('btnRight').classList.toggle('active', s==='right');
    reset();
    if(s==='init') return;

    const correct = [...opts].find(o => o.dataset.en === 'pity');
    const picked = (s==='wrong')
      ? [...opts].find(o => o.dataset.en === 'loan')
      : correct;

    correct.classList.add('correct');
    correct.querySelector('.tag').textContent = correct.dataset.pos + ' ' + correct.dataset.en;
    if(s==='wrong'){
      picked.classList.add('wrong');
      picked.querySelector('.tag').textContent = picked.dataset.pos + ' ' + picked.dataset.en;
    }
    cn.textContent = '怜悯；同情；憾事';
  }

  opts.forEach(o => o.addEventListener('click', () => {
    const isCorrect = o.dataset.en === 'pity';
    setState(isCorrect ? 'right' : 'wrong');
    document.getElementById('btnInit').classList.remove('active');
    document.getElementById(isCorrect ? 'btnRight' : 'btnWrong').classList.add('active');
  }));
</script>
</body>
</html>
