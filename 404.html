<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>页面不存在 · 雅思备考 Hub</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=7" />
<link rel="canonical" href="https://yasihub.com/" />
<style>
  :root{color-scheme:light dark;--bg:#f4f5f3;--card:#fff;--ink:#202825;--title:#173e3a;--muted:#68736e;--line:#e2e6e4;--pd:#266e68;--pl:#eef7f6}
  @media(prefers-color-scheme:dark){:root{--bg:#111614;--card:#1c2320;--ink:#e9efeb;--title:#e5f1ec;--muted:#a5b4ac;--line:#34403a;--pd:#a8d7d2;--pl:#243c36}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  main{width:min(100%,520px);padding:36px 30px;border:1px solid var(--line);border-radius:16px;background:var(--card);text-align:center;box-shadow:0 18px 50px -32px #173e3a35}
  h1{font-size:28px;line-height:1.35;letter-spacing:-.02em;color:var(--title);margin:0 0 12px}
  p{color:var(--muted);margin:0 0 24px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 18px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px;font-weight:700;text-decoration:none}
  .primary{border-color:var(--pd);background:var(--pd);color:#fff}
  @media(prefers-color-scheme:dark){.primary{color:#0f3330}}
  .secondary:hover{border-color:var(--pd);background:var(--pl)}
</style>
</head>
<body>
<main>
  <h1>这个页面不存在</h1>
  <p>链接可能已经换了。回到产品介绍页，或者直接进站继续练。</p>
  <div class="actions">
    <a class="primary" href="/">产品介绍</a>
    <a class="secondary" href="/home">进站用用看</a>
  </div>
</main>
</body>
</html>
