<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<style>

  .eb-src{margin-top:12px;font-size:12.5px;color:var(--muted)}
  .eb-src summary{cursor:pointer;user-select:none}
  .eb-src pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--line);font:inherit;font-size:13px;line-height:1.7;max-height:260px;overflow:auto}
  .eb-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}

  /* design/85：筛选条 + 答案条 + 核心判定 + 精读折叠 + 生词 chip + 已掌握沉底 */

  .eb-answer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 10px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);font-size:15px}

  .eb-key-ev{margin-top:6px;font-size:13.5px;line-height:1.7;color:var(--muted);font-style:italic;border-left:3px solid var(--line);padding-left:10px}

  .ls-kw-chip.is-done, .ls-wbw-item.is-done{opacity:.6;border-color:var(--primary);background:var(--primary-soft)}
  .eb-known-wrap{margin-top:14px}

  .btn-armed{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}
  .eb-card.is-known{opacity:.78}
  .eb-loading{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted);font-size:14px}
  .eb-long{margin-top:6px;padding:8px 10px;background:var(--bg);border-left:3px solid var(--primary);border-radius:8px}
  .eb-long-s{font-size:14px;font-weight:600;color:var(--ink);line-height:1.6}
  .eb-long-a{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.7}

  /* ===== 10/4 01:30 语料表 B 版（她 23:37 选 B）：表格 → 双栏卡列表 =====
     表格左中文右英文在 375px 下每列只剩 ~150px，雅思长难句被压成竖排。
     卡片：上行中文、下行英文、右上删除；≤560 上下堆叠更易读。
     桌面保持「中文左英文右」的双栏观感。 */
  .cc-list{display:flex;flex-direction:column;gap:9px}
  .cc-card{position:relative;display:flex;gap:12px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .cc-card .cc-body{flex:1;min-width:0;display:flex;gap:14px;align-items:baseline}
  .cc-card .cc-cn{flex:1 1 46%;font-size:14px;line-height:1.7;color:var(--ink);word-break:break-word}
  .cc-card .cc-en{flex:1 1 54%;font-size:14px;line-height:1.7;color:var(--ink-2);word-break:break-word}
  .cc-card .cc-del{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .cc-card .cc-del svg{width:15px;height:15px}
  .cc-card .cc-del:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft,var(--n-50))}
  @media (max-width:560px){
    .cc-card{flex-wrap:wrap;padding:11px 12px}
    .cc-card .cc-body{flex-direction:column;gap:5px;width:100%}
    .cc-card .cc-cn{flex:none;width:100%}
    .cc-card .cc-en{flex:none;width:100%;color:var(--muted)}
    /* 删除按钮改绝对定位右上角，44px 触控 */
    .cc-card .cc-del{position:absolute;right:9px;top:9px;width:44px;height:44px;margin:0}
    .cc-card .cc-body{padding-right:46px}
  }

  /* ===== 听写 tab 改版（10/12 晚，她「全面大更新…现在这样完全不对」）=====
     成熟做法参考（她 10/6 铁律：动手前先搜，≥2 独立来源，10/12 实搜核实）：
     ① ListenMemo（listenmemo.com）—— 雅思听写站通例：先「选择学习内容」再进练习；
        练习/测试双模式并列成卡；错误自动归集错词本。
     ② SubLearn（sublearn.com → Dictation Practice 指南）—— 听写界面通例：播放/重播 + 语速
        分档 + 输入 + 提示系统（首字母/词数/翻译）。
     ③ DictationToday（dictationtoday.com）—— 选课程 → 听 → 打字 → 复盘 四步流程。
     结论：入口层先给「练法」两张模式卡（逐句默写 / 听写），句子库降为「材料区」；
     空态给大 CTA 引导先建材料（Quizlet/Anki 同款）。原「语料表（左中文·右英文）」
     「表格默写（隐藏英文列）」是开发者视角文案，整组退役。 */
  .dict-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
  .dm-card{display:flex;gap:12px;align-items:center;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .dm-card .dm-ico{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    background:var(--primary-50,var(--n-50));color:var(--primary)}
  .dm-card .dm-ico svg{width:20px;height:20px}
  .dm-card .dm-body{flex:1;min-width:0}
  .dm-card .dm-body b{display:block;font-size:14.5px;font-weight:700;color:var(--ink)}
  .dm-card .dm-body span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.55}
  .dm-card .btn{flex:none}
  @media (max-width:860px){ .dict-modes{grid-template-columns:1fr} }
  /* 添加面板：三种导入方式平铺 tab（替代原嵌套两层 <details>） */
  .add-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .add-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .add-tabs button.active{background:var(--primary-50,var(--n-50));border-color:var(--primary);
    color:var(--primary);font-weight:700}
  /* 库空态：大图标 + 一句话 + 主 CTA（Quizlet/Anki 空态通例） */
  .cor-empty{text-align:center;padding:34px 16px 30px}
  .cor-empty .ce-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;
    background:var(--primary-50,var(--n-50));color:var(--primary)}
  .cor-empty .ce-ico svg{width:26px;height:26px}
  .cor-empty b{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
  .cor-empty p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.7}

/* ===== 10-23 2-1d 批 B：撤页内小 tab（桌面 ≥861）。手机 ≤860 保留（顶栏隐藏时的唯一入口）。
   依据：交接\方案\T-001c-下拉重做与撤小tab-2026-10-23.md §三。不删 DOM：JS 靠 data-* 认分栏，
   sub= 交接（tbSubPending）照常工作；页内二级筛选控件不受影响。 ===== */
@media (min-width:861px){ #wordTabs{display:none} }

/* ===== S-2d（10-24）：句子库搜索框接入全站统一类 =====
   原来用顶栏同款 .ui-search/.ui-search-input —— 那套是侧栏大框规格（45px + 2px 边 + hover 5px 外环），
   宽度还跑满整个内容区。现在只留「在卡片里怎么占位」，外观全交给 .ui-field-search。
   max-width 360：与写作页（420）、口语页（360）、单词页（360）同档，搜索框不再横跨整屏。 */
.cp-search{margin:8px 0 4px}
.cp-search .ui-field-search{max-width:360px}
@media (max-width:860px){
  .cp-search .ui-field-search{max-width:none}
}

       corEn/corCn/addCorpus/bulkCorpus/importCorpus/importHint/aiImportBox/aiImportBtn/aiImportHint/dictArea
       —— startDict 此前功能完整但页面从未给按钮（corpus.js on() 安全跳过），本次一并暴露。 -->
  <div id="dictView" hidden>
    <div class="dict-modes">
      <div class="dm-card">
        <div class="dm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div>
        <div class="dm-body"><b>逐句默写</b><span>看中文提示，把英文默出来，AI 逐句判分挑错</span></div>
        <button class="btn btn-primary" id="startWrite">开始默写</button>
      </div>
      <div class="dm-card">
        <div class="dm-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg></div>
        <div class="dm-body"><b>听写</b><span>播放英文整句，写下听到的，再逐词核对（语速可调）</span></div>
        <button class="btn" id="startDict">开始听写</button>
      </div>
    </div>

    <section class="card">
      <div class="card-head" style="margin-bottom:10px">
        <h2 style="margin:0">我的句子库</h2>
        <span class="muted" style="font-size:13px">共 <b id="corpusCount">0</b> 条</span>
        <button class="btn flex-none" id="addToggle">＋ 添加句子</button>
      </div>
      <!-- S-2d（10-24）：原来用的是顶栏同款胶囊类 .ui-search/.ui-search-input ——
           那套是「侧栏大框规格」的变体（45px 高 + 2px 边框 + hover 5px 外环），
           而且宽度跑满整个内容区，一个搜索框横跨 900px 很浪费。
           现在接入 S-1 统一类（36px / 圆角 10 / 1px 边 / 放大镜 16px / 清空 ✕），max-width 收到 360。
           id 原样保留，js/corpus.js:57 的 input 监听与 194 行的过滤零改动。 -->
      <div class="cp-search">
        <label class="ui-field-search" for="corpusSearch">
          <svg class="ui-field-search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="ui-field-search-in" type="search" id="corpusSearch" placeholder="搜英文或中文…" aria-label="搜索语料" autocomplete="off" />
          <button type="button" class="ui-field-clear" hidden aria-label="清空搜索">✕</button>
        </label>
      </div>
      <div id="corpusList"></div>
      <!-- 添加面板：三种方式平铺，点「＋ 添加句子」展开 -->
      <div id="addPanel" hidden style="margin-top:12px;border-top:1px dashed var(--line);padding-top:12px">
        <div class="add-tabs">
          <button type="button" data-amt="single" class="active">单条添加</button>
          <button type="button" data-amt="bulk">批量粘贴</button>
          <button type="button" data-amt="ai">AI 识别导入</button>
        </div>
        <div id="amt-single">
          <div class="form-row" style="align-items:flex-end;gap:10px;flex-wrap:wrap">
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:4px">英文</div>
              <input aria-label="英文句子或词组" id="corEn" placeholder="英文句子 / 词组…" style="padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);width:260px" />
            </div>
            <div>
              <div class="muted" style="font-size:12px;margin-bottom:4px">中文</div>
              <input aria-label="对应中文" id="corCn" placeholder="对应中文…" style="padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);width:260px" />
            </div>
            <button class="btn btn-primary" id="addCorpus">添加</button>
          </div>
        </div>
        <div id="amt-bulk" hidden>
          <textarea id="bulkCorpus" placeholder="每行一句：英文 | 中文，如 The government should invest in public transport. | 政府应投资公交" style="width:100%;min-height:90px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);resize:vertical;box-sizing:border-box"></textarea>
          <div class="form-row" style="margin-top:8px;align-items:center">
            <button class="btn btn-primary" id="importCorpus">导入</button>
            <span id="importHint" class="muted" style="font-size:12.5px"></span>
          </div>
        </div>
        <div id="amt-ai" hidden>
          <div class="muted" style="font-size:13px;margin-bottom:6px">粘贴短语 / 词 / 句子（可纯英文），AI 自动切分并补中文释义</div>
          <textarea id="aiImportBox" placeholder="粘贴要记的内容，例如：The government should invest in public transport." style="width:100%;min-height:80px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);resize:vertical;box-sizing:border-box"></textarea>
          <div class="form-row" style="margin-top:8px;align-items:center">
            <button class="btn btn-primary" id="aiImportBtn">AI 识别并导入</button>
            <span id="aiImportHint" class="muted" style="font-size:12.5px"></span>
          </div>
        </div>
      </div>
    </section>
    <div id="dictArea"></div>
  </div>

</main>

</body>
</html>
