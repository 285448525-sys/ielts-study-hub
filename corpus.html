<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    // ⚠️ 只精准清理已知旧脏框架题（特定 id），且只删这几条、绝不清空整个 HUB_KEY——
    // 旧逻辑用 "early morning" 子串误杀正常雅思话题，会连带把手机号/API Key/发音分/全部学习数据一起抹掉。
    // ⚠️ sb_p1_home 已于 9/19 移出剔除名单：它现在是官方题库 v10 的合法 P1 题
    // （Home/accommodation，9 小问）。继续剔除会导致每次刷新永久丢 1 题（83→82）。
    var dirtyIds = ['sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed)); // 仅覆盖，保留账号/Key/分数/学习数据
    }
  }catch(e){}
})();
</script>

<style>
  /* 长难句 / 错题本 样式（原 errorbook.html 内联） */
  .eb-input{width:100%;min-height:190px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;font-size:14.5px;line-height:1.75;background:var(--bg);color:var(--ink);resize:vertical}
  .eb-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;background:var(--surface)}
  .eb-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .eb-title{font-size:15.5px;font-weight:700;line-height:1.5;margin-bottom:10px}
  .eb-block{margin-top:10px}
  .eb-block h4{margin:0 0 5px;font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.02em}
  .eb-block ol, .eb-block ul{margin:0;padding-left:20px;font-size:14px;line-height:1.75}
  .eb-block p{margin:0;font-size:14px;line-height:1.75}
  .eb-wrong{background:rgba(239,68,68,.07);border-left:3px solid var(--danger);padding:9px 12px;border-radius:8px;font-size:14px;line-height:1.7}
  .eb-rule{background:var(--primary-soft);border-left:3px solid var(--primary);padding:9px 12px;border-radius:8px;font-size:14px;line-height:1.7}
  .eb-words{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .eb-chip{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12.5px}
  .eb-src{margin-top:12px;font-size:12.5px;color:var(--muted)}
  .eb-src summary{cursor:pointer;user-select:none}
  .eb-src pre{white-space:pre-wrap;word-break:break-word;margin:8px 0 0;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--line);font:inherit;font-size:13px;line-height:1.7;max-height:260px;overflow:auto}
  .eb-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .badge-trap{background:var(--warn);color:#fff;border-color:var(--warn)}
  .badge-ok{background:var(--primary);color:#fff;border-color:var(--primary)}
  /* design/85：筛选条 + 答案条 + 核心判定 + 精读折叠 + 生词 chip + 已掌握沉底 */
  /* 10/2 大改版：筛选/搜索控件整删（她拍板），样式一并清掉 */
  .eb-answer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 10px;padding:10px 14px;border-radius:10px;background:var(--primary-soft);font-size:15px}
  .eb-a-mine{color:var(--danger);font-weight:700}
  .eb-a-correct{color:var(--ink);font-weight:600}
  .eb-a-correct b{color:var(--primary);font-size:16px}
  .eb-a-ok{color:var(--primary);font-weight:700}
  .eb-a-arrow{color:var(--muted)}
  .eb-key{border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:var(--surface)}
  .eb-key-cmp{font-size:14px;line-height:1.75;font-weight:600}
  .eb-key-ev{margin-top:6px;font-size:13.5px;line-height:1.7;color:var(--muted);font-style:italic;border-left:3px solid var(--line);padding-left:10px}
  .eb-key-rule{margin-top:8px;font-size:13.5px;line-height:1.7;color:var(--primary)}
  .eb-deep{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
  .eb-deep summary{cursor:pointer;font-size:13.5px;color:var(--muted);user-select:none}
  .eb-words-line{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .eb-why-label{display:inline-block;margin-right:8px;padding:1px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary);font-size:12px;font-weight:700;vertical-align:1px}
  .ls-kw-chip{display:inline-flex;align-items:baseline;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:5px 12px;font-size:13.5px;cursor:pointer;color:var(--ink)}
  .ls-kw-chip .ls-kw-cn{color:var(--primary);font-size:12.5px}
  .ls-kw-chip:hover{border-color:var(--primary)}
  .ls-kw-chip.is-done, .ls-wbw-item.is-done{opacity:.6;border-color:var(--primary);background:var(--primary-soft)}
  .btn-armed{background:var(--danger)!important;border-color:var(--danger)!important;color:#fff!important}
  .eb-card.is-known{opacity:.78}
  .eb-long{margin-top:6px;padding:8px 10px;background:var(--bg);border-left:3px solid var(--primary);border-radius:8px}
  .eb-long-s{font-size:14px;font-weight:600;color:var(--ink);line-height:1.6}
  .eb-long-a{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.7}

  /* ===== 10/4 01:30 语料表 B 版（她 23:37 选 B）：表格 → 双栏卡列表 =====
     表格左中文右英文在 375px 下每列只剩 ~150px，雅思长难句被压成竖排。
     卡片：上行中文、下行英文、右上删除；≤560 上下堆叠更易读。
     桌面保持「中文左英文右」的双栏观感。 */
  .cc-list{display:flex;flex-direction:column;gap:9px}
  .cc-card{position:relative;display:flex;gap:12px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .cc-card .cc-body{flex:1;min-width:0;display:flex;gap:14px;align-items:baseline}
  .cc-card .cc-cn{flex:1 1 46%;font-size:14px;line-height:1.7;color:var(--ink);word-break:break-word}
  .cc-card .cc-en{flex:1 1 54%;font-size:14px;line-height:1.7;color:var(--ink-2);word-break:break-word}
  .cc-card .cc-del{flex:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:.15s}
  .cc-card .cc-del svg{width:15px;height:15px}
  .cc-card .cc-del:hover{color:var(--danger);border-color:var(--danger);background:var(--danger-soft,var(--n-50))}
  @media (max-width:560px){
    .cc-card{flex-wrap:wrap;padding:11px 12px}
    .cc-card .cc-body{flex-direction:column;gap:5px;width:100%}
    .cc-card .cc-cn{flex:none;width:100%}
    .cc-card .cc-en{flex:none;width:100%;color:var(--muted)}
    /* 删除按钮改绝对定位右上角，44px 触控 */
    .cc-card .cc-del{position:absolute;right:9px;top:9px;width:44px;height:44px;margin:0}
    .cc-card .cc-body{padding-right:46px}
  }

  /* ===== 听写 tab 改版（10/12 晚，她「全面大更新…现在这样完全不对」）=====
     成熟做法参考（她 10/6 铁律：动手前先搜，≥2 独立来源，10/12 实搜核实）：
     ① ListenMemo（listenmemo.com）—— 雅思听写站通例：先「选择学习内容」再进练习；
        练习/测试双模式并列成卡；错误自动归集错词本。
     ② SubLearn（sublearn.com → Dictation Practice 指南）—— 听写界面通例：播放/重播 + 语速
        分档 + 输入 + 提示系统（首字母/词数/翻译）。
     ③ DictationToday（dictationtoday.com）—— 选课程 → 听 → 打字 → 复盘 四步流程。
     结论：入口层先给「练法」两张模式卡（逐句默写 / 听写），句子库降为「材料区」；
     空态给大 CTA 引导先建材料（Quizlet/Anki 同款）。原「语料表（左中文·右英文）」
     「表格默写（隐藏英文列）」是开发者视角文案，整组退役。 */
  .dict-modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 14px}
  .dm-card .btn{flex:none}
  /* 添加面板：三种导入方式平铺 tab（替代原嵌套两层 <details>） */
  .add-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .add-tabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .add-tabs button.active{background:var(--primary-50,var(--n-50));border-color:var(--primary);
    color:var(--primary);font-weight:700}
  /* 库空态：大图标 + 一句话 + 主 CTA（Quizlet/Anki 空态通例） */
  .cor-empty{text-align:center;padding:34px 16px 30px}
  .cor-empty .ce-ico{width:52px;height:52px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;
    background:var(--primary-50,var(--n-50));color:var(--primary)}
  .cor-empty .ce-ico svg{width:26px;height:26px}
  .cor-empty b{display:block;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:5px}
  .cor-empty p{margin:0 0 14px;font-size:13px;color:var(--muted);line-height:1.7}

/* ===== 10-23 2-1d 批 B：撤页内小 tab（桌面 ≥861）。手机 ≤860 保留（顶栏隐藏时的唯一入口）。
   依据：交接\方案\T-001c-下拉重做与撤小tab-2026-10-23.md §三。不删 DOM：JS 靠 data-* 认分栏，
   sub= 交接（tbSubPending）照常工作；页内二级筛选控件不受影响。 ===== */
@media (min-width:861px){ #wordTabs{display:none} }

/* ===== S-2d（10-24）：句子库搜索框接入全站统一类 =====
   原来用顶栏同款 .ui-search/.ui-search-input —— 那套是侧栏大框规格（45px + 2px 边 + hover 5px 外环），
   宽度还跑满整个内容区。现在只留「在卡片里怎么占位」，外观全交给 .ui-field-search。
   max-width 360：与写作页（420）、口语页（360）、单词页（360）同档，搜索框不再横跨整屏。 */
.cp-search{margin:8px 0 4px}
.cp-search .ui-field-search{max-width:360px}
@media (max-width:860px){
  .cp-search .ui-field-search{max-width:none}
}

.cp2-bar-labels span{flex:1;text-align:center;font-size:10px;color:var(--ct-muted-2)}
.cp2-mini-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--ct-line-2);min-height:60px}
.cp2-mini-row:last-child{border-bottom:0}
.cp2-mini-row .grow{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.cp2-mini-row .t{display:block;font-size:12.5px;font-weight:650;color:var(--ct-ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp2-mini-row .d{display:block;font-size:11px;color:var(--ct-muted-2)}
.cp2-pill{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ct-bg);color:var(--ct-muted);white-space:nowrap;flex:none}
.cp2-pill.warn{background:var(--ct-amber-50);color:var(--ct-amber)}
.cp2-pill.key{background:var(--ct-teal-50);color:var(--ct-teal-700)}
.cp2-pill.cur{background:var(--ct-teal);color:#fff}
.cp2-empty{padding:34px 20px;text-align:center;border:1px dashed var(--ct-line);
  border-radius:var(--ct-radius);background:var(--ct-surface);font-size:12.5px;color:var(--ct-muted);line-height:1.6}
.cp2-empty b{display:block;font-size:14px;color:var(--ct-ink);margin-bottom:6px}
.cp2-samples[hidden]{display:none!important}
.cp2-samples{margin-top:14px;overflow:hidden;border:1px solid var(--line);border-radius:14px;
  background:var(--surface);box-shadow:0 1px 2px rgba(24,40,48,.04),0 6px 18px -12px rgba(24,40,48,.18)}
.cp2-samples-head{padding:12px 18px 0}
.cp2-samples-head h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.cp2-sample{display:flex;align-items:center;gap:14px;width:100%;padding:13px 18px;border:0;
  border-top:1px solid var(--line-soft);background:transparent;font:inherit;color:var(--ink);
  text-align:left;cursor:pointer;transition:background .14s}
.cp2-sample:first-child{border-top:0}
.cp2-sample:hover{background:var(--surface-2)}
.cp2-sample span{flex:1;min-width:0;font-size:12.5px;line-height:1.55}
.cp2-sample i{flex:none;font-style:normal;font-size:11.5px;font-weight:650;color:var(--muted);
  white-space:nowrap;transition:color .14s}
.cp2-sample:hover i{color:var(--primary-700)}
.cp2-mobile-tabs{display:none}
body.exam-fullscreen .cp2-pane{display:none!important}
@media(max-width:980px){.cp2-two-col{grid-template-columns:minmax(0,1fr)}}
@media(max-width:860px){
  .cp2-mobile-tabs{display:flex;gap:4px;overflow-x:auto;padding:8px 0 12px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
  .cp2-mobile-tabs button{flex:none;min-height:38px;padding:8px 14px;border:1px solid var(--ct-line);
    border-radius:10px;background:var(--ct-surface);color:var(--ct-ink-2);font:inherit;font-size:12.5px;white-space:nowrap;cursor:pointer}
  .cp2-mobile-tabs button.on{background:var(--ct-ink);color:#fff;border-color:var(--ct-ink)}
  .cp2-stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cp2-vhead h1{font-size:18px}
}
/* ===== CORPUS-VIEWS-2（v834）：四个功能栏按已点头 CORPUS-TABS-1 稿补栏头并就地重皮 =====
   只加栏头与组件皮肤；既有 DOM / ID / 数据落点 / 事件绑定一个不删不改，
