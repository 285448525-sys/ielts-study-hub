    <path d="M292 300 C288 210 330 158 400 158 C470 158 512 210 508 300 C514 356 520 396 534 430 L470 452 C462 420 460 386 460 356 L340 356 C340 386 338 420 330 452 L266 430 C280 396 286 356 292 300 Z" fill="#5a4030"/>
