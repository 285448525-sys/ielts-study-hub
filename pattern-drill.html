<meta charset="UTF-8" />

<meta http-equiv="Expires" content="0" />
<script>
(function autoCleanOldBank(){
  try{
    var key = 'ielts_study_hub_v1';
    var raw = localStorage.getItem(key);
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(!parsed || !Array.isArray(parsed.speaking)) return;
    var dirtyIds = ['sb_p1_home','sb_p2_travel','sb_p2_earlymorning'];
    var before = parsed.speaking.length;
    var kept = parsed.speaking.filter(function(s){ return !(s && dirtyIds.indexOf(s.id) >= 0); });
    if(kept.length !== before){
      parsed.speaking = kept;
      localStorage.setItem(key, JSON.stringify(parsed));
    }
  }catch(e){}
})();
</script>
<title>句型闯关 · 雅思备考 Hub</title>

<style>
  .pd-meta{font-size:13px;color:var(--muted);margin-left:auto;align-self:center}
  .pd-progress{height:6px;background:var(--bg);border-radius:20px;overflow:hidden;margin:0 0 14px}
  .pd-progress-fill{height:100%;width:0;background:var(--primary);border-radius:20px;transition:width .25s ease}
  .pd-tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:12px;background:var(--primary-soft);color:var(--primary);margin-bottom:8px}
  .pd-tag.rev{background:rgba(245,158,11,.16);color:var(--warn)}
  .pd-pending{padding:9px 13px;background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);border-radius:var(--radius);color:var(--warn);font-size:13px;margin:10px 0 0}
  .pd-cn{font-size:21px;font-weight:700;line-height:1.5;margin-bottom:6px}
  .pd-wrong{font-size:13.5px;color:var(--muted);background:rgba(239,68,68,.06);border-left:3px solid var(--danger);padding:8px 12px;border-radius:8px;margin-bottom:12px;line-height:1.6}
  .pd-wrong b{color:var(--danger)}
  .pd-input{width:100%;min-height:90px;padding:13px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;font-size:15px;line-height:1.7;background:var(--bg);color:var(--ink);resize:vertical}
  .pd-input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .pd-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .pd-status{font-size:13px;color:var(--muted);margin-left:4px}
  .pd-feedback{margin-top:12px;font-size:14.5px;line-height:1.7;display:none}
  .pd-feedback.ok{display:block;color:var(--primary);background:var(--primary-soft);padding:10px 12px;border-radius:8px}
  .pd-feedback.bad{display:block;color:var(--danger);background:rgba(239,68,68,.07);border-left:3px solid var(--danger);padding:10px 12px;border-radius:8px}
  .pd-feedback.info{display:block;color:var(--ink);background:var(--bg);border-left:3px solid var(--primary);padding:10px 12px;border-radius:8px}
  .pd-ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .pd-ov-box{border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .pd-ov-box h3{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:700}
  .pd-ov-box .num{font-size:24px;font-weight:800;color:var(--primary)}
  .pd-ov-list{margin:10px 0 0;padding-left:0;list-style:none}
  .pd-ov-list li{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
  .pd-ov-list li:last-child{border-bottom:0}
  .pd-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .pd-dot.new{background:var(--primary)}
  .pd-dot.rev{background:var(--warn)}
  .pd-dot.done{background:var(--ok,#22c55e)}
  .pd-actions{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .pd-note{font-size:12.5px;color:var(--muted);line-height:1.7;margin-top:12px}
    #trainCard,#finishCard{ margin-bottom:150px }   /* 底部给悬浮计时器+dock 让位：否则滚动到底时提交按钮被固定层盖住（9/9 实测） */
  .pd-section-title{font-size:14px;font-weight:700;margin:0 0 6px}
  @media (max-width:560px){ .pd-ov-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="bootLoader" class="hub-loader show" aria-hidden="true"><div class="ui-loader" role="status" aria-label="Loading"><span class="ui-loader-dot"></span><span class="ui-loader-dot m2"></span><span class="ui-loader-dot m3"></span><span class="ui-loader-shadow"></span><span class="ui-loader-shadow m2"></span><span class="ui-loader-shadow m3"></span></div></div>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <div class="page-head-row">
    <h1 class="page-title">句型闯关</h1>
    <div class="pd-meta" id="pdMeta"></div>
  </div>

  <div class="pd-pending" id="pdPendingTop" hidden></div>

  <section class="card" id="overview">
    <h2>今日任务</h2>
    <div id="ovBody"></div>
    <div class="pd-bar" style="margin-top:10px">
      <button class="btn btn-ghost" id="pdImportBtn" style="min-height:36px">导入句型</button>
      <span class="pd-note" id="pdSyncNote" style="margin:0"></span>
    </div>
    <div id="pdImportPanel" hidden style="margin-top:10px">
      <textarea id="pdImportText" class="pd-input" style="min-height:70px" placeholder="粘贴你想练的内容：中文句 / 英文句 / 错句+改正 / 笔记，AI 自动识别并入库"></textarea>
      <div class="pd-bar">
        <button class="btn btn-primary" id="pdImportParse">AI 解析</button>
        <button class="btn btn-ghost" id="pdImportCancel">收起</button>
      </div>
      <div id="pdImportResult"></div>
    </div>
  </section>

  <section class="card" id="trainCard" style="display:none">
    <div class="pd-progress"><div class="pd-progress-fill" id="pdProgressFill"></div></div>
    <span class="pd-tag" id="pdTag"></span>
    <div class="pd-cn" id="pdCn"></div>
    <div class="pd-wrong" id="pdWrong"></div>
    <textarea id="pdAnswer" class="pd-input" placeholder="输入你的英文（也可以用输入法语音转文字后粘贴）" autocomplete="off"></textarea>
    <div class="pd-bar">
      <button class="btn btn-primary" id="pdSubmit">提交</button>
      <button class="btn btn-ghost" id="pdHint">提示</button>
      <button class="btn btn-ghost" id="pdSkip">跳过</button>
      <button class="btn btn-ghost" id="pdReveal" style="display:none">看正确句</button>
      <span class="pd-status" id="pdStatus" aria-live="polite"></span>
    </div>
    <div class="pd-feedback" id="pdFeedback"></div>
  </section>

  <section class="card" id="finishCard" style="display:none">
    <h2 id="finishTitle"></h2>
    <div id="finishBody"></div>
  </section>
</main>

</body>
</html>
