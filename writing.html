<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>写作 · 雅思备考 Hub</title>
<link rel="stylesheet" href="css/common.css" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png?v=4">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#3a9a93" />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<script defer src="js/data.js"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/writing_prompts.js"></script>
  <script defer src="js/writing.js"></script>
<style>
  .write-tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:16px}
  .write-tabs button{flex:1;padding:12px 0;font-size:16px;font-weight:600;border:none;background:none;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:all .2s}
  .write-tabs button.active{color:var(--primary);border-bottom-color:var(--primary)}

  .write-layout{display:flex;gap:16px;align-items:flex-start}
  .cat-nav{width:160px;flex:none;display:flex;flex-direction:column;gap:6px}
  .cat-nav button{text-align:left}
  .cat-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .write-main{flex:1;min-width:0}
  .write-layout.detail-open{display:block}
  .write-layout.detail-open .cat-nav{display:none}
  .tpl-card{cursor:pointer}
  .ph{background:var(--warn);color:#fff;padding:0 4px;border-radius:4px;font-weight:600}
  .ph-input{border:none;border-bottom:1px solid var(--muted);background:transparent;padding:1px 2px;font:inherit;font-size:15px;color:var(--ink);margin:0 2px;min-width:48px}
  .ph-input:focus{outline:none;border-bottom-color:var(--primary)}
  .skeleton-box{white-space:pre-wrap;line-height:1.9;font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .preview-box{white-space:pre-wrap;line-height:1.9;font-size:15px;border:1px dashed var(--primary);border-radius:var(--radius);padding:14px;margin-top:8px}
  .preview-box u{text-decoration:underline;color:var(--primary-d);font-weight:600}
  .tips-box{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.7}
  @media(max-width:860px){ .write-layout{flex-direction:column} .cat-nav{width:100%;flex-direction:row;flex-wrap:wrap} }

  /* AI 评分 */
  .score-essay{width:100%;min-height:200px;padding:12px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);resize:vertical;box-sizing:border-box;line-height:1.8}
  .score-result{margin-top:16px;display:none}
  .score-overall{font-size:28px;font-weight:700;color:var(--primary)}
  .score-breakdown{display:flex;gap:16px;margin:8px 0 16px;flex-wrap:wrap}
  .score-item{padding:8px 14px;border:1px solid var(--line);border-radius:var(--radius);text-align:center}
  .score-item b{display:block;font-size:18px;color:var(--primary)}
  .score-item span{font-size:12px;color:var(--muted)}
  .score-section{margin-bottom:14px}
  .score-section h4{font-size:14px;margin:0 0 6px;color:var(--ink)}
  .score-section ul{margin:0;padding-left:20px;line-height:1.8;font-size:14px}
  .score-section li{margin-bottom:4px}

  /* 评分记录（A1，仿 27-mockup） */
  .hist{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .hist-row{border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden}
  .hist-h{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;transition:background .15s;flex-wrap:wrap}
  .hist-h:hover{background:var(--surface-2)}
  .hist-date{font-size:12px;color:var(--muted);white-space:nowrap}
  .hist-tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--primary-soft);color:var(--med);border:1px solid var(--line);font-weight:600;white-space:nowrap}
  .hist-title{flex:1;min-width:0;font-size:13.5px;color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hist-score{font-size:14px;font-weight:800;color:var(--primary);white-space:nowrap}
  .hist-caret{color:var(--muted);font-size:12px;transition:transform .2s}
  .hist-row.open .hist-caret{transform:rotate(90deg)}
  .hist-body{display:none;padding:12px;border-top:1px dashed var(--line);background:var(--surface-2);font-size:13px}
  .hist-row.open .hist-body{display:block}
  .hist-empty{font-size:13px;color:var(--muted);padding:18px 10px;text-align:center;border:1px dashed var(--line);border-radius:var(--radius-sm)}

  /* 模板填空 → AI 评分（紧凑版） */
  .tpl-score{margin-top:12px;border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--surface)}
  .tpl-score .ts-load{color:var(--muted);font-size:14px}
  .ts-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .ts-overall{font-size:26px;font-weight:800;color:var(--primary);line-height:1}
  .ts-dims{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin-bottom:12px}
  .ts-dim{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg)}
  .ts-dim-h{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:700}
  .ts-dim-h b{font-size:16px;color:var(--primary)}
  .ts-dim-r{font-size:13px;line-height:1.6;margin-top:4px}
  .ts-sec{margin-top:10px}
  .ts-sec h4{margin:0 0 6px;font-size:13px;color:var(--muted);font-weight:700}
  .ts-gram{border-left:3px solid var(--danger);background:rgba(239,68,68,.06);border-radius:8px;padding:8px 11px;margin-bottom:6px;font-size:13.5px;line-height:1.7}
  .ts-gram s{color:var(--muted)}
  .ts-gram b{color:var(--primary-d)}
  .ts-fix{border-left:3px solid var(--primary);background:var(--primary-soft);border-radius:8px;padding:8px 11px;font-size:13.5px;line-height:1.7}

  /* 填空 AI 按需提示 */
  .ph-wrap{position:relative;display:inline-block}
  .ph-hint{border:none;background:none;cursor:pointer;font-size:13px;padding:0 2px;color:var(--muted);vertical-align:middle}
  .ph-hint:hover{color:var(--primary)}
  .ph-hint-box{display:inline-flex;align-items:center;gap:6px;margin-left:6px;font-size:13px;color:var(--muted);vertical-align:middle}
  .ph-fill{font-weight:600;color:var(--primary-d)}
  .ph-why{color:var(--muted);font-size:12px}
  .ph-use{border:1px solid var(--line);background:var(--surface);color:var(--primary);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:12px}

  /* 万能语料库 */
  .bank-card{display:flex;flex-direction:column;gap:6px}
  .bank-en{font-size:15px;font-weight:600;color:var(--ink);line-height:1.5}
  .bank-tag{font-size:11px;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:500}
  .bank-detail{font-size:13px;color:var(--muted);line-height:1.6}
  .bank-ex{margin-top:4px;font-style:italic}
  .bank-actions{display:flex;gap:8px;margin-top:2px}
  .bank-toggle,.bank-del{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:2px 10px;cursor:pointer;font-size:12.5px;color:var(--muted)}
  .bank-toggle:hover,.bank-del:hover{color:var(--primary);border-color:var(--primary)}

  /* 写作真题 */
  .exam-list{display:flex;flex-direction:column;gap:18px}
  .exam-group-title{font-size:14px;font-weight:700;color:var(--primary);margin:4px 0 6px;padding-left:8px;border-left:3px solid var(--primary)}
  .exam-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s}
  .exam-item:hover{border-color:var(--primary);background:var(--surface)}
  .exam-item .ei-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .exam-item .ei-no{font-size:12px;font-weight:700;color:var(--muted)}
  .exam-item .ei-type{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--primary-soft);color:var(--med);font-weight:600;white-space:nowrap}
  .exam-item .ei-meta{font-size:12px;color:var(--muted)}
  .exam-item .ei-zh{font-size:14px;color:var(--ink);line-height:1.6;margin-top:6px}
  .exam-item .ei-en{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.6}
  .exam-timer{position:absolute;right:10px;bottom:8px;display:inline-flex;align-items:center;gap:4px;background:var(--primary);color:#fff;border-radius:20px;padding:4px 12px;font-weight:700;font-size:14px;box-shadow:0 2px 8px rgba(58,154,147,.25)}
  .exam-timer #examTimerBtn{color:#fff}
</style>
</head>
<body>
<nav class="top-nav" id="mainNav"><div class="top-nav-inner"></div></nav>

<main class="container">
  <h1 class="page-title">写作</h1>

  <div class="write-tabs" id="writeTabs">
    <button data-tab="tpl" class="active">模板库</button>
    <button data-tab="bank">语料库</button>
    <button data-tab="score">AI 评分</button>
    <button data-tab="exam">写作真题</button>
  </div>

  <!-- 模板库面板 -->
  <div id="tplPanel">
    <div class="write-layout">
      <div class="cat-nav card" id="catNav" style="padding:10px"></div>
      <div class="write-main">
        <section class="card" id="listCard">
          <h2>模板列表</h2>
          <div id="tplList" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:10px"></div>
          <div id="empty" class="empty-state" hidden>还没有模板。点「+ 新增模板」添加。</div>
        </section>

        <section class="card" id="detailCard" hidden>
          <div class="form-row" style="align-items:center">
            <h2 id="dTitle" style="margin:0"></h2>
            <button class="btn btn-primary" id="tplDictBtn" style="margin-left:auto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4a3 3 0 0 1 6 0M9 10h6M9 14h6"/></svg>默写</button>
            <button class="btn" id="backBtn">返回</button>
          </div>

          <div class="tpl-edit">
            <h3>作文骨架</h3>
            <div id="skeleton" class="skeleton-box"></div>
            <h3>填空练习</h3>
            <div id="practice" style="margin-top:8px"></div>
          </div>

          <div class="tpl-text">
            <h3>完整句（实时）</h3>
            <div id="preview" class="preview-box"></div>
            <div class="form-row" style="margin-top:10px;align-items:center">
              <button class="btn btn-primary" id="tplScoreBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="5" y="7" width="14" height="12" rx="3"/><path d="M12 7V3M9 3h6"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14.5" cy="12.5" r="1"/><path d="M9 16h6"/></svg>AI 按官方 4 维度评分</button>
              <button class="btn" id="tplCopyBtn">复制填好的内容</button>
              <span class="muted" id="tplFillHint" style="font-size:12.5px"></span>
            </div>
            <div id="tplScoreBox" class="tpl-score" hidden></div>
          </div>

          <div id="tips" class="tips-box"></div>
          <div class="form-row" style="margin-top:12px">
            <button class="btn btn-danger" id="delBtn">删除模板</button>
          </div>
        </section>

        <section class="card" id="addCard" hidden>
          <h2>新增模板</h2>
          <div class="form-row">
            <select id="a_cat">
              <option value="动态图">动态图</option><option value="静态图">静态图</option><option value="地图题">地图题</option><option value="流程图">流程图</option>
              <option value="观点型">观点型</option><option value="讨论型">讨论型</option><option value="Report">Report</option>
            </select>
            <input id="a_title" placeholder="模板标题" />
          </div>
          <textarea id="a_skeleton" placeholder="骨架原句，填空位用【】包裹，如 The figure for【A】was higher than【B】" style="width:100%;min-height:120px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);resize:vertical;box-sizing:border-box"></textarea>
          <textarea id="a_tips" placeholder="使用提示（可选）" style="width:100%;min-height:60px;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);resize:vertical;box-sizing:border-box;margin-top:8px"></textarea>
          <div class="form-row" style="align-items:flex-end;margin-top:10px">
            <button class="btn btn-primary" id="a_save">保存模板</button>
            <button class="btn" id="a_cancel">取消</button>
          </div>
        </section>
      </div>
    </div>
    <div class="form-row" style="margin-top:14px">
      <button class="btn btn-primary" id="addBtn">+ 新增模板</button>
    </div>
  </div>

  <!-- 语料库面板 -->
  <div id="bankPanel" hidden>
    <section class="card">
      <h2>写作万能语料</h2>
      <p class="muted" style="font-size:13px">把模板 + 这套万能词组/句式背完，基本能套市面上所有雅思题。点「看释义」自测背诵，可自己增删。</p>
      <div class="form-row" style="align-items:center;gap:8px">
        <select id="bankFilter">
          <option value="all">全部</option>
          <option value="词组">万能词组</option>
          <option value="句式">万能句式</option>
        </select>
        <button class="btn btn-primary" id="bankAddBtn">+ 新增语料</button>
      </div>
      <div id="bankList" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:10px"></div>
    </section>
    <section class="card" id="bankAddCard" hidden>
      <h2>新增语料</h2>
      <div class="form-row">
        <select id="ba_type"><option value="词组">万能词组</option><option value="句式">万能句式</option></select>
        <input id="ba_en" placeholder="英文（句式可用 [X] 表示可替换处）" />
      </div>
      <input id="ba_cn" placeholder="中文释义 / 用法说明" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);box-sizing:border-box;margin-top:8px" />
      <input id="ba_tag" placeholder="标签（观点/对比/举例/因果/结论/建议，可选）" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);box-sizing:border-box;margin-top:8px" />
      <input id="ba_ex" placeholder="例句（可选）" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius);font:inherit;background:var(--bg);color:var(--ink);box-sizing:border-box;margin-top:8px" />
      <div class="form-row" style="align-items:flex-end;margin-top:10px">
        <button class="btn btn-primary" id="ba_save">保存</button>
        <button class="btn" id="ba_cancel">取消</button>
      </div>
    </section>
  </div>

  <!-- AI 评分面板 -->
  <div id="scorePanel" hidden>
    <section class="card">
      <h2>AI 作文评分</h2>
      <p class="muted" style="font-size:13px;margin-bottom:12px">粘贴完整 Task 2 作文，AI 按 TR / CC / LR / GRA 给出预估分并标出长/复杂句。</p>
      <div class="form-row" style="margin-bottom:10px">
        <select id="scoreType" style="flex:none">
          <option value="大作文">大作文（Task 2）</option>
          <option value="小作文">小作文（Task 1）</option>
        </select>
      </div>
      <div style="position:relative">
        <textarea class="score-essay" id="scoreEssay" placeholder="在此粘贴你的作文（至少 150 词）…" style="padding-bottom:30px"></textarea>
        <span id="scoreWordCount" class="muted" style="font-size:12px;font-weight:700;position:absolute;right:10px;bottom:8px;color:var(--warn-ink);pointer-events:none">0 词</span>
      </div>
      <div class="form-row" style="margin-top:10px">
        <button class="btn btn-primary" id="scoreBtn">开始评分</button>
      </div>
    </section>

    <section class="card score-result" id="scoreResult">
      <div id="scoreResultBody"></div>
    </section>

    <section class="card" id="scoreHistCard" style="margin-top:16px">
      <div class="form-row" style="align-items:center">
        <h2>评分记录</h2>
        <button class="btn" id="scoreHistClear" style="margin-left:auto;color:var(--muted)">清空记录</button>
      </div>
      <p class="muted" style="font-size:13px;margin:-4px 0 10px">每次模板评分 / 整篇评分自动存这里，点开可回看明细。</p>
      <div id="scoreHistList"></div>
    </section>
  </div>

  <!-- 写作真题面板 -->
  <div id="examPanel" hidden>
    <!-- 题目列表 -->
    <section class="card" id="examHome">
      <div class="form-row" style="align-items:center;gap:10px;flex-wrap:wrap">
        <h2 style="margin:0">写作真题</h2>
        <span class="muted" style="font-size:13px">选择一道题开始练习，点进去自动计时</span>
        <select id="examFilter" style="margin-left:auto">
          <option value="all">全部</option>
          <option value="big">大作文（Task 2）</option>
          <option value="small">小作文（Task 1）</option>
        </select>
      </div>
      <div id="examList" class="exam-list" style="margin-top:12px"></div>
    </section>

    <!-- 练习界面 -->
    <section class="card" id="examPractice" hidden>
      <div class="form-row" style="align-items:center">
        <h2 id="examPTitle" style="margin:0"></h2>
        <button class="btn" id="examBack" style="margin-left:auto">返回题目</button>
      </div>
      <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-top:8px">
        <div style="flex:1;min-width:280px">
          <div class="exam-qmeta" id="examQMeta" style="margin-bottom:8px"></div>
          <div class="skeleton-box" id="examQuestion" style="margin-top:0"></div>
        </div>
        <div style="flex:1;min-width:280px;position:relative">
          <textarea id="examEssay" class="score-essay" placeholder="在此写作文。计时器已在右下角自动开始，写完点「AI 按官方 4 维度评分」即可。"></textarea>
          <span id="examWordCount" class="muted" style="font-size:12px;font-weight:700;position:absolute;right:10px;bottom:38px;color:var(--warn-ink);pointer-events:none">0 词</span>
          <!-- 右下角计时器 -->
          <div id="examTimer" class="exam-timer" title="本次练习计时">
            <span id="examTimerText">00:00:00</span>
            <span id="examTimerBtn" style="cursor:pointer;margin-left:8px;font-size:13px">⏸</span>
          </div>
        </div>
      </div>
      <div class="form-row" style="margin-top:12px;align-items:center">
        <button class="btn btn-primary" id="examScoreBtn">AI 按官方 4 维度评分</button>
        <span class="muted" style="font-size:13px">计时仅记录，不强制限时</span>
      </div>
      <div id="examResult" class="tpl-score" hidden></div>
    </section>
  </div>

  <!-- 默写面板已移除：原「默写」tab 改为「写作真题」；语料库默写另建 -->
  <div id="dictationPanel" hidden style="display:none"></div>
</main>
